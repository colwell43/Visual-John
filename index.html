tps://pixabay.com/photos/forest-6288916/","user":""},{"where":"John 14, The Promise of the Holy Spirit","desc":"Two friends walking hand in hand","page":"https://pixabay.com/photos/woman-4012461/","user":""},{"where":"John 14, Peace I Leave with You","desc":"A calm lake in morning mist","page":"https://pixabay.com/photos/mist-4296587/","user":""},{"where":"John 15, opening photo","desc":"Green grapes hanging on the vine","page":"https://pixabay.com/photos/grapes-276070/","user":""},{"where":"John 15, The Vine and the Branches","desc":"Pruning shears on a stump among cut branches","page":"https://pixabay.com/photos/pruning-2285113/","user":""},{"where":"John 15, Remain in My Love","desc":"Two boys laughing with their arms around each other","page":"https://pixabay.com/photos/people-2583562/","user":""},{"where":"John 15, When the World Hates You","desc":"A young woman standing alone in a crowd","page":"https://pixabay.com/photos/woman-2666433/","user":""},{"where":"John 16, opening photo","desc":"A hand holding a compass by a mountain lake","page":"https://pixabay.com/photos/compass-4891499/","user":""},{"where":"John 16, Sorrow Will Turn to Joy","desc":"A mother holding her sleeping baby","page":"https://pixabay.com/photos/mother-2262750/","user":""},{"where":"John 16, Sorrow Will Turn to Joy","desc":"Two open hands","page":"https://pixabay.com/photos/the-palm-of-your-hand-2704020/","user":""},{"where":"John 16, I Have Overcome the World","desc":"A climber standing on a mountain summit","page":"https://pixabay.com/photos/success-5941539/","user":""},{"where":"John 17, opening photo","desc":"Silhouette of a person praying at sunset","page":"https://pixabay.com/photos/religion-3443282/","user":""},{"where":"John 17, Jesus Prays for Himself","desc":"A man looking up toward the light","page":"https://pixabay.com/photos/nature-1706767/","user":""},{"where":"John 17, Jesus Prays for His Disciples","desc":"A person under an umbrella in the light rain","page":"https://pixabay.com/photos/umbrella-6239364/","user":""},{"where":"John 17, Jesus Prays for All Believers","desc":"Many hands joined together","page":"https://pixabay.com/photos/hands-2847508/","user":""},{"where":"John 18, opening photo","desc":"Torches burning in the dark","page":"https://pixabay.com/photos/fire-1943598/","user":""},{"where":"John 18, Jesus Is Arrested","desc":"Old swords in a row","page":"https://pixabay.com/photos/swords-6976024/","user":""},{"where":"John 18, Peter Denies Jesus","desc":"Glowing charcoal embers","page":"https://pixabay.com/photos/bbq-810545/","user":""},{"where":"John 18, Jesus Before Pilate","desc":"A small silver crown","page":"https://pixabay.com/photos/crown-1866986/","user":""},{"where":"John 19, opening photo","desc":"A crown of thorns on an open Bible","page":"https://pixabay.com/photos/crown-699480/","user":""},{"where":"John 19, The Crucifixion","desc":"Three crosses against a sunset sky","page":"https://pixabay.com/photos/crosses-671379/","user":""},{"where":"John 19, The Crucifixion","desc":"Woven cloth","page":"https://pixabay.com/photos/texture-1099399/","user":""},{"where":"John 19, The Burial of Jesus","desc":"A stone tomb building in a garden","page":"https://pixabay.com/photos/dexter-mausoleum-1005284/","user":""},{"where":"John 20, opening photo","desc":"The sun breaking through trees at dawn","page":"https://pixabay.com/photos/sunlight-3130638/","user":""},{"where":"John 20, The Empty Tomb","desc":"A runner on an open road","page":"https://pixabay.com/photos/jogging-2343558/","user":""},{"where":"John 20, Jesus Appears to Mary Magdalene","desc":"A flowering tree in early morning sunlight","page":"https://pixabay.com/photos/sunrise-4143735/","user":""},{"where":"John 20, Jesus Appears to the Disciples","desc":"An old door with heavy iron fittings","page":"https://pixabay.com/photos/door-2395107/","user":""},{"where":"John 21, opening photo","desc":"A man standing on a misty lake shore in the morning","page":"https://pixabay.com/photos/fog-2426131/","user":""},{"where":"John 21, Breakfast by the Sea","desc":"Fishermen working with their nets","page":"https://pixabay.com/photos/fishing-net-4887070/","user":""},{"where":"John 21, Breakfast by the Sea","desc":"Fish roasting over an open fire","page":"https://pixabay.com/photos/flame-grilled-salmon-6830511/","user":""},{"where":"John 21, Jesus Restores Peter","desc":"A ewe with two young lambs","page":"https://pixabay.com/photos/sheep-7200918/","user":""}],"master":{"welcome":"Master Questions. Three questions go with you through the whole book. You will find them again at the end of every chapter, with a box for your response, and the Summary after John 21 reviews them for the whole book. Responses and highlights are kept on this device only.","after":2,"chapter":"Step back and look at John {n} as a whole.","items":[["head","HEAD","What was the historical and cultural context of the original readers? What did this passage mean to them? (Context can be hard to know for sure, but it is important and helpful to consider.)"],["heart","HEART","What does this passage reveal about who God is? How does my heart respond to who He is? Is my heart open to Him as He reveals Himself? Am I judging God?"],["action","ACTION","What actions is God impressing on me to take? What should I carry with me into the future from this book?"]]},"summary":{"img":null,"intro":"You have read all 21 chapters of John. This Summary looks back over the whole book through the three Master Questions. Read each review, then write your own response in the boxes at the end.","respond":"Now answer the Master Questions for the whole Gospel of John.","parts":[["head","Here is what we can say about the people who first read John.",[["Written so that readers would believe","John tells us why he wrote: “these are written, that you may believe that Jesus is the Christ, the Son of God, and that believing you may have life in his name” (20:31)."],["An eyewitness","The author calls himself “the disciple whom Jesus loved” (21:20) and says, “This is the disciple who testifies about these things, and wrote these things” (21:24). The early church agreed that he was John, the son of Zebedee."],["Readers in a wider world","John explains Hebrew words such as Rabbi and Messiah (1:38, 41) and Jewish customs such as Passover. Many of his first readers were probably Gentiles, or Jews living far from the land of Israel."],["Under pressure","Some believers were being put out of the synagogue for confessing Jesus (9:22; 16:2). John encouraged them to remain in Jesus and to love one another (15:4, 12)."],["What the book meant to them","John showed them that Jesus is God’s Word made flesh, and that real life is found by believing in him. That life begins now: “This is eternal life, that they should know you, the only true God, and him whom you sent, Jesus Christ” (17:3)."]],"Knowing their world helps you hear John as they did. Then ask what God is saying to you through it."],["heart","“God so loved the world, that he gave his one and only Son” (3:16). Here is what John shows about who God is in Jesus.",[["The Word who is God","“In the beginning was the Word, and the Word was with God, and the Word was God” (1:1). “The Word became flesh, and lived among us” (1:14)."],["He shows us the Father","“He who has seen me has seen the Father” (14:9)."],["The great “I am”","Jesus said, “I am the bread of life” (6:35), “I am the light of the world” (8:12), “I am the good shepherd” (10:11) and “I am the way, the truth, and the life” (14:6)."],["Full of love","“Having loved his own who were in the world, he loved them to the end” (13:1)."],["He weeps with us","At the tomb of his friend Lazarus, “Jesus wept” (11:35)."],["He gave his life","“Greater love has no one than this, that someone lay down his life for his friends” (15:13). On the cross he said, “It is finished” (19:30)."],["Risen Lord and God","Thomas saw the risen Jesus and said, “My Lord and my God!” (20:28)."]],"Am I judging God? Some said of Jesus, “He has a demon, and is insane!” (10:20). Pilate asked, “What is truth?” (18:38) and walked away without waiting for an answer. How does your heart respond to who Jesus is? Is your heart open to him, or are you judging him?"],["action","John ends with Jesus restoring Peter and calling him to follow. Here are steps the book impresses on its readers.",[["Believe","“Blessed are those who have not seen, and have believed” (20:29)."],["Come and see","Philip told Nathanael, “Come and see” (1:46)."],["Remain in Jesus","“I am the vine. You are the branches. He who remains in me and I in him bears much fruit” (15:5)."],["Love one another","“A new commandment I give to you, that you love one another. Just as I have loved you, you also love one another” (13:34)."],["Serve humbly","“If I then, the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet” (13:14)."],["Go as he sends you","“As the Father has sent me, even so I send you” (20:21)."],["Follow him","Jesus told Peter, “Feed my sheep” and “Follow me” (21:17–19)."]],"Carry this with you: Jesus came so that you “may have life, and may have it abundantly” (10:10)."]]},"deeper":{"img":null,"intro":"Going Deeper is a short study guide to the whole Gospel of John. Use it after you finish reading, or alongside it, to see the big picture: who wrote John and when, the world it comes from, how the book is built, the themes and emotions that run through it, and free websites for further study.","sections":[["overview","Author and book overview"],["history","Historical and cultural insights"],["chart","Chart of the book"],["themes","Major themes and emotions"],["resources","Free resources online"]],"overviewLead":"John is the fourth Gospel and the most different from the other three. It begins before creation, tells of seven signs that reveal who Jesus is, records long conversations and Jesus’ “I am” sayings, and gives five chapters to his last night with his disciples (chapters 13–17). John wrote so that readers might believe and have life (20:31).","overview":[["Author","The book names its author only as “the disciple whom Jesus loved” (21:20). The early church agreed that he was John, the son of Zebedee, one of the Twelve and the brother of James."],["Date","Many scholars date John to about A.D. 85–95, which would make it the last of the four Gospels. Some date it earlier, before A.D. 70."],["Place","Early church tradition says John wrote late in his life in Ephesus, in what is now western Turkey."],["Readers","Believers across the Roman world, both Jews and Gentiles, and anyone who had not yet believed."],["Purpose","“That you may believe that Jesus is the Christ, the Son of God, and that believing you may have life in his name” (20:31)."],["Key verses","1:1–5, 14; 3:16; 10:10–11; 11:25; 14:6; 15:5; 20:28–31."],["Found only in John","The wedding at Cana, Nicodemus, the Samaritan woman at the well, the man born blind, the raising of Lazarus, Jesus washing his disciples’ feet, his prayer in chapter 17, Thomas’ confession and breakfast by the lake."],["Seven signs","Water into wine (2:1–11), healing an official’s son (4:46–54), healing at the pool (5:1–9), feeding five thousand (6:1–14), walking on the water (6:16–21), healing a man born blind (9:1–7) and raising Lazarus (11:1–44)."]],"history":[["Jews and Samaritans","Jews and Samaritans had been enemies for centuries: “Jews have no dealings with Samaritans” (4:9). Yet Jesus asked a Samaritan woman for a drink."],["The temple in Jerusalem","Herod’s rebuilding of the temple had already taken “forty-six years” (2:20). Jesus spoke of “the temple of his body” (2:21)."],["The feasts","John sets much of Jesus’ ministry at the Jewish feasts: Passover (2:13; 6:4; 11:55), Booths, also called Tabernacles (7:2), and Dedication (10:22). Water and light were part of the celebration at Booths, and there Jesus offered living water and called himself the light of the world (7:37–38; 8:12)."],["Wells and water","In a dry land, wells were precious, and drawing water was daily work, usually done in the cool of the day. The Samaritan woman came at noon, “about the sixth hour” (4:6)."],["Shepherds and sheepfolds","A shepherd called his own sheep by name and led them out, and they followed him because they knew his voice (10:3–4)."],["Put out of the synagogue","Being put out of the synagogue meant being cut off from your community (9:22, 34)."],["Burial customs","Bodies were wrapped in linen with spices and laid in tombs cut into rock, with a stone across the entrance (11:38, 44; 19:40)."],["Roman rule","The Jewish leaders told Pilate, “It is illegal for us to put anyone to death” (18:31), so they brought Jesus to the Roman governor."],["Crucifixion","Rome crucified slaves and rebels. Pilate’s sign on the cross read, “JESUS OF NAZARETH, THE KING OF THE JEWS,” in Hebrew, Latin and Greek (19:19–20)."]],"chart":[["The Word becomes flesh","1:1–51",1,51,"The prologue, John the Baptist and the first disciples.","1:14","“The Word became flesh, and lived among us.”"],["Signs and new life","2:1–4:54",2,115,"Water into wine, Nicodemus, the Samaritan woman and an official’s son.","3:16","“For God so loved the world, that he gave his one and only Son”"],["Bread from heaven","5:1–6:71",5,118,"Healing at the pool and feeding five thousand. Jesus is the bread of life.","6:35","“I am the bread of life.”"],["Light at the feast","7:1–9:41",7,153,"Jesus at the Feast of Booths, and a man born blind receives his sight.","8:12","“I am the light of the world.”"],["Shepherd and resurrection","10:1–12:50",10,149,"The good shepherd, the raising of Lazarus and the entry into Jerusalem.","11:25","“I am the resurrection and the life.”"],["The last night","13:1–17:26",13,155,"Jesus washes his disciples’ feet, teaches his friends and prays for them.","14:6","“I am the way, the truth, and the life.”"],["Arrest and death","18:1–19:42",18,82,"The arrest, the trials before the high priests and Pilate, the cross and the burial.","19:30","“It is finished.”"],["The risen Lord","20:1–21:25",20,56,"The empty tomb, Mary Magdalene, Thomas and breakfast by the lake.","20:28","“My Lord and my God!”"]],"chartLead":"The whole Gospel of John, drawn to scale by verses. Tap a color to open that part of the book.","chartLabel":"Chart of the Gospel of John","ticks":[["John 1",0],["5",21.56],["10",52.1],["15",76.05],["21",100]],"refHead":"Passage","refWord":"John","roundsTitle":"The seven “I am” sayings of Jesus","roundsHead":["Saying","Where","The setting","The promise"],"roundsEmph":[],"rounds":[["“I am the bread of life”","6:35","The day after he fed five thousand","“Whoever comes to me will not be hungry” (6:35)"],["“I am the light of the world”","8:12; 9:5","At the Feast of Booths, and before healing a man born blind","“He who follows me will not walk in the darkness” (8:12)"],["“I am the door”","10:9","Speaking about the sheepfold","“If anyone enters in by me, he will be saved” (10:9)"],["“I am the good shepherd”","10:11, 14","Speaking about the sheepfold","“The good shepherd lays down his life for the sheep” (10:11)"],["“I am the resurrection and the life”","11:25","Before raising Lazarus","“He who believes in me will still live, even if he dies” (11:25)"],["“I am the way, the truth, and the life”","14:6","At supper on his last night","“No one comes to the Father, except through me” (14:6)"],["“I am the true vine”","15:1, 5","On his last night with his disciples","“He who remains in me and I in him bears much fruit” (15:5)"]],"roundsNote":"When Jesus said “I am,” he echoed the name God gave Moses at the burning bush: “I AM WHO I AM” (Exodus 3:14). Jesus also said, “before Abraham came into existence, I AM” (8:58), and his hearers picked up stones to throw at him (8:59).","themes":[["Believe and live","John uses the verb “believe” nearly a hundred times. Believing brings eternal life now: “he who hears my word and believes him who sent me has eternal life” (5:24)."],["Jesus is God’s Son","Jesus is the Word who was God (1:1), the one and only Son (1:14, 18) and the Son who does what he sees the Father doing (5:19)."],["Light and darkness","“The light shines in the darkness, and the darkness hasn’t overcome it” (1:5)."],["Life","“I came that they may have life, and may have it abundantly” (10:10)."],["Love","God loved the world (3:16), the Father loves the Son (3:35), and Jesus commands his followers to love one another (13:34–35; 15:12)."],["Truth","Jesus is “full of grace and truth” (1:14). He says, “the truth will make you free” (8:32), and he prays, “Your word is truth” (17:17)."],["The Holy Spirit","Jesus promised “another Counselor” who would be with his followers forever and guide them into all truth (14:16; 16:13)."]],"emotionsTitle":"Emotions: tears, trouble and joy","emotionsLead":"John shows the feelings of Jesus and of the people who met him. Follow them through the book, and let them help you bring your own feelings to God.","emotions":[["Zeal","2:17"],["Complete joy","3:29"],["Fear on the sea","6:19"],["Love for friends","11:5"],["Deep distress","11:33"],["Tears","11:35"],["A troubled soul","12:27"],["Love to the end","13:1"],["Sorrow turned to joy","16:20"],["Weeping at the tomb","20:11"],["Gladness","20:20"],["Grief","21:17"]],"resourcesLead":"These free websites can help you study John further. They are independent of Visual John, and you need an internet connection to open them.","resources":[["Blue Letter Bible: John with Greek word study","https://www.blueletterbible.org/kjv/jhn/1/1/ss1","Read John with Strong’s numbers linked to Greek definitions, plus cross-references and commentaries for every verse."],["Blue Letter Bible: Introduction to John","https://www.blueletterbible.org/esv-study-bible/new-testament/introductions/introduction-to-john.cfm","The ESV Global Study Bible’s introduction, with author, date, themes and an outline of the book."],["Blue Letter Bible: The Gospel of John","https://www.blueletterbible.org/study/intros/john.cfm","A study introduction to John’s authorship, date, purpose and structure."],["Matthew Henry’s Commentary on John","https://www.biblegateway.com/resources/matthew-henry/John","A classic devotional commentary from the early 1700s, chapter by chapter."],["Enduring Word Commentary on John","https://enduringword.com/bible-commentary/john-1/","David Guzik’s verse-by-verse commentary, with audio teaching on each section."],["BibleProject: Videos on John","https://bibleproject.com/videos/john-1-12/","Two short animated videos on the design and message of John, chapters 1–12 and 13–21."],["OpenBible.info: Map of places in John","https://www.openbible.info/geo/preview/john","An interactive map of the places named in John, such as Cana, Capernaum, Samaria, Bethany and Jerusalem."]]},"stats":{"questions":147,"photos":84,"chapters":21}}</script>
<script>
(function () {
  "use strict";
  var BOOK = JSON.parse(document.getElementById("book-data").textContent);
  var CH = BOOK.chapters;
  var main = document.getElementById("main");

  /* ---------- storage (one browser only) ---------- */
  var KEY = "visual-john.responses.v1";
  var OLD_KEYS = [];
  var PREF = "visual-john.prefs.v1";
  var IN_FRAME = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  var STANDALONE = window.navigator.standalone === true || (!!window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  var IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (STANDALONE) document.documentElement.classList.add("standalone");
  var SHARE_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-label="Share"><path d="M8 1.5v8M5 4.5l3-3 3 3M4.5 7H3.5v7h9V7h-1" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var store = null;
  try { var t = "__vl"; window.localStorage.setItem(t, "1"); window.localStorage.removeItem(t); store = window.localStorage; } catch (e) { store = null; }
  function readJSON(k) { if (!store) return {}; try { return JSON.parse(store.getItem(k) || "{}") || {}; } catch (e) { return {}; } }
  function writeJSON(k, v) { if (!store) return false; try { store.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  if (store) OLD_KEYS.forEach(function (k) { try { store.removeItem(k); } catch (e) {} });
  var responses = readJSON(KEY);
  var prefs = readJSON(PREF);

  /* ---------- indexes ---------- */
  var QUESTIONS = [];
  CH.forEach(function (c) {
    c.sections = [];
    c.questions = [];
    c.blocks.forEach(function (b, i) {
      b.domId = "c" + c.num + "-b" + i;
      if (b.type === "h2") c.sections.push({ text: b.text, id: b.domId });
      if (b.type === "q") { var q = { ch: c.num, id: b.id, field: b.field, text: b.text, domId: b.domId }; c.questions.push(q); QUESTIONS.push(q); }
    });
  });
  var MQ = BOOK.master.items;
  var MQFIELDS = [];
  CH.forEach(function (c) {
    c.mq = MQ.map(function (m) { var f = { ch: c.num, key: m[0], label: m[1], text: m[2], field: "mq" + c.num + "-" + m[0], domId: "c" + c.num + "-mq-" + m[0] }; MQFIELDS.push(f); return f; });
  });
  var SUMQ = MQ.map(function (m) { var f = { ch: "summary", key: m[0], label: m[1], text: m[2], field: "mqs-" + m[0], domId: "sum-" + m[0] }; MQFIELDS.push(f); return f; });
  function answered(field) { return !!(responses[field] && responses[field].trim()); }
  function mqAnswered() { return MQFIELDS.filter(function (q) { return answered(q.field); }).length; }
  function answeredIn(c) { return c.questions.filter(function (q) { return answered(q.field); }).length; }
  function totalAnswered() { return QUESTIONS.filter(function (q) { return answered(q.field); }).length; }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function strip(h) { return String(h).replace(/<sup class="v">(\d+)<\/sup>/g, "$1").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">"); }
  function img(src, w, h, alt, cls, eager) {
    return '<img src="' + esc(src) + '" width="' + w + '" height="' + h + '" alt="' + esc(alt || "") + '"' +
      (cls ? ' class="' + cls + '"' : "") + (eager ? "" : ' loading="lazy" decoding="async"') + ">";
  }

  /* ---------- chrome ---------- */
  var chapgrid = document.getElementById("chapgrid");
  var chapmenu = document.getElementById("chapmenu");
  ["nav-deeper", "nav-summary"].forEach(function (id) { document.getElementById(id).addEventListener("click", function () { chapmenu.open = false; }); });
  function renderChapGrid(current) {
    chapgrid.innerHTML = CH.map(function (c) {
      var a = answeredIn(c);
      return '<a href="#john-' + c.num + '"' + (current === c.num ? ' aria-current="page"' : "") + (a ? ' class="done"' : "") +
        ' title="John ' + c.num + (a ? " · " + a + " answered" : "") + '">' + c.num + "</a>";
    }).join("");
  }
  function updateCount() { document.getElementById("resp-count").textContent = totalAnswered() + mqAnswered(); }
  document.addEventListener("click", function (e) {
    if (chapmenu.open && !chapmenu.contains(e.target)) chapmenu.open = false;
  });
  chapgrid.addEventListener("click", function () { chapmenu.open = false; });

  /* ---------- search ---------- */
  var SEARCH = [];
  CH.forEach(function (c) {
    var section = "";
    c.blocks.forEach(function (b) {
      if (b.type === "h2") { section = b.text; SEARCH.push({ ch: c.num, domId: b.domId, kind: "Heading", text: strip(b.text), section: section }); }
      else if (b.type === "p") SEARCH.push({ ch: c.num, domId: b.domId, kind: "Text", text: strip(b.html), section: section });
      else if (b.type === "poem") SEARCH.push({ ch: c.num, domId: b.domId, kind: "Text", text: strip(b.lines.join(" ")), section: section });
      else if (b.type === "q") SEARCH.push({ ch: c.num, domId: b.domId, kind: "Question " + b.id, text: strip(b.text), section: section });
    });
  });
  SEARCH.forEach(function (s) { s.lower = s.text.toLowerCase(); });
  var searchBtn = document.getElementById("search-btn");
  var searchbar = document.getElementById("searchbar");
  var searchInput = document.getElementById("search-input");
  var resultsEl = document.getElementById("results");
  var noteEl = document.getElementById("results-note");
  searchBtn.addEventListener("click", function () {
    var open = searchbar.hidden;
    searchbar.hidden = !open;
    searchBtn.setAttribute("aria-expanded", String(open));
    if (open) searchInput.focus();
  });
  function snippet(text, q) {
    var i = text.toLowerCase().indexOf(q);
    var start = Math.max(0, i - 70), end = Math.min(text.length, i + q.length + 110);
    var s = (start > 0 ? "…" : "") + esc(text.slice(start, i)) + "<b>" + esc(text.slice(i, i + q.length)) + "</b>" + esc(text.slice(i + q.length, end)) + (end < text.length ? "…" : "");
    return s;
  }
  var searchTimer;
  searchInput.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 120);
  });
  searchInput.addEventListener("keydown", function (e) { if (e.key === "Escape") { searchbar.hidden = true; searchBtn.setAttribute("aria-expanded", "false"); searchBtn.focus(); } });
  function runSearch() {
    var q = searchInput.value.trim().toLowerCase();
    if (q.length < 2) { resultsEl.innerHTML = ""; noteEl.textContent = q ? "Type at least two letters." : ""; return; }
    var hits = SEARCH.filter(function (s) { return s.lower.indexOf(q) !== -1; });
    var shown = hits.slice(0, 60);
    resultsEl.innerHTML = shown.map(function (h, i) {
      return '<li><button type="button" data-i="' + i + '"><span class="ref">John ' + h.ch + " · " + esc(h.kind) + (h.section && h.kind !== "Heading" ? " · " + esc(h.section) : "") + "</span>" + snippet(h.text, q) + "</button></li>";
    }).join("");
    noteEl.textContent = hits.length ? (hits.length > shown.length ? "Showing the first " + shown.length + " of " + hits.length + " matches." : hits.length + (hits.length === 1 ? " match." : " matches.")) : "No matches in John or the questions.";
    resultsEl.onclick = function (e) {
      var b = e.target.closest("button[data-i]"); if (!b) return;
      var h = shown[+b.getAttribute("data-i")];
      searchbar.hidden = true; searchBtn.setAttribute("aria-expanded", "false");
      goTo(h.ch, h.domId);
    };
  }

  /* ---------- navigation ---------- */
  var pendingTarget = null;
  function goTo(ch, domId) {
    pendingTarget = domId;
    var want = ch === "summary" ? "#summary" : "#john-" + ch;
    if (location.hash === want) { scrollToTarget(); } else { location.hash = want; }
  }
  function scrollToTarget() {
    if (!pendingTarget) return;
    var el = document.getElementById(pendingTarget);
    pendingTarget = null;
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    var ta = el.querySelector && el.querySelector("textarea");
    if (ta) ta.focus({ preventScroll: true });
    try {
      var soft = getComputedStyle(document.documentElement).getPropertyValue("--teal-soft").trim();
      if (el.animate && soft && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) el.animate([{ backgroundColor: soft }, { backgroundColor: "transparent" }], { duration: 1600 });
    } catch (e) {}
  }

  function setNav(view) {
    document.getElementById("nav-discussion").toggleAttribute("aria-current", false);
    document.getElementById("nav-responses").toggleAttribute("aria-current", false);
    if (view === "discussion") document.getElementById("nav-discussion").setAttribute("aria-current", "page");
    if (view === "responses") document.getElementById("nav-responses").setAttribute("aria-current", "page");
    ["deeper", "summary"].forEach(function (v) { var el = document.getElementById("nav-" + v); if (view === v) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current"); });
  }

  var visits = 0, currentChapter = 0, resume = false;
  var backBtn = document.getElementById("back-btn");
  backBtn.addEventListener("click", function () {
    if (visits > 1) { visits -= 2; history.back(); } else { location.hash = "#home"; }
  });
  function route() {
    var h = location.hash.replace(/^#/, "");
    var m = /^john-(\d+)$/.exec(h);
    visits++;
    chapmenu.open = false;
    hideBar();
    currentChapter = 0;
    backBtn.hidden = !(h && h !== "home");
    if (m && +m[1] >= 1 && +m[1] <= CH.length) { currentChapter = +m[1]; renderChapter(+m[1]); setNav("chapter"); }
    else if (h === "credits") { renderCredits(); setNav("credits"); renderChapGrid(0); document.title = "Photo credits · Visual John"; }
    else if (h === "install") { renderInstall(); setNav("install"); renderChapGrid(0); document.title = "Install · Visual John"; }
    else if (h === "responses") { renderResponses(); setNav("responses"); renderChapGrid(0); document.title = "My responses · Visual John"; }
    else if (h === "summary") { renderSummary(); setNav("summary"); renderChapGrid(0); document.title = "Summary · Visual John"; }
    else if (h === "deeper" || h === "deeper-resources") { if (h === "deeper-resources") pendingTarget = "dg-resources"; renderDeeper(); setNav("deeper"); renderChapGrid(0); document.title = "Going Deeper · Visual John"; }
    else if (h === "discussion") { renderDiscussion(); setNav("discussion"); renderChapGrid(0); document.title = "Group discussion guide · Visual John"; }
    else { renderHome(); setNav("home"); renderChapGrid(0); document.title = "Visual John"; }
    updateCount();
    if (pendingTarget) { requestAnimationFrame(scrollToTarget); }
    else if (resume && currentChapter && prefs.pos && prefs.pos.ch === currentChapter) { window.scrollTo(0, prefs.pos.y); }
    else { window.scrollTo(0, 0); }
    resume = false;
  }
  // remember the reading position so "Continue" returns to the same place
  var posTimer;
  window.addEventListener("scroll", function () {
    if (!currentChapter) return;
    clearTimeout(posTimer);
    posTimer = setTimeout(function () {
      if (!currentChapter) return;
      prefs.pos = { ch: currentChapter, y: Math.round(window.scrollY) };
      writeJSON(PREF, prefs);
    }, 400);
  }, { passive: true });
  window.addEventListener("hashchange", route);

  /* ---------- home ---------- */
  function renderHome() {
    var s = BOOK.stats;
    var last = prefs.lastChapter;
    var done = totalAnswered();
    var cards = CH.map(function (c) {
      var a = answeredIn(c);
      var secs = c.sections.slice(0, 3).map(function (x) { return "<li>" + x.text + "</li>"; }).join("");
      var more = c.sections.length > 3 ? '<li>+ ' + (c.sections.length - 3) + " more</li>" : "";
      return '<a class="card" href="#john-' + c.num + '">' +
        '<div class="card-img">' + img(c.hero.src, c.hero.w, c.hero.h, "") + '<div class="card-num">JOHN <b>' + c.num + "</b></div></div>" +
        '<div class="card-body"><ul>' + secs + more + "</ul>" +
        '<div class="card-meta"><span class="pill' + (a ? " on" : "") + '">' + (a ? a + " of " : "") + c.questions.length + " questions" + (a ? " answered" : "") + "</span></div></div></a>";
    }).join("");
    var showInstall = IS_IOS && !STANDALONE && !IN_FRAME && !prefs.hideInstall;
    main.innerHTML =
      '<div class="wrap">' +
      (showInstall ? '<div class="install-card" id="install-card"><div><strong>Put Visual John on your Home Screen</strong><p>In Safari, tap Share ' + SHARE_ICON + ', then <b>Add to Home Screen</b>. It opens like an app and works without an internet connection. <a href="#install">More help</a></p></div><button type="button" id="install-dismiss">Not now</button></div>' : "") +
      '<section class="cover">' +
        img(BOOK.cover.src, BOOK.cover.w, BOOK.cover.h, BOOK.coverAlt, "cover-img", true) +
        "<div>" +
          '<p class="eyebrow">A visual journey through John</p>' +
          "<h1>Visual John</h1>" +
          '<p class="lede">John in the World English Bible, paired with photographs and questions that link life and Scripture.</p>' +
          '<ul class="stats"><li><strong>' + s.chapters + "</strong>chapters</li><li><strong>" + s.photos + "</strong>photographs</li><li><strong>" + s.questions + "</strong>reflection questions</li></ul>" +
          '<div class="actions">' +
            (last && (last > 1 || (prefs.pos && prefs.pos.y > 400)) ? '<a class="btn" id="continue-btn" href="#john-' + last + '">Continue with John ' + last + "</a>" + (last > 1 ? '<a class="btn ghost" href="#john-1">Start at John 1</a>' : "") : '<a class="btn" href="#john-1">Begin reading John 1</a>') +
            '<a class="btn ghost" href="#discussion">Group discussion guide</a>' +
          "</div>" +
          '<p class="progress-line">' + (done ? "You have answered " + done + " of " + s.questions + " questions. Your responses stay on this device." : "Write your responses under each question as you read. They stay on this device.") + "</p>" +
        "</div>" +
      "</section>" +
      '<section class="welcome" aria-labelledby="welcome-h">' +
        '<div><h2 id="welcome-h">Welcome to Visual John</h2>' + BOOK.welcome.map(function (p, i) { return "<p>" + p.replace("Going Deeper", '<a href="#deeper">Going Deeper</a>').replace("The Summary", 'The <a href="#summary">Summary</a>') + "</p>" + (i === BOOK.master.after ? mqWelcome() : ""); }).join("") + "</div>" +
        '<div class="strips">' + BOOK.strips.map(function (x) { return img(x.src, x.w, x.h, ""); }).join("") + "</div>" +
      "</section>" +
      '<section class="chapters" aria-labelledby="chapters-h">' +
        '<div class="section-head"><h2 id="chapters-h">The chapters</h2><p>Each chapter opens with a photograph, then sets the text beside images and questions.</p></div>' +
        '<div class="cards">' + cards + summaryCard() + deeperCard() + "</div>" +
      "</section>" +
      '<section class="feature">' +
        '<a class="tile" href="#discussion"><h3>Ideas for group discussions</h3><p>Ten kinds of image-based questions to help you lead a group or craft your own.</p></a>' +
        '<a class="tile" href="#responses"><h3>My responses</h3><p>Everything you have written, gathered by chapter. Copy it all in one step.</p></a>' +
      "</section>" +
      '<section class="about" aria-labelledby="about-h">' +
        "<div>" +
          '<h2 id="about-h">About Visual John</h2><h3>Scripture, photographs and credits</h3>' +
          "<p>Visual John follows the pattern of each book within the Visual Bible Project: the full text of a book of the Bible set beside photographs and questions that link life and Scripture.</p>" +
          '<p>Scripture is from the World English Bible (WEB), a public-domain modern English translation. Section headings and reflection questions were written for Visual John.</p>' +
          '<p>Photographs are from <a href="https://pixabay.com">Pixabay</a>, used under the Pixabay Content License. <a href="#credits">See the photo credits</a>.</p>' +
          '<p>Prepared by Ralph C. Ennis, <a href="https://www.ralphennis.com">www.ralphennis.com</a>, using artificial intelligence.</p>' +
          '<div class="ai-note"><h3>AI Disclaimer</h3>' +
          "<p>Artificial intelligence can increase efficiency and provide useful expertise, but it is not fully reliable. Do not trust it uncritically. Like a frog in slowly heating water, users can gradually accept AI outputs without noticing growing errors, dependence, deception or manipulation.</p>" +
          "<p>When using AI with Biblical resources, be especially careful. AI can misinterpret Scripture or introduce subtle inaccuracies. Always check its results against the Bible itself and maintain your own discernment. AI is only a tool; responsibility for discerning truth remains with the user.</p>" +
          '<p class="verse-quote">“But solid food is for those who are full grown, who by reason of use have their senses exercised to discern good and evil.” — Hebrews 5:14 (WEB)</p></div>' +
        "</div>" +
        '<div class="about-imgs">' + BOOK.strips.map(function (x) { return img(x.src, x.w, x.h, ""); }).join("") + "</div>" +
      "</section>" +
      "</div>";
  }

  /* ---------- master questions ---------- */
  function mqBlock(f, kind) {
    var tid = "r-" + f.field;
    return '<section class="q mq-q" id="' + f.domId + '" aria-labelledby="' + tid + '-label">' +
      '<p class="q-num" id="' + tid + '-label">' + kind + " · " + f.label + "</p>" +
      '<p class="q-text"><b>' + f.label + ":</b> " + f.text + "</p>" +
      '<label class="sr-only" for="' + tid + '">Your response to the ' + f.label.toLowerCase() + " Master Question</label>" +
      '<textarea id="' + tid + '" data-field="' + f.field + '" placeholder="Write your response…" rows="4">' + esc(responses[f.field] || "") + "</textarea>" +
      '<p class="q-status" aria-live="polite"></p></section>';
  }
  function mqWelcome() {
    var mw = BOOK.master;

  /* ---------- responses ---------- */
  function responsesText() {
    var lines = ["Visual John · My responses", ""];
    CH.forEach(function (c) {
      var qs = c.questions.filter(function (q) { return answered(q.field); });
      var ms = c.mq.filter(function (f) { return answered(f.field); });
      if (!qs.length && !ms.length) return;
      lines.push("JOHN " + c.num);
      qs.forEach(function (q) {
        lines.push(q.id + "  " + strip(q.text));
        lines.push(responses[q.field].trim());
        lines.push("");
      });
      ms.forEach(function (f) {
        lines.push("Master Question · " + f.label + "  " + strip(f.text));
        lines.push(responses[f.field].trim());
        lines.push("");
      });
    });
    var ss = SUMQ.filter(function (f) { return answered(f.field); });
    if (ss.length) {
      lines.push("SUMMARY");
      ss.forEach(function (f) {
        lines.push("Master Question · " + f.label + "  " + strip(f.text));
        lines.push(responses[f.field].trim());
        lines.push("");
      });
    }
    return lines.join("\n");
  }

        '<button type="button" class="link" data-ch="' + f.ch + '" data-target="' + f.domId + '">Edit in ' + (f.ch === "summary" ? "the Summary" : "John " + f.ch) + "</button></div>";
    };
    var groups = CH.map(function (c) {
      var qs = c.questions.filter(function (q) { return answered(q.field); });

      return '<section class="group"><h2>John ' + c.num + ' <a href="#john-' + c.num + '">Open chapter</a></h2>' +

          return '<div class="answer"><p class="q-num">Reflect ' + esc(q.id) + '</p><p class="q-text">' + q.text + '</p><p class="text">' + esc(responses[q.field].trim()) + '</p>' +

      try {
        navigator.share({ title: "Visual John · My responses", text: responsesText() }).catch(function () {});
      } catch (e) {}
    });

    main.innerHTML =
      '<div class="page">' +
      '<p class="eyebrow">Visual John</p><h1>Photo credits</h1>' +
      '<p class="lede">All photographs come from <a href="https://pixabay.com">Pixabay</a> and are used under the Pixabay Content License. Attribution is not required, but we gladly thank the photographers.</p>' +
      '<ul class="notes credits">' + rows + "</ul>" +
      '<nav class="pager" aria-label="Continue"><a href="#home"><small>Back to</small><strong>Home</strong></a><a class="next" href="#john-1"><small>Start reading</small><strong>John 1</strong></a></nav>' +
      "</div>";
  }

  /* ---------- install ---------- */
  function renderInstall() {
    main.innerHTML =
      '<div class="page">' +
      '<p class="eyebrow">Visual John app</p><h1>Install Visual John on your phone</h1>' +
      '<p class="lede">' + (STANDALONE ? "You are using the installed app. Everything below is for setting it up on another device." : "Visual John installs from this web page. It gets its own icon, opens full screen, and works without an internet connection once installed.") + "</p>" +
      '<h2 class="sub">iPhone or iPad</h2>' +
      '<ol class="steps"><li>Open this page in <b>Safari</b>.</li><li>Tap the Share button ' + SHARE_ICON + " at the bottom of the screen (at the top on iPad).</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>. Visual John now sits on your Home Screen with its own icon.</li></ol>" +
      '<h2 class="sub">Android phone</h2>' +
      '<ol class="steps"><li>Open this page in <b>Chrome</b>.</li><li>Tap the menu (three dots) and choose <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>' +
      '<h2 class="sub">Good to know</h2>' +
      '<ul class="notes"><li>Open the app once while connected so it can store all ' + CH.length + ' chapters and ' + BOOK.stats.photos + " photographs. After that it works offline.</li>" +
      "<li>Your responses and highlights are saved on the device where you make them. The installed app keeps its own, separate from Safari.</li>" +
      "<li>Removing the app from your Home Screen also deletes its saved responses and highlights. Copy or share your responses from <a href=\"#responses\">My responses</a> first.</li></ul>" +
      '<nav class="pager" aria-label="Continue"><a href="#home"><small>Back to</small><strong>Home</strong></a><a class="next" href="#john-1"><small>Start reading</small><strong>John 1</strong></a></nav>' +
      "</div>";
  }

  /* ---------- highlights ---------- */
  var HLKEY = "visual-john.highlights.v1";
  var HL = (function () { var d = readJSON(HLKEY); return Array.isArray(d.list) ? d.list : []; })();
  var COLOR_NAME = { green: "light green", blue: "light blue" };
  function saveHL() { return writeJSON(HLKEY, { list: HL }); }
  function hlFor(n) { return HL.filter(function (h) { return h.ch === n; }); }
  function findHL(id) { for (var i = 0; i < HL.length; i++) if (HL[i].id === id) return HL[i]; return null; }
  function hlBlocks() { return Array.prototype.slice.call(main.querySelectorAll(".reader > p[id], .reader > .poem[id]")); }
  function prefixLen(block, node, off) {
    var r = document.createRange();
    r.setStart(block, 0);
    try { r.setEnd(node, off); } catch (e) { return 0; }
    return r.toString().length;
  }
  // readable text of block[s, e) without verse numbers
  function cleanText(block, s, e) {
    var w = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, null), pos = 0, out = "", n, lastLine = null;
    while ((n = w.nextNode())) {
      var a = pos, b = pos + n.data.length; pos = b;
      if (b <= s || a >= e) continue;
      var line = n.parentNode.closest ? n.parentNode.closest(".l") : null;
      if (line !== lastLine) { out += " "; lastLine = line; }
      var piece = n.data.slice(Math.max(s, a) - a, Math.min(e, b) - a);
      out += (n.parentNode.closest && n.parentNode.closest("sup.v")) ? " " : piece;
    }
    return out.replace(/\s+/g, " ").trim();
  }
  function part(block, s, e) { return { b: block.id, s: s, e: e, x: block.textContent.slice(s, e) }; }
  // the current selection, cut into one piece per paragraph or poem
  function selectionParts() {
    if (!currentChapter) return null;
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || sel.isCollapsed) return null;
    var r = sel.getRangeAt(0), parts = [];
    hlBlocks().forEach(function (b) {
      if (!r.intersectsNode(b)) return;
      var t = b.textContent;
      var s = b.contains(r.startContainer) ? prefixLen(b, r.startContainer, r.startOffset) : 0;
      var e = b.contains(r.endContainer) ? prefixLen(b, r.endContainer, r.endOffset) : t.length;
      while (s < e && /\s/.test(t.charAt(s))) s++;
      while (e > s && /\s/.test(t.charAt(e - 1))) e--;
      if (e > s) parts.push(part(b, s, e));
    });
    return parts.length ? parts : null;
  }
  function unwrapHL(root) {
    root.querySelectorAll("mark.hl").forEach(function (m) {
      var p = m.parentNode;
      while (m.firstChild) p.insertBefore(m.firstChild, m);
      p.removeChild(m);
      p.normalize();
    });
  }
  function wrapRange(block, s, e, h) {
    var w = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, null), nodes = [], n, pos = 0;
    while ((n = w.nextNode())) nodes.push(n);
    nodes.forEach(function (node) {
      var a = pos, b = pos + node.data.length; pos = b;
      if (b <= s || a >= e) return;
      var from = Math.max(s, a) - a, to = Math.min(e, b) - a, mid = node;
      if (from > 0) mid = node.splitText(from);
      if (to - from < mid.data.length) mid.splitText(to - from);
      var m = document.createElement("mark");
      m.className = "hl"; m.setAttribute("data-hl", h.id); m.setAttribute("data-c", h.color);
      mid.parentNode.insertBefore(m, mid); m.appendChild(mid);
    });
  }
  function applyHL() {
    var reader = main.querySelector(".reader");
    if (!reader || !currentChapter) return;
    unwrapHL(reader);
    hlFor(currentChapter).forEach(function (h) {
      h.parts.forEach(function (p) {
        var b = document.getElementById(p.b);
        if (!b || !reader.contains(b)) return;
        var t = b.textContent, s = p.s, e = p.e;
        if (t.slice(s, e) !== p.x) { var i = t.indexOf(p.x); if (i < 0 || !p.x) return; s = i; e = i + p.x.length; }
        wrapRange(b, s, e, h);
      });
    });
    renderHlTools();
  }
  // take the given ranges out of any existing highlights in this chapter
  function cutOut(parts) {
    var changed = false;
    HL.forEach(function (h) {
      if (h.ch !== currentChapter) return;
      var out = [], hit = false;
      h.parts.forEach(function (p) {
        var q = null;
        parts.forEach(function (x) { if (x.b === p.b && x.s < p.e && x.e > p.s) q = x; });
        if (!q) { out.push(p); return; }
        changed = hit = true;
        var b = document.getElementById(p.b);
        if (!b) return;
        if (p.s < q.s) out.push(part(b, p.s, q.s));
        if (p.e > q.e) out.push(part(b, q.e, p.e));
      });
      h.parts = out.filter(function (p) { return p.x.trim(); });
      if (hit) h.txt = h.parts.map(function (p) { var b = document.getElementById(p.b); return b ? cleanText(b, p.s, p.e) : ""; }).join(" ");
    });
    HL = HL.filter(function (h) { return h.parts.length; });
    return changed;
  }
  function overlapsAny(parts) {
    return hlFor(currentChapter).some(function (h) {
      return h.parts.some(function (p) { return parts.some(function (x) { return x.b === p.b && x.s < p.e && x.e > p.s; }); });
    });
  }
  function addHL(parts, color) {
    cutOut(parts);
    HL.push({
      id: "h" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      ch: currentChapter, color: color, parts: parts, t: Date.now(),
      txt: parts.map(function (p) { return cleanText(document.getElementById(p.b), p.s, p.e); }).join(" ")
    });
    saveHL(); applyHL();
  }
  function refreshView() {
    if (currentChapter) applyHL();
    else if (location.hash === "#responses") renderResponses();
  }
  function removeHL(list, message) {
    if (!list.length) return;
    var gone = list.slice();
    HL = HL.filter(function (h) { return gone.indexOf(h) === -1; });
    saveHL(); refreshView();
    showToast(message, "Undo", function () { HL = HL.concat(gone); saveHL(); refreshView(); }, 7000);
  }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function renderHlTools() {
    var els = main.querySelectorAll(".hl-tools");
    if (!els.length) return;
    var here = hlFor(currentChapter).length, all = HL.length;
    var html =
      (all ? '<p class="hl-count">' + plural(here, "highlight") + " in John " + currentChapter + (all !== here ? " · " + all + " in all" : "") + "</p>" +
        "<p>" + (here ? '<button type="button" class="linkbtn" data-hl-clear="chapter">Clear this chapter</button>' : "") +
        '<button type="button" class="linkbtn" data-hl-clear="all">Clear all highlights</button></p>' : "") +
      "<p>Select words in the text, then choose light green or light blue. Tap a highlight to change its color or remove it.</p>";
    els.forEach(function (el) { el.innerHTML = (el.closest(".guide-mobile") ? "<h3>Highlights</h3>" : "") + html; });
  }
  function hlReviewHTML() {
    var head = '<section class="hl-review" aria-labelledby="hl-h"><h2 class="sub" id="hl-h">My highlights</h2>';
    if (!HL.length) return head + '<p class="empty">No highlights yet. In any chapter, select words in the Bible text and choose light green or light blue.</p></section>';
    function key(h) { var p = h.parts[0]; return (+(/-b(\d+)$/.exec(p.b) || [0, 0])[1]) * 100000 + p.s; }
    var body = CH.map(function (c) {
      var hs = hlFor(c.num).sort(function (a, b) { return key(a) - key(b); });
      if (!hs.length) return "";
      return '<section class="group"><h2>John ' + c.num + ' <a href="#john-' + c.num + '">Open chapter</a></h2><ul class="hl-list">' +
        hs.map(function (h) {
          var t = h.txt || ""; if (t.length > 260) t = t.slice(0, 250).replace(/\s+\S*$/, "") + " …";
          return '<li><span class="sw ' + h.color + '" role="img" aria-label="' + COLOR_NAME[h.color] + '"></span><p class="hl-text">' + esc(t) + "</p>" +
            '<p class="hl-acts"><button type="button" class="linkbtn" data-ch="' + c.num + '" data-target="' + h.parts[0].b + '">Show in John ' + c.num + "</button>" +
            '<button type="button" class="linkbtn" data-hl-del="' + h.id + '">Remove</button></p></li>';
        }).join("") + "</ul></section>";
    }).join("");
    return head + '<div class="toolbar"><span class="note">' + plural(HL.length, "highlight") + ", saved on this device.</span>" +
      '<button class="btn ghost" type="button" data-hl-clear="all">Clear all highlights</button></div>' + body + "</section>";
  }
  function maybeHlTip() {
    if (prefs.hlTip || HL.length) return;
    setTimeout(function () {
      if (!currentChapter || prefs.hlTip || HL.length) return;
      prefs.hlTip = true; writeJSON(PREF, prefs);
      showToast("Tip: select words in the text to highlight them.", "Got it", function () {}, 9000);
    }, 1800);
  }

  // the floating highlight bar
  var hlbar = document.createElement("div");
  hlbar.className = "hlbar"; hlbar.setAttribute("role", "toolbar"); hlbar.setAttribute("aria-label", "Highlight"); hlbar.hidden = true;
  document.body.appendChild(hlbar);
  var hlMode = null, pressing = false, selTimer = null;
  function hideBar() { hlMode = null; hlbar.hidden = true; }
  function barRect() {
    if (!hlMode) return null;
    if (hlMode.kind === "new") {
      var sel = window.getSelection();
      if (!sel || !sel.rangeCount || sel.isCollapsed) return hlMode.rect || null;
      return sel.getRangeAt(0).getBoundingClientRect();
    }
    return hlMode.el && hlMode.el.isConnected ? hlMode.el.getBoundingClientRect() : null;
  }
  function placeBar() {
    var r = barRect();
    if (!r || r.bottom < 56 || r.top > window.innerHeight) { hlbar.hidden = true; return; }
    hlbar.hidden = false;
    var bw = hlbar.offsetWidth, bh = hlbar.offsetHeight, vw = document.documentElement.clientWidth;
    var left = Math.max(8, Math.min(r.left + r.width / 2 - bw / 2, vw - bw - 8));
    var top = r.bottom + 12;
    if (top + bh > window.innerHeight - 10) top = Math.max(62, r.top - bh - 12);
    hlbar.style.left = Math.round(left) + "px"; hlbar.style.top = Math.round(top) + "px";
  }
  function showBar() {
    var b = '<button type="button" data-hl-color="green"><span class="sw green"></span>Green</button>' +
            '<button type="button" data-hl-color="blue"><span class="sw blue"></span>Blue</button>';
    if (hlMode.kind === "edit") {
      var h = findHL(hlMode.id); if (!h) { hideBar(); return; }
      b = b.replace('data-hl-color="' + h.color + '"', 'data-hl-color="' + h.color + '" aria-pressed="true"') +
        '<span class="sep"></span><button type="button" data-hl-remove>Remove highlight</button>';
    } else if (overlapsAny(hlMode.parts)) {
      b += '<span class="sep"></span><button type="button" data-hl-erase>Clear</button>';
    }
    b = b.replace('data-hl-color="green"', 'data-hl-color="green" aria-label="Highlight in light green"')
         .replace('data-hl-color="blue"', 'data-hl-color="blue" aria-label="Highlight in light blue"');
    hlbar.innerHTML = b;
    placeBar();
  }
  function checkSelection() {
    var parts = selectionParts();
    if (!parts) { if (hlMode && hlMode.kind === "new") hideBar(); return; }
    var sel = window.getSelection();
    hlMode = { kind: "new", parts: parts, rect: sel.getRangeAt(0).getBoundingClientRect() };
    showBar();
  }
  document.addEventListener("selectionchange", function () {
    if (pressing) return;
    clearTimeout(selTimer);
    selTimer = setTimeout(checkSelection, 220);
  });
  hlbar.addEventListener("pointerdown", function (e) { pressing = true; if (e.pointerType === "mouse") e.preventDefault(); });
  hlbar.addEventListener("mousedown", function (e) { e.preventDefault(); });
  document.addEventListener("pointerup", function () { setTimeout(function () { pressing = false; }, 400); }, true);
  document.addEventListener("pointercancel", function () { pressing = false; }, true);
  hlbar.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    pressing = false;
    if (!b || !hlMode) return;
    var mode = hlMode, c = b.getAttribute("data-hl-color");
    if (c) {
      if (mode.kind === "new") { addHL(mode.parts, c); try { window.getSelection().removeAllRanges(); } catch (x) {} }
      else { var h = findHL(mode.id); if (h) { h.color = c; saveHL(); applyHL(); } }
      hideBar();
    } else if (b.hasAttribute("data-hl-remove")) {
      var g = findHL(mode.id); hideBar();
      if (g) removeHL([g], "Highlight removed.");
    } else if (b.hasAttribute("data-hl-erase")) {
      var before = JSON.stringify(HL);
      cutOut(mode.parts); saveHL(); applyHL();
      try { window.getSelection().removeAllRanges(); } catch (x) {}
      hideBar();
      showToast("Highlight cleared from the selected words.", "Undo", function () { HL = JSON.parse(before); saveHL(); refreshView(); }, 7000);
    }
  });
  // tap a highlight to change or remove it; clear buttons in the guide and on My responses
  main.addEventListener("click", function (e) {
    var m = e.target.closest && e.target.closest("mark.hl");
    if (m) {
      var sel = window.getSelection();
      if (sel && !sel.isCollapsed) return;
      hlMode = { kind: "edit", id: m.getAttribute("data-hl"), el: m };
      showBar();
      return;
    }
    var clr = e.target.closest && e.target.closest("[data-hl-clear]");
    if (clr) {
      var scope = clr.getAttribute("data-hl-clear");
      var list = scope === "chapter" ? hlFor(currentChapter) : HL.slice();
      removeHL(list, plural(list.length, "highlight") + " cleared" + (scope === "chapter" ? " from John " + currentChapter : "") + ".");
      return;
    }
    var del = e.target.closest && e.target.closest("[data-hl-del]");
    if (del) { var h = findHL(del.getAttribute("data-hl-del")); if (h) removeHL([h], "Highlight removed."); }
  });
  document.addEventListener("click", function (e) {
    if (hlbar.hidden || !hlMode) return;
    if (hlbar.contains(e.target) || (e.target.closest && e.target.closest("mark.hl"))) return;
    var sel = window.getSelection();
    if (hlMode.kind === "edit" || !sel || sel.isCollapsed) hideBar();
  });
  var barRAF = 0;
  window.addEventListener("scroll", function () {
    if (!hlMode) return;
    if (barRAF) return;
    barRAF = requestAnimationFrame(function () { barRAF = 0; if (hlMode) placeBar(); });
  }, { passive: true });
  window.addEventListener("resize", function () { if (hlMode) placeBar(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && hlMode) hideBar(); });

  /* ---------- toast ---------- */
  var toastTimer = null;
  function showToast(text, label, onClick, ms) {
    var t = document.getElementById("toast");
    clearTimeout(toastTimer);
    document.getElementById("toast-text").textContent = text;
    var b = document.getElementById("toast-btn");
    b.textContent = label; b.onclick = function () { clearTimeout(toastTimer); t.hidden = true; onClick(); };
    t.hidden = false;
    if (ms) toastTimer = setTimeout(function () { t.hidden = true; }, ms);
  }

  /* ---------- offline app (service worker) ---------- */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !IN_FRAME) {
    var hadController = !!navigator.serviceWorker.controller, updating = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (hadController && updating) location.reload();
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        function offer(worker) {
          showToast("A new version of Visual John is ready.", "Update", function () { updating = true; worker.postMessage("skipWaiting"); });
        }
        if (reg.waiting && hadController) offer(reg.waiting);
        reg.addEventListener("updatefound", function () {
          var nw = reg.installing; if (!nw) return;
          nw.addEventListener("statechange", function () {
            if (nw.state === "installed" && navigator.serviceWorker.controller) offer(nw);
          });
        });
      }).catch(function () {});
      if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
    });
  }

  // home-screen card, continue button (delegated, since views re-render)
  main.addEventListener("click", function (e) {
    if (e.target.closest("#install-dismiss")) {
      prefs.hideInstall = true; writeJSON(PREF, prefs);
      var c = document.getElementById("install-card"); if (c) c.remove();
    }
    if (e.target.closest("#continue-btn")) resume = true;
  });

  // keyboard: [ and ] for previous/next chapter when not typing
  document.addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("textarea, input")) return;
    var m = /^#john-(\d+)$/.exec(location.hash);
    if (!m) return;
    var n = +m[1];
    if (e.key === "]" && n < CH.length) location.hash = "#john-" + (n + 1);
    if (e.key === "[" && n > 1) location.hash = "#john-" + (n - 1);
  });

  route();
})();
</script>
<script>/* brand-fit */(function () { var b = document.querySelector(".brand"); if (!b) return;
  function fit() { b.classList.remove("fit1", "fit2"); b.parentNode.classList.remove("tight"); if (b.scrollWidth > b.clientWidth + 1) { b.classList.add("fit1"); if (b.scrollWidth > b.clientWidth + 1) { b.classList.add("fit2"); if (b.scrollWidth > b.clientWidth + 1) b.parentNode.classList.add("tight"); } } }
  fit(); addEventListener("resize", fit); addEventListener("hashchange", function () { setTimeout(fit, 0); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  var bb = document.getElementById("back-btn"); if (bb && window.MutationObserver) new MutationObserver(fit).observe(bb, { attributes: true, attributeFilter: ["hidden"] });
})();</script>
</body>
