was now the middle of the feast, Jesus went up into the temple and taught. <sup class=\"v\">15<\/sup> The Jews therefore marveled, saying, “How does this man know letters, having never been educated?”"},{"type":"q","id":"7.2","field":"q44","text":"<b>Heart:<\/b> Consider the image of the clock. Jesus said, “My time has not yet come” (v. 6). How do you wait for God’s timing?"},{"type":"p","html":"<sup class=\"v\">16<\/sup> Jesus therefore answered them, “My teaching is not mine, but his who sent me. <sup class=\"v\">17<\/sup> If anyone desires to do his will, he will know about the teaching, whether it is from God, or if I am speaking from myself. <sup class=\"v\">18<\/sup> He who speaks from himself seeks his own glory, but he who seeks the glory of him who sent him is true, and no unrighteousness is in him. <sup class=\"v\">19<\/sup> Didn’t Moses give you the law, and yet none of you keeps the law? Why do you seek to kill me?”"},{"type":"q","id":"7.3","field":"q45","text":"<b>Head:<\/b> Jesus said, “If anyone desires to do his will, he will know about the teaching, whether it is from God” (v. 17). How does obeying God help us understand him?"},{"type":"p","html":"<sup class=\"v\">20<\/sup> The multitude answered, “You have a demon! Who seeks to kill you?”"},{"type":"p","html":"<sup class=\"v\">21<\/sup> Jesus answered them, “I did one work and you all marvel because of it. <sup class=\"v\">22<\/sup> Moses has given you circumcision (not that it is of Moses, but of the fathers), and on the Sabbath you circumcise a boy. <sup class=\"v\">23<\/sup> If a boy receives circumcision on the Sabbath, that the law of Moses may not be broken, are you angry with me, because I made a man completely healthy on the Sabbath? <sup class=\"v\">24<\/sup> Don’t judge according to appearance, but judge righteous judgment.”"},{"type":"q","id":"7.4","field":"q46","text":"<b>Action:<\/b> “Don’t judge according to appearance, but judge righteous judgment” (v. 24). When have you judged someone by appearance? How will you look past appearances this week?"},{"type":"p","html":"<sup class=\"v\">25<\/sup> Therefore some of them of Jerusalem said, “Isn’t this he whom they seek to kill? <sup class=\"v\">26<\/sup> Behold, he speaks openly, and they say nothing to him. Can it be that the rulers indeed know that this is truly the Christ? <sup class=\"v\">27<\/sup> However we know where this man comes from, but when the Christ comes, no one will know where he comes from.”"},{"type":"p","html":"<sup class=\"v\">28<\/sup> Jesus therefore cried out in the temple, teaching and saying, “You both know me, and know where I am from. I have not come of myself, but he who sent me is true, whom you don’t know. <sup class=\"v\">29<\/sup> I know him, because I am from him, and he sent me.”"},{"type":"p","html":"<sup class=\"v\">30<\/sup> They sought therefore to take him; but no one laid a hand on him, because his hour had not yet come. <sup class=\"v\">31<\/sup> But of the multitude, many believed in him. They said, “When the Christ comes, he won’t do more signs than those which this man has done, will he?” <sup class=\"v\">32<\/sup> The Pharisees heard the multitude murmuring these things concerning him, and the chief priests and the Pharisees sent officers to arrest him."},{"type":"p","html":"<sup class=\"v\">33<\/sup> Then Jesus said, “I will be with you a little while longer, then I go to him who sent me. <sup class=\"v\">34<\/sup> You will seek me, and won’t find me. You can’t come where I am.”"},{"type":"p","html":"<sup class=\"v\">35<\/sup> The Jews therefore said among themselves, “Where will this man go that we won’t find him? Will he go to the Dispersion among the Greeks, and teach the Greeks? <sup class=\"v\">36<\/sup> What is this word that he said, ‘You will seek me, and won’t find me;’ and ‘Where I am, you can’t come’?”"},{"type":"h2","text":"Rivers of Living Water"},{"type":"img","src":"img/john07-v37.jpg","w":1100,"h":733,"alt":"A stream winding through a mountain valley"},{"type":"p","html":"<sup class=\"v\">37<\/sup> Now on the last and greatest day of the feast, Jesus stood and cried out, “If anyone is thirsty, let him come to me and drink! <sup class=\"v\">38<\/sup> He who believes in me, as the Scripture has said, from within him will flow rivers of living water.” <sup class=\"v\">39<\/sup> But he said this about the Spirit, which those believing in him were to receive. For the Holy Spirit was not yet given, because Jesus wasn’t yet glorified."},{"type":"q","id":"7.5","field":"q47","text":"<b>Action:<\/b> Look at the image of the flowing water. Jesus cried out, “If anyone is thirsty, let him come to me and drink!” (v. 37). What will it look like for you to come to Jesus and drink this week?"},{"type":"h2","text":"The People Are Divided"},{"type":"img","src":"img/john07-v40.jpg","w":1100,"h":733,"alt":"A forest road that splits two ways"},{"type":"p","html":"<sup class=\"v\">40<\/sup> Many of the multitude therefore, when they heard these words, said, “This is truly the prophet.” <sup class=\"v\">41<\/sup> Others said, “This is the Christ.” But some said, “What, does the Christ come out of Galilee? <sup class=\"v\">42<\/sup> Hasn’t the Scripture said that the Christ comes of the offspring of David, and from Bethlehem, the village where David was?” <sup class=\"v\">43<\/sup> So a division arose in the multitude because of him. <sup class=\"v\">44<\/sup> Some of them would have arrested him, but no one laid hands on him. <sup class=\"v\">45<\/sup> The officers therefore came to the chief priests and Pharisees, and they said to them, “Why didn’t you bring him?”"},{"type":"p","html":"<sup class=\"v\">46<\/sup> The officers answered, “No man ever spoke like this man!”"},{"type":"p","html":"<sup class=\"v\">47<\/sup> The Pharisees therefore answered them, “You aren’t also led astray, are you? <sup class=\"v\">48<\/sup> Have any of the rulers believed in him, or of the Pharisees? <sup class=\"v\">49<\/sup> But this multitude that doesn’t know the law is cursed.”"},{"type":"p","html":"<sup class=\"v\">50<\/sup> Nicodemus (he who came to him by night, being one of them) said to them, <sup class=\"v\">51<\/sup> “Does our law judge a man, unless it first hears from him personally and knows what he does?”"},{"type":"p","html":"<sup class=\"v\">52<\/sup> They answered him, “Are you also from Galilee? Search, and see that no prophet has arisen out of Galilee.”"},{"type":"p","html":"<sup class=\"v\">53<\/sup> Everyone went to his own house,"},{"type":"q","id":"7.6","field":"q48","text":"<b>Head:<\/b> Consider the image of the divided road. “So a division arose in the multitude because of him” (v. 43). Why does Jesus still divide people today?"},{"type":"q","id":"7.7","field":"q49","text":"<b>Heart:<\/b> The officers said, “No man ever spoke like this man!” (v. 46). Which words of Jesus have struck you most?"}],"prayer":"God, your Son invites everyone who is thirsty to come to him and drink (7:37). Give me wisdom as I read, and let rivers of living water flow from my life (7:38)."},{"num":8,"hero":{"src":"img/john08-hero.jpg","w":1100,"h":987,"alt":"Stone hands holding a small stone"},"blocks":[{"type":"h2","text":"A Woman Brought to Jesus"},{"type":"p","html":"<sup class=\"v\">1<\/sup> but Jesus went to the Mount of Olives. <sup class=\"v\">2<\/sup> Now very early in the morning, he came again into the temple, and all the people came to him. He sat down and taught them. <sup class=\"v\">3<\/sup> The scribes and the Pharisees brought a woman taken in adultery. Having set her in the middle, <sup class=\"v\">4<\/sup> they told him, “Teacher, we found this woman in adultery, in the very act. <sup class=\"v\">5<\/sup> Now in our law, Moses commanded us to stone such women. What then do you say about her?” <sup class=\"v\">6<\/sup> They said this testing him, that they might have something to accuse him of."},{"type":"p","html":"But Jesus stooped down and wrote on the ground with his finger. <sup class=\"v\">7<\/sup> But when they continued asking him, he looked up and said to them, “He who is without sin among you, let him throw the first stone at her.” <sup class=\"v\">8<\/sup> Again he stooped down and wrote on the ground with his finger."},{"type":"p","html":"<sup class=\"v\">9<\/sup> They, when they heard it, being convicted by their conscience, went out one by one, beginning from the oldest, even to the last. Jesus was left alone with the woman where she was, in the middle. <sup class=\"v\">10<\/sup> Jesus, standing up, saw her and said, “Woman, where are your accusers? Did no one condemn you?”"},{"type":"p","html":"<sup class=\"v\">11<\/sup> She said, “No one, Lord.”"},{"type":"q","id":"8.1","field":"q50","text":"<b>Head:<\/b> Look at the image that opens this chapter. Jesus stooped down and wrote on the ground (v. 6). Then he said, “He who is without sin among you, let him throw the first stone at her” (v. 7). Why did the accusers walk away one by one?"},{"type":"q","id":"8.2","field":"q51","text":"<b>Head:<\/b> Jesus said, “Neither do I condemn you. Go your way. From now on, sin no more” (v. 11). How do mercy and a call to change go together?"},{"type":"p","html":"Jesus said, “Neither do I condemn you. Go your way. From now on, sin no more.”"},{"type":"h2","text":"The Light of the World"},{"type":"img","src":"img/john08-v12.jpg","w":1100,"h":733,"alt":"A lighthouse shining at night"},{"type":"p","html":"<sup class=\"v\">12<\/sup> Again, therefore, Jesus spoke to them, saying, “I am the light of the world. He who follows me will not walk in the darkness, but will have the light of life.”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> The Pharisees therefore said to him, “You testify about yourself. Your testimony is not valid.”"},{"type":"p","html":"<sup class=\"v\">14<\/sup> Jesus answered them, “Even if I testify about myself, my testimony is true, for I know where I came from, and where I am going; but you don’t know where I came from, or where I am going. <sup class=\"v\">15<\/sup> You judge according to the flesh. I judge no one. <sup class=\"v\">16<\/sup> Even if I do judge, my judgment is true, for I am not alone, but I am with the Father who sent me. <sup class=\"v\">17<\/sup> It’s also written in your law that the testimony of two people is valid. <sup class=\"v\">18<\/sup> I am one who testifies about myself, and the Father who sent me testifies about me.”"},{"type":"q","id":"8.3","field":"q52","text":"<b>Heart:<\/b> Consider the image of the light. Jesus said, “I am the light of the world. He who follows me will not walk in the darkness, but will have the light of life” (v. 12). Where do you need Jesus’ light right now?"},{"type":"p","html":"<sup class=\"v\">19<\/sup> They said therefore to him, “Where is your Father?”"},{"type":"p","html":"Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.” <sup class=\"v\">20<\/sup> Jesus spoke these words in the treasury, as he taught in the temple. Yet no one arrested him, because his hour had not yet come. <sup class=\"v\">21<\/sup> Jesus said therefore again to them, “I am going away, and you will seek me, and you will die in your sins. Where I go, you can’t come.”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> The Jews therefore said, “Will he kill himself, because he says, ‘Where I am going, you can’t come’?”"},{"type":"p","html":"<sup class=\"v\">23<\/sup> He said to them, “You are from beneath. I am from above. You are of this world. I am not of this world. <sup class=\"v\">24<\/sup> I said therefore to you that you will die in your sins; for unless you believe that I am he, you will die in your sins.”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> They said therefore to him, “Who are you?”"},{"type":"p","html":"Jesus said to them, “Just what I have been saying to you from the beginning. <sup class=\"v\">26<\/sup> I have many things to speak and to judge concerning you. However he who sent me is true; and the things which I heard from him, these I say to the world.”"},{"type":"p","html":"<sup class=\"v\">27<\/sup> They didn’t understand that he spoke to them about the Father. <sup class=\"v\">28<\/sup> Jesus therefore said to them, “When you have lifted up the Son of Man, then you will know that I am he, and I do nothing of myself, but as my Father taught me, I say these things. <sup class=\"v\">29<\/sup> He who sent me is with me. The Father hasn’t left me alone, for I always do the things that are pleasing to him.”"},{"type":"p","html":"<sup class=\"v\">30<\/sup> As he spoke these things, many believed in him."},{"type":"h2","text":"The Truth Will Make You Free"},{"type":"img","src":"img/john08-v31.jpg","w":1100,"h":734,"alt":"A child opening a birdcage in a forest"},{"type":"p","html":"<sup class=\"v\">31<\/sup> Jesus therefore said to those Jews who had believed him, “If you remain in my word, then you are truly my disciples. <sup class=\"v\">32<\/sup> You will know the truth, and the truth will make you free.”"},{"type":"q","id":"8.4","field":"q53","text":"<b>Heart:<\/b> Look at the image of the child and the birdcage. Jesus said, “You will know the truth, and the truth will make you free” (v. 32). What truth has set you free?"},{"type":"p","html":"<sup class=\"v\">33<\/sup> They answered him, “We are Abraham’s offspring, and have never been in bondage to anyone. How do you say, ‘You will be made free’?”"},{"type":"p","html":"<sup class=\"v\">34<\/sup> Jesus answered them, “Most certainly I tell you, everyone who commits sin is the bondservant of sin. <sup class=\"v\">35<\/sup> A bondservant doesn’t live in the house forever. A son remains forever. <sup class=\"v\">36<\/sup> If therefore the Son makes you free, you will be free indeed. <sup class=\"v\">37<\/sup> I know that you are Abraham’s offspring, yet you seek to kill me, because my word finds no place in you. <sup class=\"v\">38<\/sup> I say the things which I have seen with my Father; and you also do the things which you have seen with your father.”"},{"type":"q","id":"8.5","field":"q54","text":"<b>Action:<\/b> “If therefore the Son makes you free, you will be free indeed” (v. 36). What still holds you captive? Bring it to Jesus in prayer each day this week."},{"type":"p","html":"<sup class=\"v\">39<\/sup> They answered him, “Our father is Abraham.”"},{"type":"p","html":"Jesus said to them, “If you were Abraham’s children, you would do the works of Abraham. <sup class=\"v\">40<\/sup> But now you seek to kill me, a man who has told you the truth which I heard from God. Abraham didn’t do this. <sup class=\"v\">41<\/sup> You do the works of your father.”"},{"type":"p","html":"They said to him, “We were not born of sexual immorality. We have one Father, God.”"},{"type":"p","html":"<sup class=\"v\">42<\/sup> Therefore Jesus said to them, “If God were your father, you would love me, for I came out and have come from God. For I haven’t come of myself, but he sent me. <sup class=\"v\">43<\/sup> Why don’t you understand my speech? Because you can’t hear my word. <sup class=\"v\">44<\/sup> You are of your father, the devil, and you want to do the desires of your father. He was a murderer from the beginning, and doesn’t stand in the truth, because there is no truth in him. When he speaks a lie, he speaks on his own; for he is a liar, and the father of lies. <sup class=\"v\">45<\/sup> But because I tell the truth, you don’t believe me. <sup class=\"v\">46<\/sup> Which of you convicts me of sin? If I tell the truth, why do you not believe me? <sup class=\"v\">47<\/sup> He who is of God hears the words of God. For this cause you don’t hear, because you are not of God.”"},{"type":"q","id":"8.6","field":"q55","text":"<b>Action:<\/b> Jesus said, “He who is of God hears the words of God” (v. 47). How will you listen for God’s words this week?"},{"type":"h2","text":"Before Abraham Was, I Am"},{"type":"img","src":"img/john08-v48.jpg","w":1100,"h":619,"alt":"A great old tree with spreading branches"},{"type":"p","html":"<sup class=\"v\">48<\/sup> Then the Jews answered him, “Don’t we say well that you are a Samaritan, and have a demon?”"},{"type":"p","html":"<sup class=\"v\">49<\/sup> Jesus answered, “I don’t have a demon, but I honor my Father and you dishonor me. <sup class=\"v\">50<\/sup> But I don’t seek my own glory. There is one who seeks and judges. <sup class=\"v\">51<\/sup> Most certainly, I tell you, if a person keeps my word, he will never see death.”"},{"type":"p","html":"<sup class=\"v\">52<\/sup> Then the Jews said to him, “Now we know that you have a demon. Abraham died, as did the prophets; and you say, ‘If a man keeps my word, he will never taste of death.’ <sup class=\"v\">53<\/sup> Are you greater than our father, Abraham, who died? The prophets died. Who do you make yourself out to be?”"},{"type":"p","html":"<sup class=\"v\">54<\/sup> Jesus answered, “If I glorify myself, my glory is nothing. It is my Father who glorifies me, of whom you say that he is our God. <sup class=\"v\">55<\/sup> You have not known him, but I know him. If I said, ‘I don’t know him,’ I would be like you, a liar. But I know him and keep his word. <sup class=\"v\">56<\/sup> Your father Abraham rejoiced to see my day. He saw it, and was glad.”"},{"type":"p","html":"<sup class=\"v\">57<\/sup> The Jews therefore said to him, “You are not yet fifty years old! Have you seen Abraham?”"},{"type":"p","html":"<sup class=\"v\">58<\/sup> Jesus said to them, “Most certainly, I tell you, before Abraham came into existence, I AM.”"},{"type":"p","html":"<sup class=\"v\">59<\/sup> Therefore they took up stones to throw at him, but Jesus was hidden, and went out of the temple, having gone through the middle of them, and so passed by."},{"type":"q","id":"8.7","field":"q56","text":"<b>Heart:<\/b> Consider the image of the ancient tree. Jesus said, “before Abraham came into existence, I AM” (v. 58). What does it mean to you that Jesus is eternal?"}],"prayer":"Father in heaven, your Son is “the light of the world” (8:12). Give me wisdom as I read, and help me remain in his word so that the truth will make me free (8:31–32)."},{"num":9,"hero":{"src":"img/john09-hero.jpg","w":1100,"h":619,"alt":"Hands shaping wet clay"},"blocks":[{"type":"h2","text":"Jesus Heals a Man Born Blind"},{"type":"p","html":"<sup class=\"v\">1<\/sup> As he passed by, he saw a man blind from birth. <sup class=\"v\">2<\/sup> His disciples asked him, “Rabbi, who sinned, this man or his parents, that he was born blind?”"},{"type":"p","html":"<sup class=\"v\">3<\/sup> Jesus answered, “This man didn’t sin, nor did his parents; but, that the works of God might be revealed in him. <sup class=\"v\">4<\/sup> I must work the works of him who sent me while it is day. The night is coming, when no one can work. <sup class=\"v\">5<\/sup> While I am in the world, I am the light of the world.” <sup class=\"v\">6<\/sup> When he had said this, he spat on the ground, made mud with the saliva, anointed the blind man’s eyes with the mud, <sup class=\"v\">7<\/sup> and said to him, “Go, wash in the pool of Siloam” (which means “Sent”). So he went away, washed, and came back seeing. <sup class=\"v\">8<\/sup> The neighbors therefore, and those who saw that he was blind before, said, “Isn’t this he who sat and begged?” <sup class=\"v\">9<\/sup> Others were saying, “It is he.” Still others were saying, “He looks like him.”"},{"type":"q","id":"9.1","field":"q57","text":"<b>Head:<\/b> Look at the image that opens this chapter. The disciples asked, “Rabbi, who sinned, this man or his parents” (v. 2). Jesus answered that it was “that the works of God might be revealed in him” (v. 3). How does Jesus’ answer change the way we see suffering?"},{"type":"p","html":"He said, “I am he.” <sup class=\"v\">10<\/sup> They therefore were asking him, “How were your eyes opened?”"},{"type":"img","src":"img/john09-v11.jpg","w":1100,"h":733,"alt":"A young man washing his face in a mountain stream"},{"type":"p","html":"<sup class=\"v\">11<\/sup> He answered, “A man called Jesus made mud, anointed my eyes, and said to me, ‘Go to the pool of Siloam and wash.’ So I went away and washed, and I received sight.”"},{"type":"p","html":"<sup class=\"v\">12<\/sup> Then they asked him, “Where is he?”"},{"type":"q","id":"9.2","field":"q58","text":"<b>Action:<\/b> Consider the image of the washing. The man “went away, washed, and came back seeing” (v. 7). What step of trust is Jesus asking of you? When will you take it?"},{"type":"p","html":"He said, “I don’t know.”"},{"type":"h2","text":"The Pharisees Question the Man"},{"type":"p","html":"<sup class=\"v\">13<\/sup> They brought him who had been blind to the Pharisees. <sup class=\"v\">14<\/sup> It was a Sabbath when Jesus made the mud and opened his eyes. <sup class=\"v\">15<\/sup> Again therefore the Pharisees also asked him how he received his sight. He said to them, “He put mud on my eyes, I washed, and I see.”"},{"type":"p","html":"<sup class=\"v\">16<\/sup> Some therefore of the Pharisees said, “This man is not from God, because he doesn’t keep the Sabbath.” Others said, “How can a man who is a sinner do such signs?” There was division among them. <sup class=\"v\">17<\/sup> Therefore they asked the blind man again, “What do you say about him, because he opened your eyes?”"},{"type":"p","html":"He said, “He is a prophet.”"},{"type":"p","html":"<sup class=\"v\">18<\/sup> The Jews therefore didn’t believe concerning him, that he had been blind, and had received his sight, until they called the parents of him who had received his sight, <sup class=\"v\">19<\/sup> and asked them, “Is this your son, whom you say was born blind? How then does he now see?”"},{"type":"p","html":"<sup class=\"v\">20<\/sup> His parents answered them, “We know that this is our son, and that he was born blind; <sup class=\"v\">21<\/sup> but how he now sees, we don’t know; or who opened his eyes, we don’t know. He is of age. Ask him. He will speak for himself.” <sup class=\"v\">22<\/sup> His parents said these things because they feared the Jews; for the Jews had already agreed that if any man would confess him as Christ, he would be put out of the synagogue. <sup class=\"v\">23<\/sup> Therefore his parents said, “He is of age. Ask him.”"},{"type":"q","id":"9.3","field":"q59","text":"<b>Head:<\/b> The man’s parents were afraid to speak (v. 22). What fears keep people quiet about their faith?"},{"type":"img","src":"img/john09-v24.jpg","w":1100,"h":733,"alt":"An older man looking upward"},{"type":"p","html":"<sup class=\"v\">24<\/sup> So they called the man who was blind a second time, and said to him, “Give glory to God. We know that this man is a sinner.”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> He therefore answered, “I don’t know if he is a sinner. One thing I do know: that though I was blind, now I see.”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> They said to him again, “What did he do to you? How did he open your eyes?”"},{"type":"p","html":"<sup class=\"v\">27<\/sup> He answered them, “I told you already, and you didn’t listen. Why do you want to hear it again? You don’t also want to become his disciples, do you?”"},{"type":"p","html":"<sup class=\"v\">28<\/sup> They insulted him and said, “You are his disciple, but we are disciples of Moses. <sup class=\"v\">29<\/sup> We know that God has spoken to Moses. But as for this man, we don’t know where he comes from.”"},{"type":"p","html":"<sup class=\"v\">30<\/sup> The man answered them, “How amazing! You don’t know where he comes from, yet he opened my eyes. <sup class=\"v\">31<\/sup> We know that God doesn’t listen to sinners, but if anyone is a worshiper of God, and does his will, he listens to him. <sup class=\"v\">32<\/sup> Since the world began it has never been heard of that anyone opened the eyes of someone born blind. <sup class=\"v\">33<\/sup> If this man were not from God, he could do nothing.”"},{"type":"p","html":"<sup class=\"v\">34<\/sup> They answered him, “You were altogether born in sins, and do you teach us?” Then they threw him out."},{"type":"q","id":"9.4","field":"q60","text":"<b>Heart:<\/b> The man said, “One thing I do know: that though I was blind, now I see” (v. 25). What is your “one thing” story about Jesus?"},{"type":"q","id":"9.5","field":"q61","text":"<b>Action:<\/b> Look at the image of the man looking up. The healed man stood firm under questioning (v. 30-33). When have you had to speak up about what Jesus has done for you? Where will you speak up this week?"},{"type":"h2","text":"Spiritual Blindness"},{"type":"img","src":"img/john09-v35.jpg","w":1100,"h":733,"alt":"A blurred view through a rain-covered window"},{"type":"p","html":"<sup class=\"v\">35<\/sup> Jesus heard that they had thrown him out, and finding him, he said, “Do you believe in the Son of God?”"},{"type":"p","html":"<sup class=\"v\">36<\/sup> He answered, “Who is he, Lord, that I may believe in him?”"},{"type":"p","html":"<sup class=\"v\">37<\/sup> Jesus said to him, “You have both seen him, and it is he who speaks with you.”"},{"type":"p","html":"<sup class=\"v\">38<\/sup> He said, “Lord, I believe!” and he worshiped him."},{"type":"p","html":"<sup class=\"v\">39<\/sup> Jesus said, “I came into this world for judgment, that those who don’t see may see; and that those who see may become blind.”"},{"type":"p","html":"<sup class=\"v\">40<\/sup> Those of the Pharisees who were with him heard these things, and said to him, “Are we also blind?”"},{"type":"p","html":"<sup class=\"v\">41<\/sup> Jesus said to them, “If you were blind, you would have no sin; but now you say, ‘We see.’ Therefore your sin remains."},{"type":"q","id":"9.6","field":"q62","text":"<b>Heart:<\/b> Consider the image of the blurred view. Jesus said, “I came into this world for judgment, that those who don’t see may see; and that those who see may become blind” (v. 39). What might you be blind to?"},{"type":"q","id":"9.7","field":"q63","text":"<b>Heart:<\/b> Which image in this chapter do you most relate to? Why?"}],"prayer":"God, your Son opened the eyes of a man born blind (9:6–7). Give me wisdom as I read, and help me say, “though I was blind, now I see” (9:25)."},{"num":10,"hero":{"src":"img/john10-hero.jpg","w":1100,"h":733,"alt":"A shepherd standing among his sheep"},"blocks":[{"type":"h2","text":"The Good Shepherd"},{"type":"p","html":"<sup class=\"v\">1<\/sup> “Most certainly, I tell you, one who doesn’t enter by the door into the sheep fold, but climbs up some other way, is a thief and a robber. <sup class=\"v\">2<\/sup> But one who enters in by the door is the shepherd of the sheep. <sup class=\"v\">3<\/sup> The gatekeeper opens the gate for him, and the sheep listen to his voice. He calls his own sheep by name, and leads them out. <sup class=\"v\">4<\/sup> Whenever he brings out his own sheep, he goes before them, and the sheep follow him, for they know his voice. <sup class=\"v\">5<\/sup> They will by no means follow a stranger, but will flee from him; for they don’t know the voice of strangers.” <sup class=\"v\">6<\/sup> Jesus spoke this parable to them, but they didn’t understand what he was telling them."},{"type":"q","id":"10.1","field":"q64","text":"<b>Head:<\/b> Look at the image that opens this chapter. Jesus said, “the sheep listen to his voice. He calls his own sheep by name, and leads them out” (v. 3). How do sheep come to know their shepherd’s voice? How do we learn to recognize Jesus’ voice?"},{"type":"img","src":"img/john10-v07.jpg","w":1100,"h":731,"alt":"An old wooden gate at the edge of a pasture"},{"type":"p","html":"<sup class=\"v\">7<\/sup> Jesus therefore said to them again, “Most certainly, I tell you, I am the sheep’s door. <sup class=\"v\">8<\/sup> All who came before me are thieves and robbers, but the sheep didn’t listen to them. <sup class=\"v\">9<\/sup> I am the door. If anyone enters in by me, he will be saved, and will go in and go out, and will find pasture. <sup class=\"v\">10<\/sup> The thief only comes to steal, kill, and destroy. I came that they may have life, and may have it abundantly. <sup class=\"v\">11<\/sup> I am the good shepherd. The good shepherd lays down his life for the sheep. <sup class=\"v\">12<\/sup> He who is a hired hand, and not a shepherd, who doesn’t own the sheep, sees the wolf coming, leaves the sheep, and flees. The wolf snatches the sheep, and scatters them. <sup class=\"v\">13<\/sup> The hired hand flees because he is a hired hand, and doesn’t care for the sheep. <sup class=\"v\">14<\/sup> I am the good shepherd. I know my own, and I’m known by my own; <sup class=\"v\">15<\/sup> even as the Father knows me, and I know the Father. I lay down my life for the sheep. <sup class=\"v\">16<\/sup> I have other sheep, which are not of this fold. I must bring them also, and they will hear my voice. They will become one flock with one shepherd. <sup class=\"v\">17<\/sup> Therefore the Father loves me, because I lay down my life, that I may take it again. <sup class=\"v\">18<\/sup> No one takes it away from me, but I lay it down by myself. I have power to lay it down, and I have power to take it again. I received this commandment from my Father.”"},{"type":"q","id":"10.2","field":"q65","text":"<b>Head:<\/b> Consider the image of the gate. Jesus said, “I am the door. If anyone enters in by me, he will be saved” (v. 9). What does it mean that Jesus is the door?"},{"type":"q","id":"10.3","field":"q66","text":"<b>Heart:<\/b> “I came that they may have life, and may have it abundantly” (v. 10). What does abundant life look like for you?"},{"type":"q","id":"10.4","field":"q67","text":"<b>Heart:<\/b> “I am the good shepherd. The good shepherd lays down his life for the sheep” (v. 11). How have you experienced the Good Shepherd’s care?"},{"type":"p","html":"<sup class=\"v\">19<\/sup> Therefore a division arose again among the Jews because of these words. <sup class=\"v\">20<\/sup> Many of them said, “He has a demon, and is insane! Why do you listen to him?” <sup class=\"v\">21<\/sup> Others said, “These are not the sayings of one possessed by a demon. It isn’t possible for a demon to open the eyes of the blind, is it?”"},{"type":"h2","text":"Jesus at the Festival of Dedication"},{"type":"img","src":"img/john10-v22.jpg","w":1100,"h":758,"alt":"A long stone colonnade"},{"type":"p","html":"<sup class=\"v\">22<\/sup> It was the Feast of the Dedication at Jerusalem. <sup class=\"v\">23<\/sup> It was winter, and Jesus was walking in the temple, in Solomon’s porch. <sup class=\"v\">24<\/sup> The Jews therefore came around him and said to him, “How long will you hold us in suspense? If you are the Christ, tell us plainly.”"},{"type":"img","src":"img/john10-v25.jpg","w":1100,"h":688,"alt":"Hands gently holding a yellow chick"},{"type":"p","html":"<sup class=\"v\">25<\/sup> Jesus answered them, “I told you, and you don’t believe. The works that I do in my Father’s name, these testify about me. <sup class=\"v\">26<\/sup> But you don’t believe, because you are not of my sheep, as I told you. <sup class=\"v\">27<\/sup> My sheep hear my voice, and I know them, and they follow me. <sup class=\"v\">28<\/sup> I give eternal life to them. They will never perish, and no one will snatch them out of my hand. <sup class=\"v\">29<\/sup> My Father who has given them to me is greater than all. No one is able to snatch them out of my Father’s hand. <sup class=\"v\">30<\/sup> I and the Father are one.”"},{"type":"q","id":"10.5","field":"q68","text":"<b>Action:<\/b> Look at the image of the hands. Jesus said, “no one will snatch them out of my hand” (v. 28). How does this promise give you security? Whom could you encourage with it this week?"},{"type":"p","html":"<sup class=\"v\">31<\/sup> Therefore Jews took up stones again to stone him. <sup class=\"v\">32<\/sup> Jesus answered them, “I have shown you many good works from my Father. For which of those works do you stone me?”"},{"type":"p","html":"<sup class=\"v\">33<\/sup> The Jews answered him, “We don’t stone you for a good work, but for blasphemy: because you, being a man, make yourself God.”"},{"type":"p","html":"<sup class=\"v\">34<\/sup> Jesus answered them, “Isn’t it written in your law, ‘I said, you are gods?’ <sup class=\"v\">35<\/sup> If he called them gods, to whom the word of God came (and the Scripture can’t be broken), <sup class=\"v\">36<\/sup> do you say of him whom the Father sanctified and sent into the world, ‘You blaspheme,’ because I said, ‘I am the Son of God?’ <sup class=\"v\">37<\/sup> If I don’t do the works of my Father, don’t believe me. <sup class=\"v\">38<\/sup> But if I do them, though you don’t believe me, believe the works, that you may know and believe that the Father is in me, and I in the Father.”"},{"type":"p","html":"<sup class=\"v\">39<\/sup> They sought again to seize him, and he went out of their hand. <sup class=\"v\">40<\/sup> He went away again beyond the Jordan into the place where John was baptizing at first, and he stayed there. <sup class=\"v\">41<\/sup> Many came to him. They said, “John indeed did no sign, but everything that John said about this man is true.” <sup class=\"v\">42<\/sup> Many believed in him there."},{"type":"q","id":"10.6","field":"q69","text":"<b>Action:<\/b> Consider the image of the colonnade. The leaders said, “If you are the Christ, tell us plainly” (v. 24). What would you ask Jesus plainly if you could? Bring that question to him in prayer this week."},{"type":"q","id":"10.7","field":"q70","text":"<b>Heart:<\/b> Which image in this chapter brings you the most comfort? Why?"}],"prayer":"Father in heaven, your Son is the good shepherd who “lays down his life for the sheep” (10:11). Give me wisdom as I read, and help me know his voice and follow him (10:27)."},{"num":11,"hero":{"src":"img/john11-hero.jpg","w":1100,"h":733,"alt":"An ancient tomb cut into rock"},"blocks":[{"type":"h2","text":"The Death of Lazarus"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now a certain man was sick, Lazarus from Bethany, of the village of Mary and her sister, Martha. <sup class=\"v\">2<\/sup> It was that Mary who had anointed the Lord with ointment and wiped his feet with her hair, whose brother, Lazarus, was sick. <sup class=\"v\">3<\/sup> The sisters therefore sent to him, saying, “Lord, behold, he for whom you have great affection is sick.” <sup class=\"v\">4<\/sup> But when Jesus heard it, he said, “This sickness is not to death, but for the glory of God, that God’s Son may be glorified by it.” <sup class=\"v\">5<\/sup> Now Jesus loved Martha, and her sister, and Lazarus. <sup class=\"v\">6<\/sup> When therefore he heard that he was sick, he stayed two days in the place where he was. <sup class=\"v\">7<\/sup> Then after this he said to the disciples, “Let’s go into Judea again.”"},{"type":"p","html":"<sup class=\"v\">8<\/sup> The disciples asked him, “Rabbi, the Jews were just trying to stone you. Are you going there again?”"},{"type":"p","html":"<sup class=\"v\">9<\/sup> Jesus answered, “Aren’t there twelve hours of daylight? If a man walks in the day, he doesn’t stumble, because he sees the light of this world. <sup class=\"v\">10<\/sup> But if a man walks in the night, he stumbles, because the light isn’t in him.” <sup class=\"v\">11<\/sup> He said these things, and after that, he said to them, “Our friend, Lazarus, has fallen asleep, but I am going so that I may awake him out of sleep.”"},{"type":"p","html":"<sup class=\"v\">12<\/sup> The disciples therefore said, “Lord, if he has fallen asleep, he will recover.”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> Now Jesus had spoken of his death, but they thought that he spoke of taking rest in sleep. <sup class=\"v\">14<\/sup> So Jesus said to them plainly then, “Lazarus is dead. <sup class=\"v\">15<\/sup> I am glad for your sakes that I was not there, so that you may believe. Nevertheless, let’s go to him.”"},{"type":"p","html":"<sup class=\"v\">16<\/sup> Thomas therefore, who is called Didymus, said to his fellow disciples, “Let’s go also, that we may die with him.”"},{"type":"q","id":"11.1","field":"q71","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Jesus loved Martha, Mary and Lazarus (v. 5), yet when he heard that Lazarus was sick, he stayed two more days (v. 6). When has God’s timing been hard for you?"},{"type":"h2","text":"Jesus Comforts Martha and Mary"},{"type":"img","src":"img/john11-v17.jpg","w":1100,"h":733,"alt":"Two sisters hugging"},{"type":"p","html":"<sup class=\"v\">17<\/sup> So when Jesus came, he found that he had been in the tomb four days already. <sup class=\"v\">18<\/sup> Now Bethany was near Jerusalem, about fifteen stadia away. <sup class=\"v\">19<\/sup> Many of the Jews had joined the women around Martha and Mary, to console them concerning their brother. <sup class=\"v\">20<\/sup> Then when Martha heard that Jesus was coming, she went and met him, but Mary stayed in the house. <sup class=\"v\">21<\/sup> Therefore Martha said to Jesus, “Lord, if you would have been here, my brother wouldn’t have died. <sup class=\"v\">22<\/sup> Even now I know that whatever you ask of God, God will give you.” <sup class=\"v\">23<\/sup> Jesus said to her, “Your brother will rise again.”"},{"type":"p","html":"<sup class=\"v\">24<\/sup> Martha said to him, “I know that he will rise again in the resurrection at the last day.”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> Jesus said to her, “I am the resurrection and the life. He who believes in me will still live, even if he dies. <sup class=\"v\">26<\/sup> Whoever lives and believes in me will never die. Do you believe this?”"},{"type":"p","html":"<sup class=\"v\">27<\/sup> She said to him, “Yes, Lord. I have come to believe that you are the Christ, God’s Son, he who comes into the world.”"},{"type":"q","id":"11.2","field":"q72","text":"<b>Heart:<\/b> Consider the image of the two sisters. Martha said, “Lord, if you would have been here, my brother wouldn’t have died” (v. 21). When have you said something like that to God?"},{"type":"q","id":"11.3","field":"q73","text":"<b>Head:<\/b> Jesus said, “I am the resurrection and the life. He who believes in me will still live, even if he dies” (v. 25). What does Jesus mean? What difference does it make?"},{"type":"p","html":"<sup class=\"v\">28<\/sup> When she had said this, she went away and called Mary, her sister, secretly, saying, “The Teacher is here and is calling you.”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> When she heard this, she arose quickly and went to him. <sup class=\"v\">30<\/sup> Now Jesus had not yet come into the village, but was in the place where Martha met him. <sup class=\"v\">31<\/sup> Then the Jews who were with her in the house and were consoling her, when they saw Mary, that she rose up quickly and went out, followed her, saying, “She is going to the tomb to weep there.” <sup class=\"v\">32<\/sup> Therefore when Mary came to where Jesus was and saw him, she fell down at his feet, saying to him, “Lord, if you would have been here, my brother wouldn’t have died.”"},{"type":"p","html":"<sup class=\"v\">33<\/sup> When Jesus therefore saw her weeping, and the Jews weeping who came with her, he groaned in the spirit, and was troubled, <sup class=\"v\">34<\/sup> and said, “Where have you laid him?”"},{"type":"p","html":"They told him, “Lord, come and see.”"},{"type":"img","src":"img/john11-v35.jpg","w":1100,"h":688,"alt":"A tear on a child’s cheek"},{"type":"p","html":"<sup class=\"v\">35<\/sup> Jesus wept."},{"type":"p","html":"<sup class=\"v\">36<\/sup> The Jews therefore said, “See how much affection he had for him!” <sup class=\"v\">37<\/sup> Some of them said, “Couldn’t this man, who opened the eyes of him who was blind, have also kept this man from dying?”"},{"type":"q","id":"11.4","field":"q74","text":"<b>Heart:<\/b> Consider the image of the tear. “Jesus wept” (v. 35). What does it mean to you that Jesus weeps with us?"},{"type":"h2","text":"Jesus Raises Lazarus"},{"type":"p","html":"<sup class=\"v\">38<\/sup> Jesus therefore, again groaning in himself, came to the tomb. Now it was a cave, and a stone lay against it. <sup class=\"v\">39<\/sup> Jesus said, “Take away the stone.”"},{"type":"p","html":"Martha, the sister of him who was dead, said to him, “Lord, by this time there is a stench, for he has been dead four days.”"},{"type":"p","html":"<sup class=\"v\">40<\/sup> Jesus said to her, “Didn’t I tell you that if you believed, you would see God’s glory?”"},{"type":"p","html":"<sup class=\"v\">41<\/sup> So they took away the stone from the place where the dead man was lying. Jesus lifted up his eyes, and said, “Father, I thank you that you listened to me. <sup class=\"v\">42<\/sup> I know that you always listen to me, but because of the multitude standing around I said this, that they may believe that you sent me.” <sup class=\"v\">43<\/sup> When he had said this, he cried with a loud voice, “Lazarus, come out!”"},{"type":"img","src":"img/john11-v44.jpg","w":1100,"h":729,"alt":"Light shining through a door into a dark room"},{"type":"p","html":"<sup class=\"v\">44<\/sup> He who was dead came out, bound hand and foot with wrappings, and his face was wrapped around with a cloth."},{"type":"q","id":"11.5","field":"q75","text":"<b>Action:<\/b> Look at the image of the doorway. Jesus cried, “Lazarus, come out!” (v. 43). What in your life needs Jesus to call it out into new life? Pray about it each day this week."},{"type":"q","id":"11.6","field":"q76","text":"<b>Action:<\/b> Jesus said, “Free him, and let him go” (v. 44). How will you help someone be set free this week?"},{"type":"p","html":"Jesus said to them, “Free him, and let him go.”"},{"type":"h2","text":"The Plot to Kill Jesus"},{"type":"p","html":"<sup class=\"v\">45<\/sup> Therefore many of the Jews who came to Mary and saw what Jesus did believed in him. <sup class=\"v\">46<\/sup> But some of them went away to the Pharisees and told them the things which Jesus had done. <sup class=\"v\">47<\/sup> The chief priests therefore and the Pharisees gathered a council, and said, “What are we doing? For this man does many signs. <sup class=\"v\">48<\/sup> If we leave him alone like this, everyone will believe in him, and the Romans will come and take away both our place and our nation.”"},{"type":"p","html":"<sup class=\"v\">49<\/sup> But a certain one of them, Caiaphas, being high priest that year, said to them, “You know nothing at all, <sup class=\"v\">50<\/sup> nor do you consider that it is advantageous for us that one man should die for the people, and that the whole nation not perish.” <sup class=\"v\">51<\/sup> Now he didn’t say this of himself, but being high priest that year, he prophesied that Jesus would die for the nation, <sup class=\"v\">52<\/sup> and not for the nation only, but that he might also gather together into one the children of God who are scattered abroad. <sup class=\"v\">53<\/sup> So from that day forward they took counsel that they might put him to death. <sup class=\"v\">54<\/sup> Jesus therefore walked no more openly among the Jews, but departed from there into the country near the wilderness, to a city called Ephraim. He stayed there with his disciples."},{"type":"p","html":"<sup class=\"v\">55<\/sup> Now the Passover of the Jews was at hand. Many went up from the country to Jerusalem before the Passover, to purify themselves. <sup class=\"v\">56<\/sup> Then they sought for Jesus and spoke with one another as they stood in the temple, “What do you think—that he isn’t coming to the feast at all?” <sup class=\"v\">57<\/sup> Now the chief priests and the Pharisees had commanded that if anyone knew where he was, he should report it, that they might seize him."},{"type":"q","id":"11.7","field":"q77","text":"<b>Head:<\/b> Caiaphas said it was better “that one man should die for the people” (v. 50). How did his words point to something greater than he knew?"}],"prayer":"God, your Son is “the resurrection and the life” (11:25), and he wept with those who grieved (11:35). Give me wisdom as I read, and help me trust him in my sorrow."},{"num":12,"hero":{"src":"img/john12-hero.jpg","w":1100,"h":733,"alt":"Golden oil pouring from a glass jar"},"blocks":[{"type":"h2","text":"Mary Anoints Jesus"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Then six days before the Passover, Jesus came to Bethany, where Lazarus was, who had been dead, whom he raised from the dead. <sup class=\"v\">2<\/sup> So they made him a supper there. Martha served, but Lazarus was one of those who sat at the table with him. <sup class=\"v\">3<\/sup> Therefore Mary took a pound of ointment of pure nard, very precious, and anointed Jesus’s feet and wiped his feet with her hair. The house was filled with the fragrance of the ointment. <sup class=\"v\">4<\/sup> Then Judas Iscariot, Simon’s son, one of his disciples, who would betray him, said, <sup class=\"v\">5<\/sup> “Why wasn’t this ointment sold for three hundred denarii, and given to the poor?” <sup class=\"v\">6<\/sup> Now he said this, not because he cared for the poor, but because he was a thief, and having the money box, used to steal what was put into it. <sup class=\"v\">7<\/sup> But Jesus said, “Leave her alone. She has kept this for the day of my burial. <sup class=\"v\">8<\/sup> For you always have the poor with you, but you don’t always have me.”"},{"type":"q","id":"12.1","field":"q78","text":"<b>Action:<\/b> Look at the image that opens this chapter. Mary poured costly ointment on Jesus’ feet, and “The house was filled with the fragrance of the ointment” (v. 3). What act of love will you offer Jesus this week?"},{"type":"p","html":"<sup class=\"v\">9<\/sup> A large crowd therefore of the Jews learned that he was there, and they came, not for Jesus’ sake only, but that they might see Lazarus also, whom he had raised from the dead. <sup class=\"v\">10<\/sup> But the chief priests conspired to put Lazarus to death also, <sup class=\"v\">11<\/sup> because on account of him many of the Jews went away and believed in Jesus."},{"type":"h2","text":"Jesus Enters Jerusalem"},{"type":"p","html":"<sup class=\"v\">12<\/sup> On the next day a great multitude had come to the feast. When they heard that Jesus was coming to Jerusalem, <sup class=\"v\">13<\/sup> they took the branches of the palm trees and went out to meet him, and cried out, “Hosanna! Blessed is he who comes in the name of the Lord, the King of Israel!”"},{"type":"img","src":"img/john12-v14.jpg","w":1100,"h":733,"alt":"A young donkey"},{"type":"p","html":"<sup class=\"v\">14<\/sup> Jesus, having found a young donkey, sat on it. As it is written, <sup class=\"v\">15<\/sup> “Don’t be afraid, daughter of Zion. Behold, your King comes, sitting on a donkey’s colt.” <sup class=\"v\">16<\/sup> His disciples didn’t understand these things at first, but when Jesus was glorified, then they remembered that these things were written about him, and that they had done these things to him. <sup class=\"v\">17<\/sup> The multitude therefore that was with him when he called Lazarus out of the tomb and raised him from the dead was testifying about it. <sup class=\"v\">18<\/sup> For this cause also the multitude went and met him, because they heard that he had done this sign. <sup class=\"v\">19<\/sup> The Pharisees therefore said among themselves, “See how you accomplish nothing. Behold, the world has gone after him.”"},{"type":"q","id":"12.2","field":"q79","text":"<b>Head:<\/b> Consider the image of the donkey. The crowd cried, “Hosanna! Blessed is he who comes in the name of the Lord, the King of Israel!” (v. 13), and Jesus came riding on a young donkey (v. 14). What kind of King is Jesus?"},{"type":"h2","text":"A Grain of Wheat"},{"type":"img","src":"img/john12-v20.jpg","w":1100,"h":733,"alt":"A seed sprouting from the soil"},{"type":"p","html":"<sup class=\"v\">20<\/sup> Now there were certain Greeks among those that went up to worship at the feast. <sup class=\"v\">21<\/sup> These, therefore, came to Philip, who was from Bethsaida of Galilee, and asked him, saying, “Sir, we want to see Jesus.” <sup class=\"v\">22<\/sup> Philip came and told Andrew, and in turn, Andrew came with Philip, and they told Jesus. <sup class=\"v\">23<\/sup> Jesus answered them, “The time has come for the Son of Man to be glorified. <sup class=\"v\">24<\/sup> Most certainly I tell you, unless a grain of wheat falls into the earth and dies, it remains by itself alone. But if it dies, it bears much fruit. <sup class=\"v\">25<\/sup> He who loves his life will lose it. He who hates his life in this world will keep it to eternal life. <sup class=\"v\">26<\/sup> If anyone serves me, let him follow me. Where I am, there my servant will also be. If anyone serves me, the Father will honor him."},{"type":"q","id":"12.3","field":"q80","text":"<b>Action:<\/b> Some Greeks said, “Sir, we want to see Jesus” (v. 21). How will your life help someone see Jesus this week?"},{"type":"q","id":"12.4","field":"q81","text":"<b>Heart:<\/b> Look at the image of the seed. Jesus said, “unless a grain of wheat falls into the earth and dies, it remains by itself alone. But if it dies, it bears much fruit” (v. 24). What might need to “die” in you so that new life can grow?"},{"type":"p","html":"<sup class=\"v\">27<\/sup> “Now my soul is troubled. What shall I say? ‘Father, save me from this time?’ But I came to this time for this cause. <sup class=\"v\">28<\/sup> Father, glorify your name!”"},{"type":"p","html":"Then a voice came out of the sky, saying, “I have both glorified it, and will glorify it again.”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> Therefore the multitude who stood by and heard it said that it had thundered. Others said, “An angel has spoken to him.”"},{"type":"p","html":"<sup class=\"v\">30<\/sup> Jesus answered, “This voice hasn’t come for my sake, but for your sakes. <sup class=\"v\">31<\/sup> Now is the judgment of this world. Now the prince of this world will be cast out. <sup class=\"v\">32<\/sup> And I, if I am lifted up from the earth, will draw all people to myself.” <sup class=\"v\">33<\/sup> But he said this, signifying by what kind of death he should die. <sup class=\"v\">34<\/sup> The multitude answered him, “We have heard out of the law that the Christ remains forever. How do you say, ‘The Son of Man must be lifted up?’ Who is this Son of Man?”"},{"type":"img","src":"img/john12-v35.jpg","w":1100,"h":825,"alt":"Two people walking toward a setting sun"},{"type":"p","html":"<sup class=\"v\">35<\/sup> Jesus therefore said to them, “Yet a little while the light is with you. Walk while you have the light, that darkness doesn’t overtake you. He who walks in the darkness doesn’t know where he is going. <sup class=\"v\">36<\/sup> While you have the light, believe in the light, that you may become children of light.” Jesus said these things, and he departed and hid himself from them."},{"type":"q","id":"12.5","field":"q82","text":"<b>Head:<\/b> Consider the image for this section. Jesus said, “Walk while you have the light, that darkness doesn’t overtake you” (v. 35). What does Jesus mean by walking in the light?"},{"type":"h2","text":"Belief and Unbelief"},{"type":"p","html":"<sup class=\"v\">37<\/sup> But though he had done so many signs before them, yet they didn’t believe in him, <sup class=\"v\">38<\/sup> that the word of Isaiah the prophet might be fulfilled, which he spoke,"},{"type":"poem","lines":["“Lord, who has believed our report?","To whom has the arm of the Lord been revealed?”"]},{"type":"p","html":"<sup class=\"v\">39<\/sup> For this cause they couldn’t believe, for Isaiah said again,"},{"type":"poem","lines":["<sup class=\"v\">40<\/sup> “He has blinded their eyes and he hardened their heart,","lest they should see with their eyes,","and perceive with their heart,","and would turn,","and I would heal them.”"]},{"type":"p","html":"<sup class=\"v\">41<\/sup> Isaiah said these things when he saw his glory, and spoke of him. <sup class=\"v\">42<\/sup> Nevertheless even many of the rulers believed in him, but because of the Pharisees they didn’t confess it, so that they wouldn’t be put out of the synagogue, <sup class=\"v\">43<\/sup> for they loved men’s praise more than God’s praise."},{"type":"p","html":"<sup class=\"v\">44<\/sup> Jesus cried out and said, “Whoever believes in me, believes not in me, but in him who sent me. <sup class=\"v\">45<\/sup> He who sees me sees him who sent me. <sup class=\"v\">46<\/sup> I have come as a light into the world, that whoever believes in me may not remain in the darkness. <sup class=\"v\">47<\/sup> If anyone listens to my sayings, and doesn’t believe, I don’t judge him. For I came not to judge the world, but to save the world. <sup class=\"v\">48<\/sup> He who rejects me, and doesn’t receive my sayings, has one who judges him. The word that I spoke will judge him in the last day. <sup class=\"v\">49<\/sup> For I spoke not from myself, but the Father who sent me, he gave me a commandment, what I should say, and what I should speak. <sup class=\"v\">50<\/sup> I know that his commandment is eternal life. The things therefore which I speak, even as the Father has said to me, so I speak.”"},{"type":"q","id":"12.6","field":"q83","text":"<b>Heart:<\/b> Many leaders believed but would not say so, “for they loved men’s praise more than God’s praise” (v. 43). Where are you tempted to seek people’s approval more than God’s?"},{"type":"q","id":"12.7","field":"q84","text":"<b>Heart:<\/b> Which image in this chapter stays with you? Why?"}],"prayer":"Father in heaven, your Son came “as a light into the world” (12:46). Give me wisdom as I read, and help me follow him and serve him (12:26)."},{"num":13,"hero":{"src":"img/john13-hero.jpg","w":1100,"h":729,"alt":"Bare feet in clear water"},"blocks":[{"type":"h2","text":"Jesus Washes the Disciples’ Feet"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now before the feast of the Passover, Jesus, knowing that his time had come that he would depart from this world to the Father, having loved his own who were in the world, he loved them to the end. <sup class=\"v\">2<\/sup> During supper, the devil having already put into the heart of Judas Iscariot, Simon’s son, to betray him, <sup class=\"v\">3<\/sup> Jesus, knowing that the Father had given all things into his hands, and that he came from God, and was going to God, <sup class=\"v\">4<\/sup> arose from supper, and laid aside his outer garments. He took a towel and wrapped a towel around his waist. <sup class=\"v\">5<\/sup> Then he poured water into the basin, and began to wash the disciples’ feet and to wipe them with the towel that was wrapped around him. <sup class=\"v\">6<\/sup> Then he came to Simon Peter. He said to him, “Lord, do you wash my feet?”"},{"type":"p","html":"<sup class=\"v\">7<\/sup> Jesus answered him, “You don’t know what I am doing now, but you will understand later.”"},{"type":"img","src":"img/john13-v08.jpg","w":1100,"h":733,"alt":"A pitcher and basin with a towel"},{"type":"p","html":"<sup class=\"v\">8<\/sup> Peter said to him, “You will never wash my feet!”"},{"type":"p","html":"Jesus answered him, “If I don’t wash you, you have no part with me.”"},{"type":"p","html":"<sup class=\"v\">9<\/sup> Simon Peter said to him, “Lord, not my feet only, but also my hands and my head!”"},{"type":"p","html":"<sup class=\"v\">10<\/sup> Jesus said to him, “Someone who has bathed only needs to have his feet washed, but is completely clean. You are clean, but not all of you.” <sup class=\"v\">11<\/sup> For he knew him who would betray him, therefore he said, “You are not all clean.” <sup class=\"v\">12<\/sup> So when he had washed their feet, put his outer garment back on, and sat down again, he said to them, “Do you know what I have done to you? <sup class=\"v\">13<\/sup> You call me, ‘Teacher’ and ‘Lord.’ You say so correctly, for so I am. <sup class=\"v\">14<\/sup> If I then, the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet. <sup class=\"v\">15<\/sup> For I have given you an example, that you should also do as I have done to you. <sup class=\"v\">16<\/sup> Most certainly I tell you, a servant is not greater than his lord, neither is one who is sent greater than he who sent him. <sup class=\"v\">17<\/sup> If you know these things, blessed are you if you do them. <sup class=\"v\">18<\/sup> I don’t speak concerning all of you. I know whom I have chosen. But that the Scripture may be fulfilled, ‘He who eats bread with me has lifted up his heel against me.’ <sup class=\"v\">19<\/sup> From now on, I tell you before it happens, that when it happens, you may believe that I am he. <sup class=\"v\">20<\/sup> Most certainly I tell you, he who receives whomever I send, receives me; and he who receives me, receives him who sent me.”"},{"type":"q","id":"13.1","field":"q85","text":"<b>Head:<\/b> Look at the image that opens this chapter. Jesus “began to wash the disciples’ feet” (v. 5). Why would the Lord of all do the work of a servant?"},{"type":"q","id":"13.2","field":"q86","text":"<b>Heart:<\/b> Consider the image of the towel. Peter said, “You will never wash my feet!” (v. 8). Why is it sometimes hard to let others serve us?"},{"type":"q","id":"13.3","field":"q87","text":"<b>Action:<\/b> Jesus said, “I have given you an example, that you should also do as I have done to you” (v. 15). Whose feet will you “wash” this week?"},{"type":"h2","text":"Jesus Predicts His Betrayal"},{"type":"p","html":"<sup class=\"v\">21<\/sup> When Jesus had said this, he was troubled in spirit, and testified, “Most certainly I tell you that one of you will betray me.”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> The disciples looked at one another, perplexed about whom he spoke. <sup class=\"v\">23<\/sup> One of his disciples, whom Jesus loved, was at the table, leaning against Jesus’ breast. <sup class=\"v\">24<\/sup> Simon Peter therefore beckoned to him, and said to him, “Tell us who it is of whom he speaks.”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> He, leaning back, as he was, on Jesus’ breast, asked him, “Lord, who is it?”"},{"type":"img","src":"img/john13-v26.jpg","w":1100,"h":733,"alt":"Hands holding a round loaf of bread"},{"type":"p","html":"<sup class=\"v\">26<\/sup> Jesus therefore answered, “It is he to whom I will give this piece of bread when I have dipped it.” So when he had dipped the piece of bread, he gave it to Judas, the son of Simon Iscariot. <sup class=\"v\">27<\/sup> After the piece of bread, then Satan entered into him."},{"type":"p","html":"Then Jesus said to him, “What you do, do quickly.”"},{"type":"p","html":"<sup class=\"v\">28<\/sup> Now nobody at the table knew why he said this to him. <sup class=\"v\">29<\/sup> For some thought, because Judas had the money box, that Jesus said to him, “Buy what things we need for the feast,” or that he should give something to the poor. <sup class=\"v\">30<\/sup> Therefore having received that morsel, he went out immediately. It was night."},{"type":"q","id":"13.4","field":"q88","text":"<b>Head:<\/b> Look at the image of the bread. After Jesus gave him the piece of bread, Judas “went out immediately. It was night” (v. 30). What does “night” say about Judas’ choice?"},{"type":"h2","text":"A New Commandment"},{"type":"p","html":"<sup class=\"v\">31<\/sup> When he had gone out, Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him. <sup class=\"v\">32<\/sup> If God has been glorified in him, God will also glorify him in himself, and he will glorify him immediately. <sup class=\"v\">33<\/sup> Little children, I will be with you a little while longer. You will seek me, and as I said to the Jews, ‘Where I am going, you can’t come,’ so now I tell you. <sup class=\"v\">34<\/sup> A new commandment I give to you, that you love one another. Just as I have loved you, you also love one another. <sup class=\"v\">35<\/sup> By this everyone will know that you are my disciples, if you have love for one another.”"},{"type":"q","id":"13.5","field":"q89","text":"<b>Head:<\/b> Jesus said, “A new commandment I give to you, that you love one another” (v. 34). What makes this commandment new?"},{"type":"q","id":"13.6","field":"q90","text":"<b>Action:<\/b> “By this everyone will know that you are my disciples, if you have love for one another” (v. 35). How will you show Jesus’ love to another believer this week?"},{"type":"img","src":"img/john13-v36.jpg","w":1100,"h":733,"alt":"A rooster close up"},{"type":"p","html":"<sup class=\"v\">36<\/sup> Simon Peter said to him, “Lord, where are you going?”"},{"type":"p","html":"Jesus answered, “Where I am going, you can’t follow now, but you will follow afterwards.”"},{"type":"p","html":"<sup class=\"v\">37<\/sup> Peter said to him, “Lord, why can’t I follow you now? I will lay down my life for you.”"},{"type":"p","html":"<sup class=\"v\">38<\/sup> Jesus answered him, “Will you lay down your life for me? Most certainly I tell you, the rooster won’t crow until you have denied me three times."},{"type":"q","id":"13.7","field":"q91","text":"<b>Heart:<\/b> Consider the image of the rooster. Peter promised, “I will lay down my life for you” (v. 37). Jesus knew Peter would fail, yet he still loved him. How does this encourage you?"}],"prayer":"God, your Son loved his own “to the end” (13:1) and washed his disciples’ feet. Give me wisdom as I read, and help me love others as he has loved me (13:34)."},{"num":14,"hero":{"src":"img/john14-hero.jpg","w":1100,"h":732,"alt":"A red house with yellow doors"},"blocks":[{"type":"h2","text":"The Way to the Father"},{"type":"p","html":"<sup class=\"v\">1<\/sup> “Don’t let your heart be troubled. Believe in God. Believe also in me. <sup class=\"v\">2<\/sup> In my Father’s house are many homes. If it weren’t so, I would have told you. I am going to prepare a place for you. <sup class=\"v\">3<\/sup> If I go and prepare a place for you, I will come again, and will receive you to myself; that where I am, you may be there also. <sup class=\"v\">4<\/sup> You know where I go, and you know the way.”"},{"type":"q","id":"14.1","field":"q92","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Jesus said, “Don’t let your heart be troubled” (v. 1) and “In my Father’s house are many homes” (v. 2). What troubles your heart today?"},{"type":"p","html":"<sup class=\"v\">5<\/sup> Thomas said to him, “Lord, we don’t know where you are going. How can we know the way?”"},{"type":"img","src":"img/john14-v06.jpg","w":1100,"h":733,"alt":"A forest path leading toward the light"},{"type":"p","html":"<sup class=\"v\">6<\/sup> Jesus said to him, “I am the way, the truth, and the life. No one comes to the Father, except through me. <sup class=\"v\">7<\/sup> If you had known me, you would have known my Father also. From now on, you know him, and have seen him.”"},{"type":"q","id":"14.2","field":"q93","text":"<b>Head:<\/b> Consider the image of the path. Jesus said, “I am the way, the truth, and the life. No one comes to the Father, except through me” (v. 6). What does it mean that Jesus is the way?"},{"type":"p","html":"<sup class=\"v\">8<\/sup> Philip said to him, “Lord, show us the Father, and that will be enough for us.”"},{"type":"p","html":"<sup class=\"v\">9<\/sup> Jesus said to him, “Have I been with you such a long time, and do you not know me, Philip? He who has seen me has seen the Father. How do you say, ‘Show us the Father?’ <sup class=\"v\">10<\/sup> Don’t you believe that I am in the Father, and the Father in me? The words that I tell you, I speak not from myself; but the Father who lives in me does his works. <sup class=\"v\">11<\/sup> Believe me that I am in the Father, and the Father in me; or else believe me for the very works’ sake. <sup class=\"v\">12<\/sup> Most certainly I tell you, he who believes in me, the works that I do, he will do also; and he will do greater works than these, because I am going to my Father. <sup class=\"v\">13<\/sup> Whatever you will ask in my name, I will do it, that the Father may be glorified in the Son. <sup class=\"v\">14<\/sup> If you will ask anything in my name, I will do it."},{"type":"q","id":"14.3","field":"q94","text":"<b>Head:<\/b> Philip said, “Lord, show us the Father” (v. 8). Jesus answered, “He who has seen me has seen the Father” (v. 9). How does Jesus show us what God is like?"},{"type":"h2","text":"The Promise of the Holy Spirit"},{"type":"img","src":"img/john14-v15.jpg","w":1100,"h":734,"alt":"Two friends walking hand in hand"},{"type":"p","html":"<sup class=\"v\">15<\/sup> If you love me, keep my commandments. <sup class=\"v\">16<\/sup> I will pray to the Father, and he will give you another Counselor, that he may be with you forever: <sup class=\"v\">17<\/sup> the Spirit of truth, whom the world can’t receive; for it doesn’t see him and doesn’t know him. You know him, for he lives with you, and will be in you. <sup class=\"v\">18<\/sup> I will not leave you orphans. I will come to you. <sup class=\"v\">19<\/sup> Yet a little while, and the world will see me no more; but you will see me. Because I live, you will live also. <sup class=\"v\">20<\/sup> In that day you will know that I am in my Father, and you in me, and I in you. <sup class=\"v\">21<\/sup> One who has my commandments and keeps them, that person is one who loves me. One who loves me will be loved by my Father, and I will love him, and will reveal myself to him.”"},{"type":"q","id":"14.4","field":"q95","text":"<b>Heart:<\/b> Look at the image of the friends. Jesus promised “another Counselor, that he may be with you forever” (v. 16). How has the Holy Spirit helped you?"},{"type":"q","id":"14.5","field":"q96","text":"<b>Action:<\/b> “I will not leave you orphans” (v. 18). When have you felt alone? Whom will you reach out to this week who may feel alone?"},{"type":"p","html":"<sup class=\"v\">22<\/sup> Judas (not Iscariot) said to him, “Lord, what has happened that you are about to reveal yourself to us, and not to the world?”"},{"type":"p","html":"<sup class=\"v\">23<\/sup> Jesus answered him, “If a man loves me, he will keep my word. My Father will love him, and we will come to him, and make our home with him. <sup class=\"v\">24<\/sup> He who doesn’t love me doesn’t keep my words. The word which you hear isn’t mine, but the Father’s who sent me."},{"type":"h2","text":"Peace I Leave with You"},{"type":"img","src":"img/john14-v25.jpg","w":1100,"h":619,"alt":"A calm lake in morning mist"},{"type":"p","html":"<sup class=\"v\">25<\/sup> I have said these things to you while still living with you. <sup class=\"v\">26<\/sup> But the Counselor, the Holy Spirit, whom the Father will send in my name, will teach you all things, and will remind you of all that I said to you. <sup class=\"v\">27<\/sup> Peace I leave with you. My peace I give to you; not as the world gives, I give to you. Don’t let your heart be troubled, neither let it be fearful. <sup class=\"v\">28<\/sup> You heard how I told you, ‘I go away, and I come to you.’ If you loved me, you would have rejoiced, because I said ‘I am going to my Father;’ for the Father is greater than I. <sup class=\"v\">29<\/sup> Now I have told you before it happens so that when it happens, you may believe. <sup class=\"v\">30<\/sup> I will no more speak much with you, for the prince of the world comes, and he has nothing in me. <sup class=\"v\">31<\/sup> But that the world may know that I love the Father, and as the Father commanded me, even so I do. Arise, let’s go from here."},{"type":"q","id":"14.6","field":"q97","text":"<b>Action:<\/b> Consider the image of the calm water. Jesus said, “Peace I leave with you. My peace I give to you; not as the world gives, I give to you” (v. 27). How is Jesus’ peace different from the world’s peace? Where will you seek his peace this week?"},{"type":"q","id":"14.7","field":"q98","text":"<b>Heart:<\/b> Which image in this chapter gives you the most hope? Why?"}],"prayer":"Father in heaven, your Son is “the way, the truth, and the life” (14:6), and he gives a peace the world cannot give (14:27). Give me wisdom as I read, and calm my troubled heart."},{"num":15,"hero":{"src":"img/john15-hero.jpg","w":1100,"h":733,"alt":"Green grapes hanging on the vine"},"blocks":[{"type":"h2","text":"The Vine and the Branches"},{"type":"p","html":"<sup class=\"v\">1<\/sup> “I am the true vine, and my Father is the farmer. <sup class=\"v\">2<\/sup> Every branch in me that doesn’t bear fruit, he takes away. Every branch that bears fruit, he prunes, that it may bear more fruit. <sup class=\"v\">3<\/sup> You are already pruned clean because of the word which I have spoken to you. <sup class=\"v\">4<\/sup> Remain in me, and I in you. As the branch can’t bear fruit by itself unless it remains in the vine, so neither can you, unless you remain in me. <sup class=\"v\">5<\/sup> I am the vine. You are the branches. He who remains in me and I in him bears much fruit, for apart from me you can do nothing. <sup class=\"v\">6<\/sup> If a man doesn’t remain in me, he is thrown out as a branch and is withered; and they gather them, throw them into the fire, and they are burned. <sup class=\"v\">7<\/sup> If you remain in me, and my words remain in you, you will ask whatever you desire, and it will be done for you."},{"type":"q","id":"15.1","field":"q99","text":"<b>Action:<\/b> Look at the image that opens this chapter. Jesus said, “I am the vine. You are the branches. He who remains in me and I in him bears much fruit, for apart from me you can do nothing” (v. 5). What will it look like for you to remain in Jesus each day this week?"},{"type":"img","src":"img/john15-v08.jpg","w":1100,"h":730,"alt":"Pruning shears on a stump among cut branches"},{"type":"p","html":"<sup class=\"v\">8<\/sup> “In this my Father is glorified, that you bear much fruit; and so you will be my disciples."},{"type":"q","id":"15.2","field":"q100","text":"<b>Heart:<\/b> Consider the image of the pruning. “Every branch that bears fruit, he prunes, that it may bear more fruit” (v. 2). When has God “pruned” something in your life? What grew afterward?"},{"type":"h2","text":"Remain in My Love"},{"type":"p","html":"<sup class=\"v\">9<\/sup> Even as the Father has loved me, I also have loved you. Remain in my love. <sup class=\"v\">10<\/sup> If you keep my commandments, you will remain in my love; even as I have kept my Father’s commandments, and remain in his love. <sup class=\"v\">11<\/sup> I have spoken these things to you, that my joy may remain in you, and that your joy may be made full."},{"type":"q","id":"15.3","field":"q101","text":"<b>Action:<\/b> “Remain in my love” (v. 9). What will help you stay close to Jesus’ love this week?"},{"type":"img","src":"img/john15-v12.jpg","w":1100,"h":731,"alt":"Two boys laughing with their arms around each other"},{"type":"p","html":"<sup class=\"v\">12<\/sup> “This is my commandment, that you love one another, even as I have loved you. <sup class=\"v\">13<\/sup> Greater love has no one than this, that someone lay down his life for his friends. <sup class=\"v\">14<\/sup> You are my friends, if you do whatever I command you. <sup class=\"v\">15<\/sup> No longer do I call you servants, for the servant doesn’t know what his lord does. But I have called you friends, for everything that I heard from my Father, I have made known to you. <sup class=\"v\">16<\/sup> You didn’t choose me, but I chose you and appointed you, that you should go and bear fruit, and that your fruit should remain; that whatever you will ask of the Father in my name, he may give it to you."},{"type":"q","id":"15.4","field":"q102","text":"<b>Heart:<\/b> “Greater love has no one than this, that someone lay down his life for his friends” (v. 13). Who has shown you this kind of love?"},{"type":"q","id":"15.5","field":"q103","text":"<b>Heart:<\/b> Look at the image of the friends. Jesus said, “I have called you friends” (v. 15). What does friendship with Jesus mean to you?"},{"type":"p","html":"<sup class=\"v\">17<\/sup> “I command these things to you, that you may love one another."},{"type":"h2","text":"When the World Hates You"},{"type":"img","src":"img/john15-v18.jpg","w":1100,"h":733,"alt":"A young woman standing alone in a crowd"},{"type":"p","html":"<sup class=\"v\">18<\/sup> If the world hates you, you know that it has hated me before it hated you. <sup class=\"v\">19<\/sup> If you were of the world, the world would love its own. But because you are not of the world, since I chose you out of the world, therefore the world hates you. <sup class=\"v\">20<\/sup> Remember the word that I said to you: ‘A servant is not greater than his lord.’ If they persecuted me, they will also persecute you. If they kept my word, they will also keep yours. <sup class=\"v\">21<\/sup> But they will do all these things to you for my name’s sake, because they don’t know him who sent me. <sup class=\"v\">22<\/sup> If I had not come and spoken to them, they would not have had sin; but now they have no excuse for their sin. <sup class=\"v\">23<\/sup> He who hates me, hates my Father also. <sup class=\"v\">24<\/sup> If I hadn’t done among them the works which no one else did, they wouldn’t have had sin. But now they have seen and also hated both me and my Father. <sup class=\"v\">25<\/sup> But this happened so that the word may be fulfilled which was written in their law, ‘They hated me without a cause.’"},{"type":"p","html":"<sup class=\"v\">26<\/sup> “When the Counselor has come, whom I will send to you from the Father, the Spirit of truth, who proceeds from the Father, he will testify about me. <sup class=\"v\">27<\/sup> You will also testify, because you have been with me from the beginning."},{"type":"q","id":"15.6","field":"q104","text":"<b>Head:<\/b> Consider the image for this section. Jesus said, “If the world hates you, you know that it has hated me before it hated you” (v. 18). Why might following Jesus bring opposition? How should we respond?"},{"type":"q","id":"15.7","field":"q105","text":"<b>Head:<\/b> Choose one image from this chapter. If an image is worth a thousand words, what words from this chapter would you put with it?"}],"prayer":"God, your Son is the true vine, and he calls us his friends (15:1, 15). Give me wisdom as I read, and help me remain in him and bear much fruit (15:5)."},{"num":16,"hero":{"src":"img/john16-hero.jpg","w":1100,"h":703,"alt":"A hand holding a compass by a mountain lake"},"blocks":[{"type":"h2","text":"The Work of the Spirit"},{"type":"p","html":"<sup class=\"v\">1<\/sup> “I have said these things to you so that you wouldn’t be caused to stumble. <sup class=\"v\">2<\/sup> They will put you out of the synagogues. Yes, the time comes that whoever kills you will think that he offers service to God. <sup class=\"v\">3<\/sup> They will do these things because they have not known the Father, nor me. <sup class=\"v\">4<\/sup> But I have told you these things, so that when the time comes, you may remember that I told you about them. I didn’t tell you these things from the beginning, because I was with you. <sup class=\"v\">5<\/sup> But now I am going to him who sent me, and none of you asks me, ‘Where are you going?’ <sup class=\"v\">6<\/sup> But because I have told you these things, sorrow has filled your heart. <sup class=\"v\">7<\/sup> Nevertheless I tell you the truth: It is to your advantage that I go away, for if I don’t go away, the Counselor won’t come to you. But if I go, I will send him to you. <sup class=\"v\">8<\/sup> When he has come, he will convict the world about sin, about righteousness, and about judgment; <sup class=\"v\">9<\/sup> about sin, because they don’t believe in me; <sup class=\"v\">10<\/sup> about righteousness, because I am going to my Father, and you won’t see me any more; <sup class=\"v\">11<\/sup> about judgment, because the prince of this world has been judged."},{"type":"q","id":"16.1","field":"q106","text":"<b>Head:<\/b> Jesus said, “It is to your advantage that I go away, for if I don’t go away, the Counselor won’t come to you” (v. 7). Why would it be better for the disciples to have the Spirit?"},{"type":"p","html":"<sup class=\"v\">12<\/sup> “I still have many things to tell you, but you can’t bear them now. <sup class=\"v\">13<\/sup> However when he, the Spirit of truth, has come, he will guide you into all truth, for he will not speak from himself; but whatever he hears, he will speak. He will declare to you things that are coming. <sup class=\"v\">14<\/sup> He will glorify me, for he will take from what is mine, and will declare it to you. <sup class=\"v\">15<\/sup> All things that the Father has are mine; therefore I said that he takes of mine and will declare it to you."},{"type":"q","id":"16.2","field":"q107","text":"<b>Heart:<\/b> Look at the image that opens this chapter. “When he, the Spirit of truth, has come, he will guide you into all truth” (v. 13). Where do you need the Spirit’s guidance right now?"},{"type":"h2","text":"Sorrow Will Turn to Joy"},{"type":"p","html":"<sup class=\"v\">16<\/sup> A little while, and you will not see me. Again a little while, and you will see me.”"},{"type":"p","html":"<sup class=\"v\">17<\/sup> Some of his disciples therefore said to one another, “What is this that he says to us, ‘A little while, and you won’t see me, and again a little while, and you will see me;’ and, ‘Because I go to the Father’?” <sup class=\"v\">18<\/sup> They said therefore, “What is this that he says, ‘A little while’? We don’t know what he is saying.”"},{"type":"img","src":"img/john16-v19.jpg","w":1100,"h":733,"alt":"A mother holding her sleeping baby"},{"type":"p","html":"<sup class=\"v\">19<\/sup> Therefore Jesus perceived that they wanted to ask him, and he said to them, “Do you inquire among yourselves concerning this, that I said, ‘A little while, and you won’t see me, and again a little while, and you will see me?’ <sup class=\"v\">20<\/sup> Most certainly I tell you that you will weep and lament, but the world will rejoice. You will be sorrowful, but your sorrow will be turned into joy. <sup class=\"v\">21<\/sup> A woman, when she gives birth, has sorrow because her time has come. But when she has delivered the child, she doesn’t remember the anguish any more, for the joy that a human being is born into the world. <sup class=\"v\">22<\/sup> Therefore you now have sorrow, but I will see you again, and your heart will rejoice, and no one will take your joy away from you."},{"type":"q","id":"16.3","field":"q108","text":"<b>Heart:<\/b> Consider the image of the mother and child. Jesus said, “your sorrow will be turned into joy” (v. 20). When has God turned your sorrow into joy?"},{"type":"img","src":"img/john16-v23.jpg","w":1100,"h":732,"alt":"Two open hands"},{"type":"p","html":"<sup class=\"v\">23<\/sup> “In that day you will ask me no questions. Most certainly I tell you, whatever you may ask of the Father in my name, he will give it to you. <sup class=\"v\">24<\/sup> Until now, you have asked nothing in my name. Ask, and you will receive, that your joy may be made full."},{"type":"q","id":"16.4","field":"q109","text":"<b>Action:<\/b> Look at the image of the open hands. Jesus said, “Ask, and you will receive, that your joy may be made full” (v. 24). What are you asking God for? Bring it to him each day this week."},{"type":"h2","text":"I Have Overcome the World"},{"type":"p","html":"<sup class=\"v\">25<\/sup> I have spoken these things to you in figures of speech. But the time is coming when I will no more speak to you in figures of speech, but will tell you plainly about the Father. <sup class=\"v\">26<\/sup> In that day you will ask in my name; and I don’t say to you that I will pray to the Father for you, <sup class=\"v\">27<\/sup> for the Father himself loves you, because you have loved me, and have believed that I came fro
