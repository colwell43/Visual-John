<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual John</title>
<meta name="description" content="John (World English Bible) with photographs and reflection questions.">
<meta name="theme-color" content="#F7F8F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111517" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="John">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: a book you read online. One reading column (~66ch) beside a sticky chapter guide; photos run the full column; reflection panels sit in the flow where the book put them. */
  --paper: #F7F8F6;
  --surface: #FFFFFF;
  --ink: #15191C;
  --muted: #5A646A;
  --line: #D9DFDD;
  --teal: #0F6B70;
  --teal-soft: #E3EFEE;
  --panel: #EDF1EF;
  --mark: #FBE38E;
  --mark-ink: #15191C;
  --hl-green: #D4F3C8;
  --hl-blue: #CDE5FA;
  --band: rgba(9, 15, 17, 0.58);
  --display: "Libre Franklin", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --step--1: 0.875rem;
  --step-0: 1rem;
  --step-1: 1.1875rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --step-4: clamp(2.5rem, 6vw, 3.75rem);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111517;
    --surface: #171C1E;
    --ink: #E5E9E7;
    --muted: #9CA7AB;
    --line: #2B3336;
    --teal: #63BFC2;
    --teal-soft: #17292B;
    --panel: #1A2123;
    --mark: #6B5A1F;
    --mark-ink: #FFF6D6;
    --hl-green: rgba(118, 196, 104, 0.34);
    --hl-blue: rgba(104, 160, 232, 0.38);
    --band: rgba(5, 8, 9, 0.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111517;
  --surface: #171C1E;
  --ink: #E5E9E7;
  --muted: #9CA7AB;
  --line: #2B3336;
  --teal: #63BFC2;
  --teal-soft: #17292B;
  --panel: #1A2123;
  --mark: #6B5A1F;
  --mark-ink: #FFF6D6;
  --hl-green: rgba(118, 196, 104, 0.34);
  --hl-blue: rgba(104, 160, 232, 0.38);
  --band: rgba(5, 8, 9, 0.62);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: var(--step-1);
  line-height: 1.65;
}
img { max-width: 100%; height: auto; display: block; }
a { color: var(--teal); text-underline-offset: 0.18em; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; border-radius: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; line-height: 1.2; margin: 0; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  font-family: var(--display);
}
.topbar-inner {
  max-width: 1180px; margin: 0 auto; padding: 10px 20px;
  display: flex; align-items: center; gap: 14px;
}
.brand {
  font-weight: 700; font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink); text-decoration: none; white-space: nowrap; margin-right: auto;
}
.brand span { color: var(--teal); }
.navbtn {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 1px solid transparent; border-radius: 6px;
  padding: 6px 10px; font-size: var(--step--1); font-weight: 500; color: var(--ink);
  text-decoration: none; cursor: pointer; white-space: nowrap;
}
.navbtn:hover { background: var(--teal-soft); }
.navbtn[aria-current="page"] { border-color: var(--line); background: var(--surface); }
.count {
  font-variant-numeric: tabular-nums; font-size: 0.75rem; font-weight: 600;
  background: var(--teal); color: var(--paper); border-radius: 999px; padding: 1px 7px; min-width: 1.6em; text-align: center;
}
.chapmenu { position: relative; }
.chapmenu > summary { list-style: none; }
.chapmenu > summary::-webkit-details-marker { display: none; }
.chapmenu-panel {
  position: absolute; right: 0; top: calc(100% + 8px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.14);
  padding: 14px; width: 300px;
}
.chapmenu-panel p { margin: 0 0 8px; font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.chapgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.chapgrid a {
  display: grid; place-items: center; aspect-ratio: 1; border-radius: 6px;
  text-decoration: none; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums;
  border: 1px solid var(--line); font-size: 0.95rem;
}
.chapgrid a:hover { border-color: var(--teal); color: var(--teal); }
.chapgrid a.done { background: var(--teal-soft); }
.chapgrid a[aria-current="page"] { background: var(--teal); color: var(--paper); border-color: var(--teal); }

.searchbar { border-top: 1px solid var(--line); }
.searchbar[hidden] { display: none; }
.searchbar-inner { max-width: 1180px; margin: 0 auto; padding: 12px 20px 16px; }
.searchbar input {
  width: 100%; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); font-family: var(--display); font-size: 1rem;
}
.results { list-style: none; margin: 10px 0 0; padding: 0; max-height: 55vh; overflow-y: auto; }
.results li + li { border-top: 1px solid var(--line); }
.results button {
  display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 4px; cursor: pointer;
  font-family: var(--body); font-size: 1rem; line-height: 1.45;
}
.results button:hover { background: var(--teal-soft); }
.results .ref { font-family: var(--display); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); display: block; }
.results b { background: var(--mark); color: var(--mark-ink); font-weight: inherit; }
.results-note { font-family: var(--display); font-size: var(--step--1); color: var(--muted); margin: 10px 0 0; }

/* ---------- shared layout ---------- */
main { min-height: 70vh; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
.eyebrow { font-family: var(--display); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--teal); margin: 0 0 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--display); font-weight: 600; font-size: 0.95rem;
  padding: 11px 18px; border-radius: 6px; text-decoration: none; cursor: pointer;
  border: 1px solid var(--teal); background: var(--teal); color: var(--paper);
}
.btn.ghost { background: transparent; color: var(--teal); }
.btn:hover { filter: brightness(1.08); }

/* ---------- home ---------- */
.cover {
  display: grid; grid-template-columns: minmax(200px, 330px) 1fr; gap: clamp(28px, 5vw, 64px);
  align-items: center; padding: clamp(32px, 6vw, 72px) 0 clamp(32px, 5vw, 56px);
}
.cover-img { border-radius: 4px; box-shadow: 0 18px 40px rgba(0,0,0,0.18); }
.cover h1 { font-size: var(--step-4); letter-spacing: -0.02em; font-weight: 700; }
.cover .lede { font-size: var(--step-1); color: var(--muted); max-width: 34em; margin: 14px 0 22px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0 0 26px; padding: 0; list-style: none; font-family: var(--display); font-size: var(--step--1); color: var(--muted); }
.stats strong { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 1.05rem; margin-right: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.progress-line { font-family: var(--display); font-size: var(--step--1); color: var(--muted); margin: 16px 0 0; }

.welcome {
  display: grid; grid-template-columns: 1fr minmax(240px, 380px); gap: clamp(28px, 5vw, 64px);
  padding: clamp(32px, 5vw, 56px) 0; border-top: 1px solid var(--line);
}
.welcome h2 { font-size: var(--step-3); margin-bottom: 14px; }
.welcome p { margin: 0 0 1em; max-width: 36em; }
.strips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-self: start; }
.strips img { width: 100%; aspect-ratio: 143 / 374; object-fit: cover; border-radius: 3px; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.section-head h2 { font-size: var(--step-3); }
.section-head p { margin: 0; font-family: var(--display); font-size: var(--step--1); color: var(--muted); }
.chapters { padding: clamp(32px, 5vw, 56px) 0; border-top: 1px solid var(--line); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.card {
  display: flex; flex-direction: column; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--teal); transform: translateY(-2px); }
.card-img { position: relative; aspect-ratio: 16 / 10; background: #222; overflow: hidden; }
.card-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card-num {
  position: absolute; left: 0; bottom: 0; padding: 6px 12px 4px; background: var(--band); color: #fff;
  font-family: var(--display); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.3em;
  display: flex; align-items: baseline; gap: 8px;
}
.card-num b { font-family: var(--body); font-weight: 400; font-size: 1.9rem; letter-spacing: 0; line-height: 1; }
.card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-body ul { list-style: none; margin: 0; padding: 0; font-family: var(--display); font-size: 0.85rem; line-height: 1.4; color: var(--muted); }
.card-body li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-body li:first-child { color: var(--ink); font-weight: 600; white-space: normal; }
.card-meta { margin-top: auto; display: flex; gap: 8px; align-items: center; font-family: var(--display); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { border-radius: 999px; padding: 2px 8px; border: 1px solid var(--line); }
.pill.on { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }

.feature { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 0 0 clamp(32px, 5vw, 56px); }
.feature a.tile {
  display: block; padding: 22px 24px; border-radius: 8px; text-decoration: none; color: var(--ink);
  border: 1px solid var(--line); background: var(--panel);
}
.feature a.tile:hover { border-color: var(--teal); }
.feature h3 { font-size: var(--step-2); margin-bottom: 6px; }
.feature p { margin: 0; color: var(--muted); font-size: 1rem; }

.about { padding: clamp(32px, 5vw, 56px) 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr minmax(220px, 300px); gap: clamp(28px, 5vw, 64px); }
.about h2 { font-size: var(--step-2); margin-bottom: 4px; }
.about h3 { font-size: 1rem; font-weight: 600; color: var(--muted); margin-bottom: 16px; }
.about p { margin: 0 0 0.8em; font-size: 1.05rem; max-width: 40em; }
.about-imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-self: start; }
.about-imgs img { width: 100%; aspect-ratio: 143 / 486; object-fit: cover; border-radius: 3px; }

/* ---------- chapter ---------- */
.hero { position: relative; margin: 24px 0 0; border-radius: 6px; overflow: hidden; background: #1d2326; }
.hero img { width: 100%; max-height: min(64vh, 600px); object-fit: cover; }
.band {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--band); color: #fff;
  padding: 14px clamp(18px, 3vw, 32px) 12px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 18px;
}
.band-title { display: flex; flex-direction: column; }
.band .lk { font-family: var(--display); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.42em; }
.band .num { font-family: var(--body); font-size: clamp(4rem, 11vw, 7rem); line-height: 0.82; font-weight: 400; }
.band .meta { font-family: var(--display); font-size: 0.8rem; text-align: right; opacity: 0.92; line-height: 1.5; }

.chapter-grid {
  display: grid; grid-template-columns: 230px minmax(0, 700px); gap: clamp(28px, 5vw, 72px);
  justify-content: center; padding: 36px 0 24px;
}
.guide { position: sticky; top: 76px; align-self: start; font-family: var(--display); font-size: 0.9rem; max-height: calc(100vh - 96px); overflow-y: auto; }
.guide h2 { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.guide ol { list-style: none; margin: 0 0 22px; padding: 0; border-left: 2px solid var(--line); }
.guide li button {
  display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
  padding: 5px 0 5px 12px; margin-left: -2px; border-left: 2px solid transparent; line-height: 1.35; color: var(--muted);
}
.guide li button:hover { color: var(--ink); }
.guide li button.active { color: var(--ink); border-left-color: var(--teal); font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 0 0 12px; color: var(--ink); }
.toggle input { width: 18px; height: 18px; accent-color: var(--teal); }
.guide .tally { color: var(--muted); font-variant-numeric: tabular-nums; margin: 0 0 12px; }
.guide-mobile { display: none; }

.reader h2 {
  font-size: 1.3rem; font-weight: 700; margin: 2.2em 0 0.7em; scroll-margin-top: 90px;
}
.reader > :first-child { margin-top: 0; }
.reader p { margin: 0 0 1em; max-width: 66ch; }
.reader p, .reader .poem { scroll-margin-top: 90px; }
sup.v {
  font-family: var(--display); font-weight: 700; font-size: 0.6em; color: var(--teal);
  line-height: 0; vertical-align: 0.6em; margin-right: 0.12em; font-variant-numeric: tabular-nums;
}
.poem { margin: 0 0 1.1em; padding-left: 1.6em; border-left: 2px solid var(--teal-soft); }
.poem .l { display: block; padding-left: 1.2em; text-indent: -1.2em; }
.photo { margin: 1.6em 0; }
.photo img { width: 100%; border-radius: 4px; }
.photo.portrait img { max-height: 760px; width: auto; max-width: 100%; margin: 0 auto; }

.q {
  background: var(--panel); border-left: 3px solid var(--teal); border-radius: 0 6px 6px 0;
  padding: 18px 20px 16px; margin: 1.4em 0; font-family: var(--display); scroll-margin-top: 90px;
}
.q + .q { margin-top: -0.6em; }
.q-num { font-family: var(--display); font-size: 0.78rem; font-weight: 700; color: var(--teal); letter-spacing: 0.06em; margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.q-text { font-size: 1rem; line-height: 1.5; margin: 0 0 12px; }
.q-text b { color: var(--teal); font-family: var(--display); font-weight: 700; }
.q textarea {
  display: block; width: 100%; min-height: 96px; resize: vertical;
  padding: 12px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface);
  font-family: var(--body); font-size: 1.05rem; line-height: 1.55;
}
.q textarea:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px var(--teal-soft); }
.q-status { min-height: 1.2em; margin: 6px 0 0; font-size: 0.75rem; color: var(--muted); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 28px 0 56px; border-top: 1px solid var(--line); margin-top: 24px; }
.pager a {
  display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink);
  font-family: var(--display); background: var(--surface);
}
.pager a:hover { border-color: var(--teal); }
.pager small { display: block; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.pager strong { font-size: 1.05rem; }
.pager .next { text-align: right; grid-column: 2; }

/* ---------- responses / discussion pages ---------- */
.page { max-width: 820px; margin: 0 auto; padding: clamp(32px, 6vw, 64px) 20px 64px; }
.page h1 { font-size: var(--step-3); margin-bottom: 10px; }
.page .lede { color: var(--muted); margin: 0 0 24px; font-size: 1.05rem; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 28px; }
.toolbar .note { font-family: var(--display); font-size: var(--step--1); color: var(--muted); }
.group { margin: 0 0 34px; }
.group h2 { font-size: 1.15rem; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.group h2 a { font-size: 0.85rem; font-weight: 500; }
.answer { margin: 0 0 20px; }
.answer .q-num { margin-bottom: 2px; }
.answer .q-text { margin-bottom: 8px; color: var(--muted); font-family: var(--display); font-size: 0.95rem; }
.answer .text { white-space: pre-wrap; margin: 0; padding-left: 14px; border-left: 3px solid var(--teal); }
.answer button.link { background: none; border: 0; padding: 0; color: var(--teal); cursor: pointer; font-family: var(--display); font-size: 0.85rem; text-decoration: underline; text-underline-offset: 0.18em; margin-top: 6px; }
.empty { font-family: var(--display); color: var(--muted); padding: 22px; border: 1px dashed var(--line); border-radius: 8px; }
.copybox { margin: 0 0 24px; }
.copybox[hidden] { display: none; }
.copybox textarea { width: 100%; min-height: 220px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-family: var(--display); font-size: 0.9rem; }

.types { list-style: none; counter-reset: t; padding: 0; margin: 0; display: grid; gap: 16px; }
.types > li { counter-increment: t; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px 16px 64px; position: relative; }
.types > li::before {
  content: counter(t); position: absolute; left: 18px; top: 16px; width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; background: var(--teal); color: var(--paper);
  font-family: var(--display); font-weight: 700; font-size: 0.95rem;
}
.types h2 { font-size: 1.1rem; margin: 4px 0 8px; }
.types h2 span { font-weight: 400; color: var(--muted); font-size: 0.9rem; }
.types ol { margin: 0; padding-left: 1.3em; list-style: lower-alpha; font-size: 1.02rem; }
.types ol li { margin: 0 0 6px; }

/* ---------- opening prayer ---------- */
.prayer { margin: 0 0 2em; padding: 16px 22px 16px 20px; max-width: 66ch; background: rgba(200, 150, 62, 0.11);
  border-left: 4px solid #C8963E; border-radius: 0 8px 8px 0; }
.reader .prayer p { margin: 0; max-width: none; }
.reader .prayer .prayer-label { font-family: var(--display); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.2em;
  text-transform: uppercase; color: #9A6B1E; margin: 0 0 6px; }
.reader .prayer .prayer-text { font-style: italic; font-size: 1.06rem; line-height: 1.6; }
:root[data-theme="dark"] .reader .prayer .prayer-label { color: #E2B866; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .reader .prayer .prayer-label { color: #E2B866; } }
@media print { .prayer { background: none; } }

/* ---------- master questions and summary ---------- */
.mq-box { margin: 1.4em 0 1.6em; padding: 18px 20px 6px; border: 1px solid var(--line); border-top: 3px solid var(--teal); border-radius: 0 0 8px 8px; background: var(--panel); max-width: 40em; }
.mq-box h3 { font-family: var(--display); font-size: 1.05rem; margin: 0 0 8px; color: var(--teal); letter-spacing: 0.02em; }
.welcome .mq-box p, .mq-box p { margin: 0 0 12px; font-size: 0.97rem; font-family: var(--display); max-width: none; line-height: 1.5; }
.mq-list { margin: 0 0 12px; padding: 0; list-style: none; }
.mq-list li { margin: 0 0 10px; font-family: var(--display); font-size: 0.97rem; line-height: 1.5; }
.mq-list b, .mq-q .q-text b, .sm-q b { color: var(--teal); font-weight: 700; letter-spacing: 0.04em; }
.mq { margin: 2.4em 0 0.4em; padding-top: 1.2em; border-top: 2px solid var(--teal); }

<script type="application/json" id="book-data">{"cover":{"src":"img/cover.jpg","w":960,"h":1280,"alt":"Sunlight on the Sea of Galilee seen from a boat"},"coverAlt":"Sunlight on the Sea of Galilee seen from a boat","welcome":["John wrote his Gospel “that you may believe that Jesus is the Christ, the Son of God, and that believing you may have life in his name.” He begins before creation, with the Word who was with God and was God, and he tells of signs that reveal who Jesus is. In John we hear Jesus say “I am” again and again: the bread of life, the light of the world, the good shepherd, the resurrection and the life, the way, the truth and the life, and the true vine.","Visual John sets the full text of John, in the World English Bible, beside photographs and questions for reflection. The photographs are not pictures of Bible scenes. They are images from everyday life, chosen to help you connect your own story with the story of Jesus.","As you read, take time with each image. Notice what you see and what you feel. The questions are marked HEAD, HEART and ACTION. Head questions help you understand what the passage says. Heart questions invite you to notice your feelings and attitudes before God. Action questions ask what you will do in response. Use them on your own, with a friend or in a group. The goal is to link LIFE and SCRIPTURE through IMAGES.","You can write your responses right on the page, in the boxes beneath each question, and highlight words in the text that speak to you.","At the end of the book, after John 21, you will find two more sections. The Summary reviews the Master Questions for the whole Gospel of John, with boxes for your responses. Going Deeper is a short study guide with an overview of the author and the book, historical and cultural insights, a chart of the whole book, its major themes and emotions, and free online resources such as Blue Letter Bible, commentaries and maps."],"strips":[{"src":"img/welcome-1.jpg","w":851,"h":1280,"alt":"Reading glasses resting on an open book"},{"src":"img/welcome-2.jpg","w":825,"h":1280,"alt":"An old hurricane lantern glowing"},{"src":"img/welcome-3.jpg","w":1100,"h":1136,"alt":"A stream running over stones through a green forest"}],"chapters":[{"num":1,"hero":{"src":"img/john01-hero.jpg","w":1100,"h":619,"alt":"A glowing nebula among the stars"},"blocks":[{"type":"h2","text":"The Word Became Flesh"},{"type":"p","html":"<sup class=\"v\">1<\/sup> In the beginning was the Word, and the Word was with God, and the Word was God. <sup class=\"v\">2<\/sup> The same was in the beginning with God. <sup class=\"v\">3<\/sup> All things were made through him. Without him, nothing was made that has been made. <sup class=\"v\">4<\/sup> In him was life, and the life was the light of men. <sup class=\"v\">5<\/sup> The light shines in the darkness, and the darkness hasn’t overcome it. <sup class=\"v\">6<\/sup> There came a man, sent from God, whose name was John. <sup class=\"v\">7<\/sup> The same came as a witness, that he might testify about the light, that all might believe through him. <sup class=\"v\">8<\/sup> He was not the light, but was sent that he might testify about the light. <sup class=\"v\">9<\/sup> The true light that enlightens everyone was coming into the world."},{"type":"q","id":"1.1","field":"q1","text":"<b>Heart:<\/b> Look at the image that opens this chapter. “The light shines in the darkness, and the darkness hasn’t overcome it” (v. 5). Where have you seen light shine in a dark time?"},{"type":"img","src":"img/john01-v10.jpg","w":1100,"h":733,"alt":"A single candle shining in the darkness"},{"type":"p","html":"<sup class=\"v\">10<\/sup> He was in the world, and the world was made through him, and the world didn’t recognize him. <sup class=\"v\">11<\/sup> He came to his own, and those who were his own didn’t receive him. <sup class=\"v\">12<\/sup> But as many as received him, to them he gave the right to become God’s children, to those who believe in his name: <sup class=\"v\">13<\/sup> who were born not of blood, nor of the will of the flesh, nor of the will of man, but of God. <sup class=\"v\">14<\/sup> The Word became flesh, and lived among us. We saw his glory, such glory as of the one and only Son of the Father, full of grace and truth. <sup class=\"v\">15<\/sup> John testified about him. He cried out, saying, “This was he of whom I said, ‘He who comes after me has surpassed me, for he was before me.’ ” <sup class=\"v\">16<\/sup> From his fullness we all received grace upon grace. <sup class=\"v\">17<\/sup> For the law was given through Moses. Grace and truth were realized through Jesus Christ. <sup class=\"v\">18<\/sup> No one has seen God at any time. The one and only Son, who is in the bosom of the Father, has declared him."},{"type":"q","id":"1.2","field":"q2","text":"<b>Heart:<\/b> Consider the image of the candle. “But as many as received him, to them he gave the right to become God’s children” (v. 12). How does it feel to be called a child of God?"},{"type":"q","id":"1.3","field":"q3","text":"<b>Head:<\/b> “The Word became flesh, and lived among us” (v. 14). What does it mean that God came to live among us?"},{"type":"h2","text":"John the Baptist’s Testimony"},{"type":"p","html":"<sup class=\"v\">19<\/sup> This is John’s testimony, when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”"},{"type":"p","html":"<sup class=\"v\">20<\/sup> He declared, and didn’t deny, but he declared, “I am not the Christ.”"},{"type":"p","html":"<sup class=\"v\">21<\/sup> They asked him, “What then? Are you Elijah?”"},{"type":"p","html":"He said, “I am not.”"},{"type":"p","html":"“Are you the prophet?”"},{"type":"p","html":"He answered, “No.”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> They said therefore to him, “Who are you? Give us an answer to take back to those who sent us. What do you say about yourself?”"},{"type":"p","html":"<sup class=\"v\">23<\/sup> He said, “I am the voice of one crying in the wilderness, ‘Make straight the way of the Lord,’ as Isaiah the prophet said.”"},{"type":"p","html":"<sup class=\"v\">24<\/sup> The ones who had been sent were from the Pharisees. <sup class=\"v\">25<\/sup> They asked him, “Why then do you baptize, if you are not the Christ, nor Elijah, nor the prophet?”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> John answered them, “I baptize in water, but among you stands one whom you don’t know. <sup class=\"v\">27<\/sup> He is the one who comes after me, who is preferred before me, whose sandal strap I’m not worthy to loosen.” <sup class=\"v\">28<\/sup> These things were done in Bethany beyond the Jordan, where John was baptizing."},{"type":"h2","text":"The Lamb of God"},{"type":"img","src":"img/john01-v29.jpg","w":1100,"h":733,"alt":"A young lamb looking toward the camera"},{"type":"p","html":"<sup class=\"v\">29<\/sup> The next day, he saw Jesus coming to him, and said, “Behold, the Lamb of God, who takes away the sin of the world! <sup class=\"v\">30<\/sup> This is he of whom I said, ‘After me comes a man who is preferred before me, for he was before me.’ <sup class=\"v\">31<\/sup> I didn’t know him, but for this reason I came baptizing in water: that he would be revealed to Israel.” <sup class=\"v\">32<\/sup> John testified, saying, “I have seen the Spirit descending like a dove out of heaven, and it remained on him. <sup class=\"v\">33<\/sup> I didn’t recognize him, but he who sent me to baptize in water said to me, ‘On whomever you will see the Spirit descending and remaining on him is he who baptizes in the Holy Spirit.’ <sup class=\"v\">34<\/sup> I have seen, and have testified that this is the Son of God.”"},{"type":"q","id":"1.4","field":"q4","text":"<b>Head:<\/b> Look at the image of the lamb. John said, “Behold, the Lamb of God, who takes away the sin of the world!” (v. 29). What does this title tell you about Jesus?"},{"type":"h2","text":"The First Disciples"},{"type":"p","html":"<sup class=\"v\">35<\/sup> Again, the next day, John was standing with two of his disciples, <sup class=\"v\">36<\/sup> and he looked at Jesus as he walked, and said, “Behold, the Lamb of God!” <sup class=\"v\">37<\/sup> The two disciples heard him speak, and they followed Jesus. <sup class=\"v\">38<\/sup> Jesus turned and saw them following, and said to them, “What are you looking for?”"},{"type":"p","html":"They said to him, “Rabbi” (which is to say, being interpreted, Teacher), “where are you staying?”"},{"type":"p","html":"<sup class=\"v\">39<\/sup> He said to them, “Come, and see.”"},{"type":"q","id":"1.5","field":"q5","text":"<b>Action:<\/b> Jesus asked, “What are you looking for?” (v. 38). How would you answer him today? What step will you take this week to seek him?"},{"type":"p","html":"They came and saw where he was staying, and they stayed with him that day. It was about the tenth hour. <sup class=\"v\">40<\/sup> One of the two who heard John and followed him was Andrew, Simon Peter’s brother. <sup class=\"v\">41<\/sup> He first found his own brother, Simon, and said to him, “We have found the Messiah!” (which is, being interpreted, Christ). <sup class=\"v\">42<\/sup> He brought him to Jesus. Jesus looked at him, and said, “You are Simon the son of Jonah. You shall be called Cephas” (which is by interpretation, Peter)."},{"type":"h2","text":"Philip and Nathanael"},{"type":"p","html":"<sup class=\"v\">43<\/sup> On the next day, he was determined to go out into Galilee, and he found Philip. Jesus said to him, “Follow me.” <sup class=\"v\">44<\/sup> Now Philip was from Bethsaida, of the city of Andrew and Peter. <sup class=\"v\">45<\/sup> Philip found Nathanael, and said to him, “We have found him, of whom Moses in the law, and the prophets, wrote: Jesus of Nazareth, the son of Joseph.”"},{"type":"p","html":"<sup class=\"v\">46<\/sup> Nathanael said to him, “Can any good thing come out of Nazareth?”"},{"type":"p","html":"Philip said to him, “Come and see.”"},{"type":"img","src":"img/john01-v47.jpg","w":1100,"h":786,"alt":"Leaves and green figs on a fig tree"},{"type":"p","html":"<sup class=\"v\">47<\/sup> Jesus saw Nathanael coming to him, and said about him, “Behold, an Israelite indeed, in whom is no deceit!”"},{"type":"p","html":"<sup class=\"v\">48<\/sup> Nathanael said to him, “How do you know me?”"},{"type":"p","html":"Jesus answered him, “Before Philip called you, when you were under the fig tree, I saw you.”"},{"type":"p","html":"<sup class=\"v\">49<\/sup> Nathanael answered him, “Rabbi, you are the Son of God! You are King of Israel!”"},{"type":"p","html":"<sup class=\"v\">50<\/sup> Jesus answered him, “Because I told you, ‘I saw you underneath the fig tree,’ do you believe? You will see greater things than these!” <sup class=\"v\">51<\/sup> He said to him, “Most certainly, I tell you all, hereafter you will see heaven opened, and the angels of God ascending and descending on the Son of Man.”"},{"type":"q","id":"1.6","field":"q6","text":"<b>Action:<\/b> Philip said, “Come and see” (v. 46). Whom will you invite this week to “come and see” Jesus?"},{"type":"q","id":"1.7","field":"q7","text":"<b>Heart:<\/b> Consider the image of the fig tree. Jesus told Nathanael, “When you were under the fig tree, I saw you” (v. 48). How does it feel to be fully known by Jesus?"}],"prayer":"God, your Word “became flesh, and lived among us,” full of grace and truth (1:14). Give me wisdom as I read, and help me receive him and live as your child (1:12)."},{"num":2,"hero":{"src":"img/john02-hero.jpg","w":1100,"h":729,"alt":"Old clay jars beside a stone wall"},"blocks":[{"type":"h2","text":"The Wedding at Cana"},{"type":"p","html":"<sup class=\"v\">1<\/sup> The third day, there was a wedding in Cana of Galilee. Jesus’ mother was there. <sup class=\"v\">2<\/sup> Jesus also was invited, with his disciples, to the wedding. <sup class=\"v\">3<\/sup> When the wine ran out, Jesus’ mother said to him, “They have no wine.”"},{"type":"p","html":"<sup class=\"v\">4<\/sup> Jesus said to her, “Woman, what does that have to do with you and me? My hour has not yet come.”"},{"type":"img","src":"img/john02-v05.jpg","w":1100,"h":734,"alt":"Red wine being poured into a glass"},{"type":"p","html":"<sup class=\"v\">5<\/sup> His mother said to the servants, “Whatever he says to you, do it.” <sup class=\"v\">6<\/sup> Now there were six water pots of stone set there after the Jews’ way of purifying, containing two or three metretes apiece. <sup class=\"v\">7<\/sup> Jesus said to them, “Fill the water pots with water.” So they filled them up to the brim. <sup class=\"v\">8<\/sup> He said to them, “Now draw some out, and take it to the ruler of the feast.” So they took it. <sup class=\"v\">9<\/sup> When the ruler of the feast tasted the water now become wine, and didn’t know where it came from (but the servants who had drawn the water knew), the ruler of the feast called the bridegroom <sup class=\"v\">10<\/sup> and said to him, “Everyone serves the good wine first, and when the guests have drunk freely, then that which is worse. You have kept the good wine until now!” <sup class=\"v\">11<\/sup> This beginning of his signs Jesus did in Cana of Galilee, and revealed his glory; and his disciples believed in him."},{"type":"q","id":"2.1","field":"q8","text":"<b>Action:<\/b> Look at the image that opens this chapter. Jesus said, “Fill the water pots with water” (v. 7), and the servants filled them to the brim. What ordinary things in your life might Jesus want to fill and transform? Bring one of them to him in prayer this week."},{"type":"q","id":"2.2","field":"q9","text":"<b>Action:<\/b> Mary told the servants, “Whatever he says to you, do it” (v. 5). What is Jesus saying to you right now? How will you do it this week?"},{"type":"q","id":"2.3","field":"q10","text":"<b>Heart:<\/b> Consider the image of the wine. The head servant said, “You have kept the good wine until now!” (v. 10). Where have you seen God save the best for later?"},{"type":"p","html":"<sup class=\"v\">12<\/sup> After this, he went down to Capernaum, he, and his mother, his brothers, and his disciples; and they stayed there a few days."},{"type":"h2","text":"Jesus Clears the Temple"},{"type":"p","html":"<sup class=\"v\">13<\/sup> The Passover of the Jews was at hand, and Jesus went up to Jerusalem. <sup class=\"v\">14<\/sup> He found in the temple those who sold oxen, sheep, and doves, and the changers of money sitting. <sup class=\"v\">15<\/sup> He made a whip of cords, and threw all out of the temple, both the sheep and the oxen; and he poured out the changers’ money and overthrew their tables. <sup class=\"v\">16<\/sup> To those who sold the doves, he said, “Take these things out of here! Don’t make my Father’s house a marketplace!” <sup class=\"v\">17<\/sup> His disciples remembered that it was written, “Zeal for your house will eat me up.”"},{"type":"q","id":"2.4","field":"q11","text":"<b>Head:<\/b> Jesus said, “Don’t make my Father’s house a marketplace!” (v. 16). What distracts people from worship today?"},{"type":"p","html":"<sup class=\"v\">18<\/sup> The Jews therefore answered him, “What sign do you show us, seeing that you do these things?”"},{"type":"img","src":"img/john02-v19.jpg","w":1100,"h":725,"alt":"Ruined stone columns of an ancient building"},{"type":"p","html":"<sup class=\"v\">19<\/sup> Jesus answered them, “Destroy this temple, and in three days I will raise it up.”"},{"type":"p","html":"<sup class=\"v\">20<\/sup> The Jews therefore said, “It took forty-six years to build this temple! Will you raise it up in three days?” <sup class=\"v\">21<\/sup> But he spoke of the temple of his body. <sup class=\"v\">22<\/sup> When therefore he was raised from the dead, his disciples remembered that he said this, and they believed the Scripture, and the word which Jesus had said."},{"type":"q","id":"2.5","field":"q12","text":"<b>Head:<\/b> Look at the image of the ruins. Jesus said, “Destroy this temple, and in three days I will raise it up” (v. 19). What did he mean? How does the resurrection give hope?"},{"type":"h2","text":"Jesus Knows All People"},{"type":"img","src":"img/john02-v23.jpg","w":1100,"h":825,"alt":"A crowd of people crossing a city street"},{"type":"p","html":"<sup class=\"v\">23<\/sup> Now when he was in Jerusalem at the Passover, during the feast, many believed in his name, observing his signs which he did. <sup class=\"v\">24<\/sup> But Jesus didn’t entrust himself to them, because he knew everyone, <sup class=\"v\">25<\/sup> and because he didn’t need for anyone to testify concerning man; for he himself knew what was in man."},{"type":"q","id":"2.6","field":"q13","text":"<b>Heart:<\/b> Consider the image of the crowd. Jesus “knew what was in man” (v. 25). How does it feel to know that Jesus knows your heart completely?"},{"type":"q","id":"2.7","field":"q14","text":"<b>Heart:<\/b> Which image in this chapter speaks to you most? Why?"}],"prayer":"Father in heaven, at a wedding in Cana your Son revealed his glory (2:11). Give me wisdom as I read, and help me do whatever he tells me (2:5)."},{"num":3,"hero":{"src":"img/john03-hero.jpg","w":1100,"h":733,"alt":"An old town street with lamps glowing at dusk"},"blocks":[{"type":"h2","text":"Jesus and Nicodemus"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now there was a man of the Pharisees named Nicodemus, a ruler of the Jews. <sup class=\"v\">2<\/sup> The same came to him by night, and said to him, “Rabbi, we know that you are a teacher come from God, for no one can do these signs that you do, unless God is with him.”"},{"type":"q","id":"3.1","field":"q15","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Nicodemus “came to him by night” (v. 2). Why do you think he came at night? When have you brought your questions to Jesus quietly?"},{"type":"p","html":"<sup class=\"v\">3<\/sup> Jesus answered him, “Most certainly, I tell you, unless one is born anew, he can’t see God’s Kingdom.”"},{"type":"p","html":"<sup class=\"v\">4<\/sup> Nicodemus said to him, “How can a man be born when he is old? Can he enter a second time into his mother’s womb, and be born?”"},{"type":"img","src":"img/john03-v05.jpg","w":1100,"h":733,"alt":"Tall grass bending in the wind"},{"type":"p","html":"<sup class=\"v\">5<\/sup> Jesus answered, “Most certainly I tell you, unless one is born of water and spirit, he can’t enter into God’s Kingdom. <sup class=\"v\">6<\/sup> That which is born of the flesh is flesh. That which is born of the Spirit is spirit. <sup class=\"v\">7<\/sup> Don’t marvel that I said to you, ‘You must be born anew.’ <sup class=\"v\">8<\/sup> The wind blows where it wants to, and you hear its sound, but don’t know where it comes from and where it is going. So is everyone who is born of the Spirit.”"},{"type":"q","id":"3.2","field":"q16","text":"<b>Head:<\/b> Jesus said, “unless one is born anew, he can’t see God’s Kingdom” (v. 3). What does it mean to be born anew?"},{"type":"q","id":"3.3","field":"q17","text":"<b>Heart:<\/b> Consider the image of the wind. Jesus said, “The wind blows where it wants to, and you hear its sound, but don’t know where it comes from and where it is going” (v. 8). How have you sensed the Spirit at work, even when you could not see him?"},{"type":"p","html":"<sup class=\"v\">9<\/sup> Nicodemus answered him, “How can these things be?”"},{"type":"p","html":"<sup class=\"v\">10<\/sup> Jesus answered him, “Are you the teacher of Israel, and don’t understand these things? <sup class=\"v\">11<\/sup> Most certainly I tell you, we speak that which we know, and testify of that which we have seen, and you don’t receive our witness. <sup class=\"v\">12<\/sup> If I told you earthly things and you don’t believe, how will you believe if I tell you heavenly things? <sup class=\"v\">13<\/sup> No one has ascended into heaven but he who descended out of heaven, the Son of Man, who is in heaven. <sup class=\"v\">14<\/sup> As Moses lifted up the serpent in the wilderness, even so must the Son of Man be lifted up, <sup class=\"v\">15<\/sup> that whoever believes in him should not perish, but have eternal life."},{"type":"h2","text":"God So Loved the World"},{"type":"img","src":"img/john03-v16.jpg","w":1100,"h":624,"alt":"The earth seen from space"},{"type":"p","html":"<sup class=\"v\">16<\/sup> For God so loved the world, that he gave his one and only Son, that whoever believes in him should not perish, but have eternal life. <sup class=\"v\">17<\/sup> For God didn’t send his Son into the world to judge the world, but that the world should be saved through him. <sup class=\"v\">18<\/sup> He who believes in him is not judged. He who doesn’t believe has been judged already, because he has not believed in the name of the one and only Son of God. <sup class=\"v\">19<\/sup> This is the judgment, that the light has come into the world, and men loved the darkness rather than the light; for their works were evil. <sup class=\"v\">20<\/sup> For everyone who does evil hates the light, and doesn’t come to the light, lest his works would be exposed. <sup class=\"v\">21<\/sup> But he who does the truth comes to the light, that his works may be revealed, that they have been done in God.”"},{"type":"q","id":"3.4","field":"q18","text":"<b>Action:<\/b> Look at the image of the earth. “For God so loved the world, that he gave his one and only Son, that whoever believes in him should not perish, but have eternal life” (v. 16). Read this verse with your own name in place of “the world.” Pray it back to God each day this week."},{"type":"q","id":"3.5","field":"q19","text":"<b>Head:<\/b> “For God didn’t send his Son into the world to judge the world, but that the world should be saved through him” (v. 17). How does this change the way we think about God?"},{"type":"q","id":"3.6","field":"q20","text":"<b>Heart:<\/b> Jesus said that people “loved the darkness rather than the light” (v. 19). Where are you tempted to hide from the light?"},{"type":"h2","text":"John the Baptist Points to Jesus"},{"type":"img","src":"img/john03-v22.jpg","w":1100,"h":733,"alt":"A river rushing through a forest"},{"type":"p","html":"<sup class=\"v\">22<\/sup> After these things, Jesus came with his disciples into the land of Judea. He stayed there with them and baptized. <sup class=\"v\">23<\/sup> John also was baptizing in Enon near Salim, because there was much water there. They came, and were baptized; <sup class=\"v\">24<\/sup> for John was not yet thrown into prison. <sup class=\"v\">25<\/sup> Therefore a dispute arose on the part of John’s disciples with some Jews about purification. <sup class=\"v\">26<\/sup> They came to John and said to him, “Rabbi, he who was with you beyond the Jordan, to whom you have testified, behold, he baptizes, and everyone is coming to him.”"},{"type":"p","html":"<sup class=\"v\">27<\/sup> John answered, “A man can receive nothing unless it has been given him from heaven. <sup class=\"v\">28<\/sup> You yourselves testify that I said, ‘I am not the Christ,’ but, ‘I have been sent before him.’ <sup class=\"v\">29<\/sup> He who has the bride is the bridegroom; but the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice. This, my joy, therefore is made full. <sup class=\"v\">30<\/sup> He must increase, but I must decrease."},{"type":"q","id":"3.7","field":"q21","text":"<b>Action:<\/b> Consider the image of the river. John said, “He must increase, but I must decrease” (v. 30). What will it look like for Jesus to increase in your life this week?"},{"type":"h2","text":"The One Who Comes from Above"},{"type":"p","html":"<sup class=\"v\">31<\/sup> He who comes from above is above all. He who is from the earth belongs to the earth and speaks of the earth. He who comes from heaven is above all. <sup class=\"v\">32<\/sup> What he has seen and heard, of that he testifies; and no one receives his witness. <sup class=\"v\">33<\/sup> He who has received his witness has set his seal to this, that God is true. <sup class=\"v\">34<\/sup> For he whom God has sent speaks the words of God; for God gives the Spirit without measure. <sup class=\"v\">35<\/sup> The Father loves the Son, and has given all things into his hand. <sup class=\"v\">36<\/sup> One who believes in the Son has eternal life, but one who disobeys the Son won’t see life, but the wrath of God remains on him.”"}],"prayer":"God, you “so loved the world, that he gave his one and only Son” (3:16). Give me wisdom as I read, and give me new life by your Spirit (3:3–8)."},{"num":4,"hero":{"src":"img/john04-hero.jpg","w":1100,"h":732,"alt":"An old stone well in a grassy field"},"blocks":[{"type":"h2","text":"Jesus and the Samaritan Woman"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Therefore when the Lord knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John <sup class=\"v\">2<\/sup> (although Jesus himself didn’t baptize, but his disciples), <sup class=\"v\">3<\/sup> he left Judea and departed into Galilee. <sup class=\"v\">4<\/sup> He needed to pass through Samaria. <sup class=\"v\">5<\/sup> So he came to a city of Samaria, called Sychar, near the parcel of ground that Jacob gave to his son, Joseph. <sup class=\"v\">6<\/sup> Jacob’s well was there. Jesus therefore, being tired from his journey, sat down by the well. It was about the sixth hour. <sup class=\"v\">7<\/sup> A woman of Samaria came to draw water. Jesus said to her, “Give me a drink.” <sup class=\"v\">8<\/sup> For his disciples had gone away into the city to buy food."},{"type":"p","html":"<sup class=\"v\">9<\/sup> The Samaritan woman therefore said to him, “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews have no dealings with Samaritans.)"},{"type":"q","id":"4.1","field":"q22","text":"<b>Head:<\/b> Look at the image that opens this chapter. Tired from his journey, Jesus sat by the well and said, “Give me a drink” (v. 7). Why do you think Jesus began with a simple request?"},{"type":"p","html":"<sup class=\"v\">10<\/sup> Jesus answered her, “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”"},{"type":"p","html":"<sup class=\"v\">11<\/sup> The woman said to him, “Sir, you have nothing to draw with, and the well is deep. So where do you get that living water? <sup class=\"v\">12<\/sup> Are you greater than our father, Jacob, who gave us the well and drank from it himself, as did his children and his livestock?”"},{"type":"img","src":"img/john04-v13.jpg","w":1100,"h":734,"alt":"Spring water cascading over mossy rocks"},{"type":"p","html":"<sup class=\"v\">13<\/sup> Jesus answered her, “Everyone who drinks of this water will thirst again, <sup class=\"v\">14<\/sup> but whoever drinks of the water that I will give him will never thirst again; but the water that I will give him will become in him a well of water springing up to eternal life.”"},{"type":"q","id":"4.2","field":"q23","text":"<b>Heart:<\/b> Consider the image of the water. Jesus said, “whoever drinks of the water that I will give him will never thirst again” (v. 14). What are you thirsty for?"},{"type":"p","html":"<sup class=\"v\">15<\/sup> The woman said to him, “Sir, give me this water, so that I don’t get thirsty, neither come all the way here to draw.”"},{"type":"p","html":"<sup class=\"v\">16<\/sup> Jesus said to her, “Go, call your husband, and come here.”"},{"type":"p","html":"<sup class=\"v\">17<\/sup> The woman answered, “I have no husband.”"},{"type":"p","html":"Jesus said to her, “You said well, ‘I have no husband,’ <sup class=\"v\">18<\/sup> for you have had five husbands; and he whom you now have is not your husband. This you have said truly.”"},{"type":"p","html":"<sup class=\"v\">19<\/sup> The woman said to him, “Sir, I perceive that you are a prophet. <sup class=\"v\">20<\/sup> Our fathers worshiped in this mountain, and you Jews say that in Jerusalem is the place where people ought to worship.”"},{"type":"p","html":"<sup class=\"v\">21<\/sup> Jesus said to her, “Woman, believe me, the hour comes, when neither in this mountain, nor in Jerusalem, will you worship the Father. <sup class=\"v\">22<\/sup> You worship that which you don’t know. We worship that which we know; for salvation is from the Jews. <sup class=\"v\">23<\/sup> But the hour comes, and now is, when the true worshipers will worship the Father in spirit and truth, for the Father seeks such to be his worshipers. <sup class=\"v\">24<\/sup> God is spirit, and those who worship him must worship in spirit and truth.”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> The woman said to him, “I know that Messiah comes, he who is called Christ. When he has come, he will declare to us all things.”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> Jesus said to her, “I am he, the one who speaks to you.”"},{"type":"q","id":"4.3","field":"q24","text":"<b>Head:<\/b> Jesus knew the woman’s whole story (v. 18), yet he spoke with her openly and kindly. How does Jesus treat people others avoid?"},{"type":"q","id":"4.4","field":"q25","text":"<b>Heart:<\/b> Jesus said, “God is spirit, and those who worship him must worship in spirit and truth” (v. 24). What does worship in spirit and truth look like for you?"},{"type":"h2","text":"The Fields Are Ready for Harvest"},{"type":"img","src":"img/john04-v27.jpg","w":1100,"h":733,"alt":"A field of ripe grain ready for harvest"},{"type":"p","html":"<sup class=\"v\">27<\/sup> At this, his disciples came. They marveled that he was speaking with a woman; yet no one said, “What are you looking for?” or, “Why do you speak with her?” <sup class=\"v\">28<\/sup> So the woman left her water pot, went away into the city, and said to the people, <sup class=\"v\">29<\/sup> “Come, see a man who told me everything that I did. Can this be the Christ?”"},{"type":"p","html":"<sup class=\"v\">30<\/sup> They went out of the city, and were coming to him. <sup class=\"v\">31<\/sup> In the meanwhile, the disciples urged him, saying, “Rabbi, eat.”"},{"type":"p","html":"<sup class=\"v\">32<\/sup> But he said to them, “I have food to eat that you don’t know about.”"},{"type":"p","html":"<sup class=\"v\">33<\/sup> The disciples therefore said to one another, “Has anyone brought him something to eat?”"},{"type":"p","html":"<sup class=\"v\">34<\/sup> Jesus said to them, “My food is to do the will of him who sent me and to accomplish his work. <sup class=\"v\">35<\/sup> Don’t you say, ‘There are yet four months until the harvest?’ Behold, I tell you, lift up your eyes and look at the fields, that they are white for harvest already. <sup class=\"v\">36<\/sup> He who reaps receives wages and gathers fruit to eternal life; that both he who sows and he who reaps may rejoice together. <sup class=\"v\">37<\/sup> For in this the saying is true, ‘One sows, and another reaps.’ <sup class=\"v\">38<\/sup> I sent you to reap that for which you haven’t labored. Others have labored, and you have entered into their labor.”"},{"type":"p","html":"<sup class=\"v\">39<\/sup> From that city many of the Samaritans believed in him because of the word of the woman, who testified, “He told me everything that I did.” <sup class=\"v\">40<\/sup> So when the Samaritans came to him, they begged him to stay with them. He stayed there two days. <sup class=\"v\">41<\/sup> Many more believed because of his word. <sup class=\"v\">42<\/sup> They said to the woman, “Now we believe, not because of your speaking; for we have heard for ourselves, and know that this is indeed the Christ, the Savior of the world.”"},{"type":"q","id":"4.5","field":"q26","text":"<b>Action:<\/b> The woman left her water pot and told the town, “Come, see a man who told me everything that I did” (v. 29). Whom will you tell about Jesus this week?"},{"type":"q","id":"4.6","field":"q27","text":"<b>Action:<\/b> Look at the image of the field. Jesus said, “lift up your eyes and look at the fields, that they are white for harvest already” (v. 35). Who around you is ready to hear about Jesus? Pray for them by name this week."},{"type":"h2","text":"Jesus Heals an Official’s Son"},{"type":"img","src":"img/john04-v43.jpg","w":1100,"h":734,"alt":"A father with his young sons by a pond"},{"type":"p","html":"<sup class=\"v\">43<\/sup> After the two days he went out from there and went into Galilee. <sup class=\"v\">44<\/sup> For Jesus himself testified that a prophet has no honor in his own country. <sup class=\"v\">45<\/sup> So when he came into Galilee, the Galileans received him, having seen all the things that he did in Jerusalem at the feast, for they also went to the feast. <sup class=\"v\">46<\/sup> Jesus came therefore again to Cana of Galilee, where he made the water into wine. There was a certain nobleman whose son was sick at Capernaum. <sup class=\"v\">47<\/sup> When he heard that Jesus had come out of Judea into Galilee, he went to him, and begged him that he would come down and heal his son, for he was at the point of death. <sup class=\"v\">48<\/sup> Jesus therefore said to him, “Unless you see signs and wonders, you will in no way believe.”"},{"type":"p","html":"<sup class=\"v\">49<\/sup> The nobleman said to him, “Sir, come down before my child dies.” <sup class=\"v\">50<\/sup> Jesus said to him, “Go your way. Your son lives.” The man believed the word that Jesus spoke to him, and he went his way. <sup class=\"v\">51<\/sup> As he was now going down, his servants met him and reported, saying “Your child lives!” <sup class=\"v\">52<\/sup> So he inquired of them the hour when he began to get better. They said therefore to him, “Yesterday at the seventh hour, the fever left him.” <sup class=\"v\">53<\/sup> So the father knew that it was at that hour in which Jesus said to him, “Your son lives.” He believed, as did his whole house. <sup class=\"v\">54<\/sup> This is again the second sign that Jesus did, having come out of Judea into Galilee."},{"type":"q","id":"4.7","field":"q28","text":"<b>Heart:<\/b> Consider the image of the father and son. The official “believed the word that Jesus spoke to him, and he went his way” (v. 50). When have you had to trust Jesus’ word before you saw the result?"}],"prayer":"Father in heaven, your Son offered living water to a thirsty woman (4:10, 14), and you seek people who will worship you “in spirit and truth” (4:23). Give me wisdom as I read, and help me worship you that way."},{"num":5,"hero":{"src":"img/john05-hero.jpg","w":1100,"h":825,"alt":"An ancient pool surrounded by stone columns"},"blocks":[{"type":"h2","text":"Healing at the Pool"},{"type":"p","html":"<sup class=\"v\">1<\/sup> After these things, there was a feast of the Jews, and Jesus went up to Jerusalem. <sup class=\"v\">2<\/sup> Now in Jerusalem by the sheep gate, there is a pool, which is called in Hebrew, “Bethesda”, having five porches. <sup class=\"v\">3<\/sup> In these lay a great multitude of those who were sick, blind, lame, or paralyzed, waiting for the moving of the water; <sup class=\"v\">4<\/sup> for an angel went down at certain times into the pool and stirred up the water. Whoever stepped in first after the stirring of the water was healed of whatever disease he had. <sup class=\"v\">5<\/sup> A certain man was there who had been sick for thirty-eight years. <sup class=\"v\">6<\/sup> When Jesus saw him lying there, and knew that he had been sick for a long time, he asked him, “Do you want to be made well?”"},{"type":"q","id":"5.1","field":"q29","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Jesus asked the man who had been sick for thirty-eight years, “Do you want to be made well?” (v. 6). Why would Jesus ask such a question? How would you answer?"},{"type":"p","html":"<sup class=\"v\">7<\/sup> The sick man answered him, “Sir, I have no one to put me into the pool when the water is stirred up, but while I’m coming, another steps down before me.”"},{"type":"img","src":"img/john05-v08.jpg","w":1100,"h":733,"alt":"Bare feet walking on a wooden boardwalk"},{"type":"p","html":"<sup class=\"v\">8<\/sup> Jesus said to him, “Arise, take up your mat, and walk.”"},{"type":"p","html":"<sup class=\"v\">9<\/sup> Immediately, the man was made well, and took up his mat and walked."},{"type":"p","html":"Now it was the Sabbath on that day. <sup class=\"v\">10<\/sup> So the Jews said to him who was cured, “It is the Sabbath. It is not lawful for you to carry the mat.”"},{"type":"p","html":"<sup class=\"v\">11<\/sup> He answered them, “He who made me well said to me, ‘Take up your mat and walk.’”"},{"type":"p","html":"<sup class=\"v\">12<\/sup> Then they asked him, “Who is the man who said to you, ‘Take up your mat and walk’?”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> But he who was healed didn’t know who it was, for Jesus had withdrawn, a crowd being in the place."},{"type":"q","id":"5.2","field":"q30","text":"<b>Action:<\/b> Consider the image of the walking feet. Jesus said, “Arise, take up your mat, and walk” (v. 8). What would it mean for you to get up and walk in a new way? What first step will you take this week?"},{"type":"p","html":"<sup class=\"v\">14<\/sup> Afterward Jesus found him in the temple, and said to him, “Behold, you are made well. Sin no more, so that nothing worse happens to you.”"},{"type":"p","html":"<sup class=\"v\">15<\/sup> The man went away, and told the Jews that it was Jesus who had made him well."},{"type":"q","id":"5.3","field":"q31","text":"<b>Head:<\/b> Some leaders cared more about Sabbath rules than about the man who had been healed (v. 10). When do rules get in the way of seeing what God is doing?"},{"type":"h2","text":"Life Through the Son"},{"type":"p","html":"<sup class=\"v\">16<\/sup> For this cause the Jews persecuted Jesus, and sought to kill him, because he did these things on the Sabbath. <sup class=\"v\">17<\/sup> But Jesus answered them, “My Father is still working, so I am working, too.” <sup class=\"v\">18<\/sup> For this cause therefore the Jews sought all the more to kill him, because he not only broke the Sabbath, but also called God his own Father, making himself equal with God. <sup class=\"v\">19<\/sup> Jesus therefore answered them, “Most certainly, I tell you, the Son can do nothing of himself, but what he sees the Father doing. For whatever things he does, these the Son also does likewise. <sup class=\"v\">20<\/sup> For the Father has affection for the Son, and shows him all things that he himself does. He will show him greater works than these, that you may marvel. <sup class=\"v\">21<\/sup> For as the Father raises the dead and gives them life, even so the Son also gives life to whom he desires. <sup class=\"v\">22<\/sup> For the Father judges no one, but he has given all judgment to the Son, <sup class=\"v\">23<\/sup> that all may honor the Son, even as they honor the Father. He who doesn’t honor the Son doesn’t honor the Father who sent him."},{"type":"img","src":"img/john05-v24.jpg","w":1100,"h":825,"alt":"A butterfly resting on purple flowers"},{"type":"p","html":"<sup class=\"v\">24<\/sup> “Most certainly I tell you, he who hears my word and believes him who sent me has eternal life, and doesn’t come into judgment, but has passed out of death into life. <sup class=\"v\">25<\/sup> Most certainly I tell you, the hour comes, and now is, when the dead will hear the Son of God’s voice; and those who hear will live. <sup class=\"v\">26<\/sup> For as the Father has life in himself, even so he gave to the Son also to have life in himself. <sup class=\"v\">27<\/sup> He also gave him authority to execute judgment, because he is a son of man. <sup class=\"v\">28<\/sup> Don’t marvel at this, for the hour comes in which all who are in the tombs will hear his voice, <sup class=\"v\">29<\/sup> and will come out; those who have done good, to the resurrection of life; and those who have done evil, to the resurrection of judgment. <sup class=\"v\">30<\/sup> I can of myself do nothing. As I hear, I judge, and my judgment is righteous; because I don’t seek my own will, but the will of my Father who sent me."},{"type":"q","id":"5.4","field":"q32","text":"<b>Head:<\/b> “The Son can do nothing of himself, but what he sees the Father doing” (v. 19). What does this teach you about Jesus and the Father?"},{"type":"q","id":"5.5","field":"q33","text":"<b>Heart:<\/b> Look at the image of the butterfly. Jesus said that whoever hears his word and believes “has passed out of death into life” (v. 24). What does new life in Jesus mean to you?"},{"type":"h2","text":"Witnesses to Jesus"},{"type":"p","html":"<sup class=\"v\">31<\/sup> “If I testify about myself, my witness is not valid. <sup class=\"v\">32<\/sup> It is another who testifies about me. I know that the testimony which he testifies about me is true. <sup class=\"v\">33<\/sup> You have sent to John, and he has testified to the truth. <sup class=\"v\">34<\/sup> But the testimony which I receive is not from man. However, I say these things that you may be saved. <sup class=\"v\">35<\/sup> He was the burning and shining lamp, and you were willing to rejoice for a while in his light. <sup class=\"v\">36<\/sup> But the testimony which I have is greater than that of John, for the works which the Father gave me to accomplish, the very works that I do, testify about me, that the Father has sent me. <sup class=\"v\">37<\/sup> The Father himself, who sent me, has testified about me. You have neither heard his voice at any time, nor seen his form. <sup class=\"v\">38<\/sup> You don’t have his word living in you, because you don’t believe him whom he sent."},{"type":"img","src":"img/john05-v39.jpg","w":1100,"h":787,"alt":"An old rolled scroll"},{"type":"p","html":"<sup class=\"v\">39<\/sup> “You search the Scriptures, because you think that in them you have eternal life; and these are they which testify about me. <sup class=\"v\">40<\/sup> Yet you will not come to me, that you may have life. <sup class=\"v\">41<\/sup> I don’t receive glory from men. <sup class=\"v\">42<\/sup> But I know you, that you don’t have God’s love in yourselves. <sup class=\"v\">43<\/sup> I have come in my Father’s name, and you don’t receive me. If another comes in his own name, you will receive him. <sup class=\"v\">44<\/sup> How can you believe, who receive glory from one another, and you don’t seek the glory that comes from the only God?"},{"type":"p","html":"<sup class=\"v\">45<\/sup> “Don’t think that I will accuse you to the Father. There is one who accuses you, even Moses, on whom you have set your hope. <sup class=\"v\">46<\/sup> For if you believed Moses, you would believe me; for he wrote about me. <sup class=\"v\">47<\/sup> But if you don’t believe his writings, how will you believe my words?”"},{"type":"q","id":"5.6","field":"q34","text":"<b>Action:<\/b> Consider the image of the scroll. Jesus said, “You search the Scriptures… these are they which testify about me” (v. 39). How will you read Scripture this week so that it leads you closer to Jesus?"},{"type":"q","id":"5.7","field":"q35","text":"<b>Heart:<\/b> Choose one image from this chapter. What story do you see in it?"}],"prayer":"God, you are always at work, as Jesus said: “My Father is still working, so I am working, too” (5:17). Give me wisdom as I read, and help me hear your word and believe (5:24)."},{"num":6,"hero":{"src":"img/john06-hero.jpg","w":1100,"h":733,"alt":"A large crowd gathered outdoors"},"blocks":[{"type":"h2","text":"Jesus Feeds Five Thousand"},{"type":"p","html":"<sup class=\"v\">1<\/sup> After these things, Jesus went away to the other side of the sea of Galilee, which is also called the Sea of Tiberias. <sup class=\"v\">2<\/sup> A great multitude followed him, because they saw his signs which he did on those who were sick. <sup class=\"v\">3<\/sup> Jesus went up into the mountain, and he sat there with his disciples. <sup class=\"v\">4<\/sup> Now the Passover, the feast of the Jews, was at hand. <sup class=\"v\">5<\/sup> Jesus therefore lifting up his eyes, and seeing that a great multitude was coming to him, said to Philip, “Where are we to buy bread, that these may eat?” <sup class=\"v\">6<\/sup> He said this to test him, for he himself knew what he would do."},{"type":"p","html":"<sup class=\"v\">7<\/sup> Philip answered him, “Two hundred denarii worth of bread is not sufficient for them, that every one of them may receive a little.”"},{"type":"img","src":"img/john06-v08.jpg","w":1100,"h":731,"alt":"A field of green barley"},{"type":"p","html":"<sup class=\"v\">8<\/sup> One of his disciples, Andrew, Simon Peter’s brother, said to him, <sup class=\"v\">9<\/sup> “There is a boy here who has five barley loaves and two fish, but what are these among so many?”"},{"type":"p","html":"<sup class=\"v\">10<\/sup> Jesus said, “Have the people sit down.” Now there was much grass in that place. So the men sat down, in number about five thousand. <sup class=\"v\">11<\/sup> Jesus took the loaves; and having given thanks, he distributed to the disciples, and the disciples to those who were sitting down; likewise also of the fish as much as they desired. <sup class=\"v\">12<\/sup> When they were filled, he said to his disciples, “Gather up the broken pieces which are left over, that nothing be lost.” <sup class=\"v\">13<\/sup> So they gathered them up, and filled twelve baskets with broken pieces from the five barley loaves, which were left over by those who had eaten. <sup class=\"v\">14<\/sup> When therefore the people saw the sign which Jesus did, they said, “This is truly the prophet who comes into the world.” <sup class=\"v\">15<\/sup> Jesus therefore, perceiving that they were about to come and take him by force to make him king, withdrew again to the mountain by himself."},{"type":"q","id":"6.1","field":"q36","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Jesus asked Philip, “Where are we to buy bread, that these may eat?” (v. 5). When have you faced a need much bigger than your resources?"},{"type":"q","id":"6.2","field":"q37","text":"<b>Action:<\/b> Consider the image of the barley. Andrew said, “There is a boy here who has five barley loaves and two fish, but what are these among so many?” (v. 9). What small gift will you offer Jesus this week?"},{"type":"h2","text":"Jesus Walks on the Water"},{"type":"img","src":"img/john06-v16.jpg","w":1100,"h":726,"alt":"A small boat on still water at dusk"},{"type":"p","html":"<sup class=\"v\">16<\/sup> When evening came, his disciples went down to the sea. <sup class=\"v\">17<\/sup> They entered into the boat, and were going over the sea to Capernaum. It was now dark, and Jesus had not come to them. <sup class=\"v\">18<\/sup> The sea was tossed by a great wind blowing. <sup class=\"v\">19<\/sup> When therefore they had rowed about twenty-five or thirty stadia, they saw Jesus walking on the sea, and drawing near to the boat; and they were afraid. <sup class=\"v\">20<\/sup> But he said to them, “It is I. Don’t be afraid.” <sup class=\"v\">21<\/sup> They were willing therefore to receive him into the boat. Immediately the boat was at the land where they were going."},{"type":"q","id":"6.3","field":"q38","text":"<b>Heart:<\/b> Look at the image of the boat at night. Jesus came to them on the water and said, “It is I. Don’t be afraid” (v. 20). Where do you need to hear these words?"},{"type":"h2","text":"The Bread of Life"},{"type":"p","html":"<sup class=\"v\">22<\/sup> On the next day, the multitude that stood on the other side of the sea saw that there was no other boat there, except the one in which his disciples had embarked, and that Jesus hadn’t entered with his disciples into the boat, but his disciples had gone away alone. <sup class=\"v\">23<\/sup> However boats from Tiberias came near to the place where they ate the bread after the Lord had given thanks. <sup class=\"v\">24<\/sup> When the multitude therefore saw that Jesus wasn’t there, nor his disciples, they themselves got into the boats, and came to Capernaum, seeking Jesus. <sup class=\"v\">25<\/sup> When they found him on the other side of the sea, they asked him, “Rabbi, when did you come here?”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> Jesus answered them, “Most certainly I tell you, you seek me, not because you saw signs, but because you ate of the loaves, and were filled. <sup class=\"v\">27<\/sup> Don’t work for the food which perishes, but for the food which remains to eternal life, which the Son of Man will give to you. For God the Father has sealed him.”"},{"type":"p","html":"<sup class=\"v\">28<\/sup> They said therefore to him, “What must we do, that we may work the works of God?”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> Jesus answered them, “This is the work of God, that you believe in him whom he has sent.”"},{"type":"p","html":"<sup class=\"v\">30<\/sup> They said therefore to him, “What then do you do for a sign, that we may see and believe you? What work do you do? <sup class=\"v\">31<\/sup> Our fathers ate the manna in the wilderness. As it is written, ‘He gave them bread out of heaven to eat.’ ”"},{"type":"p","html":"<sup class=\"v\">32<\/sup> Jesus therefore said to them, “Most certainly, I tell you, it wasn’t Moses who gave you the bread out of heaven, but my Father gives you the true bread out of heaven. <sup class=\"v\">33<\/sup> For the bread of God is that which comes down out of heaven, and gives life to the world.”"},{"type":"p","html":"<sup class=\"v\">34<\/sup> They said therefore to him, “Lord, always give us this bread.”"},{"type":"img","src":"img/john06-v35.jpg","w":1100,"h":716,"alt":"Hands breaking a loaf of bread"},{"type":"p","html":"<sup class=\"v\">35<\/sup> Jesus said to them, “I am the bread of life. Whoever comes to me will not be hungry, and whoever believes in me will never be thirsty. <sup class=\"v\">36<\/sup> But I told you that you have seen me, and yet you don’t believe. <sup class=\"v\">37<\/sup> All those whom the Father gives me will come to me. He who comes to me I will in no way throw out. <sup class=\"v\">38<\/sup> For I have come down from heaven, not to do my own will, but the will of him who sent me. <sup class=\"v\">39<\/sup> This is the will of my Father who sent me, that of all he has given to me I should lose nothing, but should raise him up at the last day. <sup class=\"v\">40<\/sup> This is the will of the one who sent me, that everyone who sees the Son, and believes in him, should have eternal life; and I will raise him up at the last day.”"},{"type":"q","id":"6.4","field":"q39","text":"<b>Head:<\/b> Consider the image of the bread. Jesus said, “I am the bread of life. Whoever comes to me will not be hungry, and whoever believes in me will never be thirsty” (v. 35). What did Jesus mean? What hunger can only he satisfy?"},{"type":"q","id":"6.5","field":"q40","text":"<b>Heart:<\/b> “He who comes to me I will in no way throw out” (v. 37). How does this promise encourage you?"},{"type":"p","html":"<sup class=\"v\">41<\/sup> The Jews therefore murmured concerning him, because he said, “I am the bread which came down out of heaven.” <sup class=\"v\">42<\/sup> They said, “Isn’t this Jesus, the son of Joseph, whose father and mother we know? How then does he say, ‘I have come down out of heaven?’ ”"},{"type":"p","html":"<sup class=\"v\">43<\/sup> Therefore Jesus answered them, “Don’t murmur among yourselves. <sup class=\"v\">44<\/sup> No one can come to me unless the Father who sent me draws him, and I will raise him up in the last day. <sup class=\"v\">45<\/sup> It is written in the prophets, ‘They will all be taught by God.’ Therefore everyone who hears from the Father and has learned, comes to me. <sup class=\"v\">46<\/sup> Not that anyone has seen the Father, except he who is from God. He has seen the Father. <sup class=\"v\">47<\/sup> Most certainly, I tell you, he who believes in me has eternal life. <sup class=\"v\">48<\/sup> I am the bread of life. <sup class=\"v\">49<\/sup> Your fathers ate the manna in the wilderness and they died. <sup class=\"v\">50<\/sup> This is the bread which comes down out of heaven, that anyone may eat of it and not die. <sup class=\"v\">51<\/sup> I am the living bread which came down out of heaven. If anyone eats of this bread, he will live forever. Yes, the bread which I will give for the life of the world is my flesh.”"},{"type":"p","html":"<sup class=\"v\">52<\/sup> The Jews therefore contended with one another, saying, “How can this man give us his flesh to eat?”"},{"type":"p","html":"<sup class=\"v\">53<\/sup> Jesus therefore said to them, “Most certainly I tell you, unless you eat the flesh of the Son of Man and drink his blood, you don’t have life in yourselves. <sup class=\"v\">54<\/sup> He who eats my flesh and drinks my blood has eternal life, and I will raise him up at the last day. <sup class=\"v\">55<\/sup> For my flesh is food indeed, and my blood is drink indeed. <sup class=\"v\">56<\/sup> He who eats my flesh and drinks my blood lives in me, and I in him. <sup class=\"v\">57<\/sup> As the living Father sent me, and I live because of the Father; so he who feeds on me, he will also live because of me. <sup class=\"v\">58<\/sup> This is the bread which came down out of heaven—not as our fathers ate the manna, and died. He who eats this bread will live forever.” <sup class=\"v\">59<\/sup> He said these things in the synagogue, as he taught in Capernaum."},{"type":"h2","text":"Words of Eternal Life"},{"type":"p","html":"<sup class=\"v\">60<\/sup> Therefore many of his disciples, when they heard this, said, “This is a hard saying! Who can listen to it?”"},{"type":"p","html":"<sup class=\"v\">61<\/sup> But Jesus knowing in himself that his disciples murmured at this, said to them, “Does this cause you to stumble? <sup class=\"v\">62<\/sup> Then what if you would see the Son of Man ascending to where he was before? <sup class=\"v\">63<\/sup> It is the spirit who gives life. The flesh profits nothing. The words that I speak to you are spirit, and are life. <sup class=\"v\">64<\/sup> But there are some of you who don’t believe.” For Jesus knew from the beginning who they were who didn’t believe, and who it was who would betray him. <sup class=\"v\">65<\/sup> He said, “For this cause I have said to you that no one can come to me, unless it is given to him by my Father.”"},{"type":"p","html":"<sup class=\"v\">66<\/sup> At this, many of his disciples went back, and walked no more with him. <sup class=\"v\">67<\/sup> Jesus said therefore to the twelve, “You don’t also want to go away, do you?”"},{"type":"p","html":"<sup class=\"v\">68<\/sup> Simon Peter answered him, “Lord, to whom would we go? You have the words of eternal life. <sup class=\"v\">69<\/sup> We have come to believe and know that you are the Christ, the Son of the living God.”"},{"type":"p","html":"<sup class=\"v\">70<\/sup> Jesus answered them, “Didn’t I choose you, the twelve, and one of you is a devil?” <sup class=\"v\">71<\/sup> Now he spoke of Judas, the son of Simon Iscariot, for it was he who would betray him, being one of the twelve."},{"type":"q","id":"6.6","field":"q41","text":"<b>Action:<\/b> When many turned away, Peter said, “Lord, to whom would we go? You have the words of eternal life” (v. 68). Why do you keep following Jesus when it is hard? What will help you keep following this week?"},{"type":"q","id":"6.7","field":"q42","text":"<b>Head:<\/b> Which image in this chapter helps you understand Jesus better? Explain."}],"prayer":"Father in heaven, you gave your Son as “the bread of life” (6:35). Give me wisdom as I read, and help me come to him, for he has “the words of eternal life” (6:68)."},{"num":7,"hero":{"src":"img/john07-hero.jpg","w":1100,"h":733,"alt":"A rustic shelter covered with branches"},"blocks":[{"type":"h2","text":"Jesus at the Festival of Booths"},{"type":"p","html":"<sup class=\"v\">1<\/sup> After these things, Jesus was walking in Galilee, for he wouldn’t walk in Judea, because the Jews sought to kill him. <sup class=\"v\">2<\/sup> Now the feast of the Jews, the Feast of Booths, was at hand. <sup class=\"v\">3<\/sup> His brothers therefore said to him, “Depart from here and go into Judea, that your disciples also may see your works which you do. <sup class=\"v\">4<\/sup> For no one does anything in secret while he seeks to be known openly. If you do these things, reveal yourself to the world.” <sup class=\"v\">5<\/sup> For even his brothers didn’t believe in him."},{"type":"q","id":"7.1","field":"q43","text":"<b>Heart:<\/b> Look at the image that opens this chapter. The Festival of Booths remembered how God cared for his people in the wilderness. Yet even Jesus’ brothers did not believe in him (v. 5). How do you handle it when people close to you don’t share your faith?"},{"type":"img","src":"img/john07-v06.jpg","w":1100,"h":733,"alt":"An old pocket watch half buried in sand"},{"type":"p","html":"<sup class=\"v\">6<\/sup> Jesus therefore said to them, “My time has not yet come, but your time is always ready. <sup class=\"v\">7<\/sup> The world can’t hate you, but it hates me, because I testify about it, that its works are evil. <sup class=\"v\">8<\/sup> You go up to the feast. I am not yet going up to this feast, because my time is not yet fulfilled.”"},{"type":"p","html":"<sup class=\"v\">9<\/sup> Having said these things to them, he stayed in Galilee. <sup class=\"v\">10<\/sup> But when his brothers had gone up to the feast, then he also went up, not publicly, but as it were in secret. <sup class=\"v\">11<\/sup> The Jews therefore sought him at the feast, and said, “Where is he?” <sup class=\"v\">12<\/sup> There was much murmuring among the multitudes concerning him. Some said, “He is a good man.” Others said, “Not so, but he leads the multitude astray.” <sup class=\"v\">13<\/sup> Yet no one spoke openly of him for fear of the Jews. <sup class=\"v\">14<\/sup> But when it
