m God. <sup class=\"v\">28<\/sup> I came from the Father, and have come into the world. Again, I leave the world, and go to the Father.”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> His disciples said to him, “Behold, now you are speaking plainly, and using no figures of speech. <sup class=\"v\">30<\/sup> Now we know that you know all things, and don’t need for anyone to question you. By this we believe that you came from God.”"},{"type":"q","id":"16.5","field":"q110","text":"<b>Head:<\/b> The disciples said, “Now we know that you know all things” (v. 30). What helps faith grow more certain?"},{"type":"img","src":"img/john16-v31.jpg","w":1100,"h":669,"alt":"A climber standing on a mountain summit"},{"type":"p","html":"<sup class=\"v\">31<\/sup> Jesus answered them, “Do you now believe? <sup class=\"v\">32<\/sup> Behold, the time is coming, yes, and has now come, that you will be scattered, everyone to his own place, and you will leave me alone. Yet I am not alone, because the Father is with me. <sup class=\"v\">33<\/sup> I have told you these things, that in me you may have peace. In the world you have trouble; but cheer up! I have overcome the world.”"},{"type":"q","id":"16.6","field":"q111","text":"<b>Heart:<\/b> Consider the image of the summit. Jesus said, “In the world you have trouble; but cheer up! I have overcome the world” (v. 33). What trouble are you facing? How does Jesus’ victory encourage you?"},{"type":"q","id":"16.7","field":"q112","text":"<b>Action:<\/b> Which image in this chapter speaks most to your life right now? What will you do in response?"}],"prayer":"Father in heaven, your Spirit guides us “into all truth” (16:13), and your Son has overcome the world (16:33). Give me wisdom as I read, and give me his peace when I face trouble."},{"num":17,"hero":{"src":"img/john17-hero.jpg","w":1100,"h":733,"alt":"Silhouette of a person praying at sunset"},"blocks":[{"type":"h2","text":"Jesus Prays for Himself"},{"type":"img","src":"img/john17-v01.jpg","w":1100,"h":736,"alt":"A man looking up toward the light"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Jesus said these things, then lifting up his eyes to heaven, he said, “Father, the time has come. Glorify your Son, that your Son may also glorify you; <sup class=\"v\">2<\/sup> even as you gave him authority over all flesh, so he will give eternal life to all whom you have given him. <sup class=\"v\">3<\/sup> This is eternal life, that they should know you, the only true God, and him whom you sent, Jesus Christ. <sup class=\"v\">4<\/sup> I glorified you on the earth. I have accomplished the work which you have given me to do. <sup class=\"v\">5<\/sup> Now, Father, glorify me with your own self with the glory which I had with you before the world existed."},{"type":"q","id":"17.1","field":"q113","text":"<b>Head:<\/b> Look at the image that opens this chapter. Jesus prayed, “lifting up his eyes to heaven” (v. 1). What do you learn from listening to Jesus pray?"},{"type":"q","id":"17.2","field":"q114","text":"<b>Head:<\/b> “This is eternal life, that they should know you, the only true God, and him whom you sent, Jesus Christ” (v. 3). How would you describe eternal life in your own words?"},{"type":"h2","text":"Jesus Prays for His Disciples"},{"type":"img","src":"img/john17-v06.jpg","w":1100,"h":731,"alt":"A person under an umbrella in the light rain"},{"type":"p","html":"<sup class=\"v\">6<\/sup> I revealed your name to the people whom you have given me out of the world. They were yours, and you have given them to me. They have kept your word. <sup class=\"v\">7<\/sup> Now they have known that all things whatever you have given me are from you, <sup class=\"v\">8<\/sup> for the words which you have given me I have given to them, and they received them, and knew for sure that I came from you. They have believed that you sent me. <sup class=\"v\">9<\/sup> I pray for them. I don’t pray for the world, but for those whom you have given me, for they are yours. <sup class=\"v\">10<\/sup> All things that are mine are yours, and yours are mine, and I am glorified in them. <sup class=\"v\">11<\/sup> I am no more in the world, but these are in the world, and I am coming to you. Holy Father, keep them through your name which you have given me, that they may be one, even as we are. <sup class=\"v\">12<\/sup> While I was with them in the world, I kept them in your name. I have kept those whom you have given me. None of them is lost except the son of destruction, that the Scripture might be fulfilled. <sup class=\"v\">13<\/sup> But now I come to you, and I say these things in the world, that they may have my joy made full in themselves. <sup class=\"v\">14<\/sup> I have given them your word. The world hated them, because they are not of the world, even as I am not of the world. <sup class=\"v\">15<\/sup> I pray not that you would take them from the world, but that you would keep them from the evil one. <sup class=\"v\">16<\/sup> They are not of the world even as I am not of the world. <sup class=\"v\">17<\/sup> Sanctify them in your truth. Your word is truth. <sup class=\"v\">18<\/sup> As you sent me into the world, even so I have sent them into the world. <sup class=\"v\">19<\/sup> For their sakes I sanctify myself, that they themselves also may be sanctified in truth."},{"type":"q","id":"17.3","field":"q115","text":"<b>Heart:<\/b> Consider the image of the umbrella. Jesus prayed, “keep them from the evil one” (v. 15). How does it feel to know that Jesus prays for your protection?"},{"type":"q","id":"17.4","field":"q116","text":"<b>Heart:<\/b> “Sanctify them in your truth. Your word is truth” (v. 17). How has God’s word shaped you?"},{"type":"h2","text":"Jesus Prays for All Believers"},{"type":"img","src":"img/john17-v20.jpg","w":1100,"h":733,"alt":"Many hands joined together"},{"type":"p","html":"<sup class=\"v\">20<\/sup> Not for these only do I pray, but for those also who will believe in me through their word, <sup class=\"v\">21<\/sup> that they may all be one; even as you, Father, are in me, and I in you, that they also may be one in us; that the world may believe that you sent me. <sup class=\"v\">22<\/sup> The glory which you have given me, I have given to them; that they may be one, even as we are one; <sup class=\"v\">23<\/sup> I in them, and you in me, that they may be perfected into one; that the world may know that you sent me and loved them, even as you loved me. <sup class=\"v\">24<\/sup> Father, I desire that they also whom you have given me be with me where I am, that they may see my glory, which you have given me, for you loved me before the foundation of the world. <sup class=\"v\">25<\/sup> Righteous Father, the world hasn’t known you, but I knew you; and these knew that you sent me. <sup class=\"v\">26<\/sup> I made known to them your name, and will make it known; that the love with which you loved me may be in them, and I in them.”"},{"type":"q","id":"17.5","field":"q117","text":"<b>Action:<\/b> Look at the image of the hands. Jesus prayed for all who would believe, “that they may all be one” (v. 20-21). What will you do this week to help believers live in unity?"},{"type":"q","id":"17.6","field":"q118","text":"<b>Heart:<\/b> Jesus prayed for those who would believe through the disciples’ message (v. 20). How does it feel to know that Jesus prayed for you?"},{"type":"q","id":"17.7","field":"q119","text":"<b>Action:<\/b> Which image in this chapter helps you pray? Use it as you pray this week."}],"prayer":"God, eternal life is to know you, “the only true God,” and Jesus Christ whom you sent (17:3). Give me wisdom as I read, and make me one with your people, as Jesus prayed (17:21)."},{"num":18,"hero":{"src":"img/john18-hero.jpg","w":1100,"h":733,"alt":"Torches burning in the dark"},"blocks":[{"type":"h2","text":"Jesus Is Arrested"},{"type":"p","html":"<sup class=\"v\">1<\/sup> When Jesus had spoken these words, he went out with his disciples over the brook Kidron, where there was a garden, into which he and his disciples entered. <sup class=\"v\">2<\/sup> Now Judas, who betrayed him, also knew the place, for Jesus often met there with his disciples. <sup class=\"v\">3<\/sup> Judas then, having taken a detachment of soldiers and officers from the chief priests and the Pharisees, came there with lanterns, torches, and weapons. <sup class=\"v\">4<\/sup> Jesus therefore, knowing all the things that were happening to him, went out, and said to them, “Who are you looking for?”"},{"type":"p","html":"<sup class=\"v\">5<\/sup> They answered him, “Jesus of Nazareth.”"},{"type":"p","html":"Jesus said to them, “I am he.”"},{"type":"p","html":"Judas also, who betrayed him, was standing with them. <sup class=\"v\">6<\/sup> When therefore he said to them, “I am he,” they went backward, and fell to the ground."},{"type":"p","html":"<sup class=\"v\">7<\/sup> Again therefore he asked them, “Who are you looking for?”"},{"type":"p","html":"They said, “Jesus of Nazareth.”"},{"type":"p","html":"<sup class=\"v\">8<\/sup> Jesus answered, “I told you that I am he. If therefore you seek me, let these go their way,” <sup class=\"v\">9<\/sup> that the word might be fulfilled which he spoke, “Of those whom you have given me, I have lost none.”"},{"type":"q","id":"18.1","field":"q120","text":"<b>Head:<\/b> Look at the image that opens this chapter. Judas came “with lanterns, torches, and weapons” (v. 3). Jesus stepped forward and said, “I am he” (v. 5). What do you notice about Jesus’ courage?"},{"type":"img","src":"img/john18-v10.jpg","w":1100,"h":733,"alt":"Old swords in a row"},{"type":"p","html":"<sup class=\"v\">10<\/sup> Simon Peter therefore, having a sword, drew it, struck the high priest’s servant, and cut off his right ear. The servant’s name was Malchus. <sup class=\"v\">11<\/sup> Jesus therefore said to Peter, “Put the sword into its sheath. The cup which the Father has given me, shall I not surely drink it?”"},{"type":"q","id":"18.2","field":"q121","text":"<b>Head:<\/b> Consider the image of the sword. Jesus told Peter, “Put the sword into its sheath” (v. 11). Why did Jesus refuse to fight?"},{"type":"h2","text":"Jesus Before Annas"},{"type":"p","html":"<sup class=\"v\">12<\/sup> So the detachment, the commanding officer, and the officers of the Jews seized Jesus and bound him, <sup class=\"v\">13<\/sup> and led him to Annas first, for he was father-in-law to Caiaphas, who was high priest that year. <sup class=\"v\">14<\/sup> Now it was Caiaphas who advised the Jews that it was expedient that one man should perish for the people."},{"type":"h2","text":"Peter Denies Jesus"},{"type":"p","html":"<sup class=\"v\">15<\/sup> Simon Peter followed Jesus, as did another disciple. Now that disciple was known to the high priest, and entered in with Jesus into the court of the high priest; <sup class=\"v\">16<\/sup> but Peter was standing at the door outside. So the other disciple, who was known to the high priest, went out and spoke to her who kept the door, and brought in Peter. <sup class=\"v\">17<\/sup> Then the maid who kept the door said to Peter, “Are you also one of this man’s disciples?”"},{"type":"p","html":"He said, “I am not.”"},{"type":"img","src":"img/john18-v18.jpg","w":1100,"h":729,"alt":"Glowing charcoal embers"},{"type":"p","html":"<sup class=\"v\">18<\/sup> Now the servants and the officers were standing there, having made a fire of coals, for it was cold. They were warming themselves. Peter was with them, standing and warming himself."},{"type":"h2","text":"The High Priest Questions Jesus"},{"type":"p","html":"<sup class=\"v\">19<\/sup> The high priest therefore asked Jesus about his disciples and about his teaching. <sup class=\"v\">20<\/sup> Jesus answered him, “I spoke openly to the world. I always taught in synagogues, and in the temple, where the Jews always meet. I said nothing in secret. <sup class=\"v\">21<\/sup> Why do you ask me? Ask those who have heard me what I said to them. Behold, they know the things which I said.”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> When he had said this, one of the officers standing by slapped Jesus with his hand, saying, “Do you answer the high priest like that?”"},{"type":"p","html":"<sup class=\"v\">23<\/sup> Jesus answered him, “If I have spoken evil, testify of the evil; but if well, why do you beat me?”"},{"type":"p","html":"<sup class=\"v\">24<\/sup> Annas sent him bound to Caiaphas, the high priest."},{"type":"q","id":"18.3","field":"q122","text":"<b>Action:<\/b> Jesus said, “I spoke openly to the world” (v. 20). What does Jesus’ honesty before his accusers teach you? Where will you speak honestly this week?"},{"type":"h2","text":"Peter Denies Jesus Again"},{"type":"p","html":"<sup class=\"v\">25<\/sup> Now Simon Peter was standing and warming himself. They said therefore to him, “You aren’t also one of his disciples, are you?”"},{"type":"p","html":"He denied it and said, “I am not.”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> One of the servants of the high priest, being a relative of him whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”"},{"type":"p","html":"<sup class=\"v\">27<\/sup> Peter therefore denied it again, and immediately the rooster crowed."},{"type":"q","id":"18.4","field":"q123","text":"<b>Heart:<\/b> Look at the image of the fire. Peter stood by the fire warming himself (v. 18) and said, “I am not” (v. 17). What makes it hard to stand with Jesus in front of others?"},{"type":"h2","text":"Jesus Before Pilate"},{"type":"p","html":"<sup class=\"v\">28<\/sup> They led Jesus therefore from Caiaphas into the Praetorium. It was early, and they themselves didn’t enter into the Praetorium, that they might not be defiled, but might eat the Passover. <sup class=\"v\">29<\/sup> Pilate therefore went out to them, and said, “What accusation do you bring against this man?”"},{"type":"p","html":"<sup class=\"v\">30<\/sup> They answered him, “If this man weren’t an evildoer, we wouldn’t have delivered him up to you.”"},{"type":"p","html":"<sup class=\"v\">31<\/sup> Pilate therefore said to them, “Take him yourselves, and judge him according to your law.”"},{"type":"p","html":"Therefore the Jews said to him, “It is illegal for us to put anyone to death,” <sup class=\"v\">32<\/sup> that the word of Jesus might be fulfilled, which he spoke, signifying by what kind of death he should die."},{"type":"p","html":"<sup class=\"v\">33<\/sup> Pilate therefore entered again into the Praetorium, called Jesus, and said to him, “Are you the King of the Jews?”"},{"type":"p","html":"<sup class=\"v\">34<\/sup> Jesus answered him, “Do you say this by yourself, or did others tell you about me?”"},{"type":"p","html":"<sup class=\"v\">35<\/sup> Pilate answered, “I’m not a Jew, am I? Your own nation and the chief priests delivered you to me. What have you done?”"},{"type":"img","src":"img/john18-v36.jpg","w":1100,"h":729,"alt":"A small silver crown"},{"type":"p","html":"<sup class=\"v\">36<\/sup> Jesus answered, “My Kingdom is not of this world. If my Kingdom were of this world, then my servants would fight, that I wouldn’t be delivered to the Jews. But now my Kingdom is not from here.”"},{"type":"p","html":"<sup class=\"v\">37<\/sup> Pilate therefore said to him, “Are you a king then?”"},{"type":"p","html":"Jesus answered, “You say that I am a king. For this reason I have been born, and for this reason I have come into the world, that I should testify to the truth. Everyone who is of the truth listens to my voice.”"},{"type":"p","html":"<sup class=\"v\">38<\/sup> Pilate said to him, “What is truth?”"},{"type":"q","id":"18.5","field":"q124","text":"<b>Head:<\/b> Consider the image of the crown. Jesus said, “My Kingdom is not of this world” (v. 36). What kind of kingdom is Jesus’ Kingdom?"},{"type":"q","id":"18.6","field":"q125","text":"<b>Heart:<\/b> Pilate asked, “What is truth?” (v. 38). How would you answer Pilate?"},{"type":"p","html":"When he had said this, he went out again to the Jews, and said to them, “I find no basis for a charge against him. <sup class=\"v\">39<\/sup> But you have a custom, that I should release someone to you at the Passover. Therefore, do you want me to release to you the King of the Jews?”"},{"type":"p","html":"<sup class=\"v\">40<\/sup> Then they all shouted again, saying, “Not this man, but Barabbas!” Now Barabbas was a robber."},{"type":"q","id":"18.7","field":"q126","text":"<b>Action:<\/b> The crowd chose Barabbas instead of Jesus (v. 40). What do people choose instead of Jesus today? What will you choose this week?"}],"prayer":"Father in heaven, your Son is a King who came to “testify to the truth” (18:37). Give me wisdom as I read, and help me listen to his voice."},{"num":19,"hero":{"src":"img/john19-hero.jpg","w":1100,"h":733,"alt":"A crown of thorns on an open Bible"},"blocks":[{"type":"h2","text":"Jesus Is Sentenced to Die"},{"type":"p","html":"<sup class=\"v\">1<\/sup> So Pilate then took Jesus, and flogged him. <sup class=\"v\">2<\/sup> The soldiers twisted thorns into a crown, and put it on his head, and dressed him in a purple garment. <sup class=\"v\">3<\/sup> They kept saying, “Hail, King of the Jews!” and they kept slapping him."},{"type":"q","id":"19.1","field":"q127","text":"<b>Head:<\/b> Look at the image that opens this chapter. “The soldiers twisted thorns into a crown, and put it on his head” (v. 2). What does the crown of thorns say about the kind of King Jesus is?"},{"type":"p","html":"<sup class=\"v\">4<\/sup> Then Pilate went out again, and said to them, “Behold, I bring him out to you, that you may know that I find no basis for a charge against him.”"},{"type":"p","html":"<sup class=\"v\">5<\/sup> Jesus therefore came out, wearing the crown of thorns and the purple garment. Pilate said to them, “Behold, the man!”"},{"type":"q","id":"19.2","field":"q128","text":"<b>Heart:<\/b> Pilate said, “Behold, the man!” (v. 5). When you look at Jesus in his suffering, what do you see?"},{"type":"p","html":"<sup class=\"v\">6<\/sup> When therefore the chief priests and the officers saw him, they shouted, saying, “Crucify! Crucify!”"},{"type":"p","html":"Pilate said to them, “Take him yourselves, and crucify him, for I find no basis for a charge against him.”"},{"type":"p","html":"<sup class=\"v\">7<\/sup> The Jews answered him, “We have a law, and by our law he ought to die, because he made himself the Son of God.”"},{"type":"p","html":"<sup class=\"v\">8<\/sup> When therefore Pilate heard this saying, he was more afraid. <sup class=\"v\">9<\/sup> He entered into the Praetorium again, and said to Jesus, “Where are you from?” But Jesus gave him no answer. <sup class=\"v\">10<\/sup> Pilate therefore said to him, “Aren’t you speaking to me? Don’t you know that I have power to release you and have power to crucify you?”"},{"type":"p","html":"<sup class=\"v\">11<\/sup> Jesus answered, “You would have no power at all against me, unless it were given to you from above. Therefore he who delivered me to you has greater sin.”"},{"type":"p","html":"<sup class=\"v\">12<\/sup> At this, Pilate was seeking to release him, but the Jews cried out, saying, “If you release this man, you aren’t Caesar’s friend! Everyone who makes himself a king speaks against Caesar!”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> When Pilate therefore heard these words, he brought Jesus out and sat down on the judgment seat at a place called “The Pavement”, but in Hebrew, “Gabbatha.” <sup class=\"v\">14<\/sup> Now it was the Preparation Day of the Passover, at about the sixth hour. He said to the Jews, “Behold, your King!”"},{"type":"p","html":"<sup class=\"v\">15<\/sup> They cried out, “Away with him! Away with him! Crucify him!”"},{"type":"p","html":"Pilate said to them, “Shall I crucify your King?”"},{"type":"p","html":"The chief priests answered, “We have no king but Caesar!”"},{"type":"p","html":"<sup class=\"v\">16<\/sup> So then he delivered him to them to be crucified. So they took Jesus and led him away."},{"type":"q","id":"19.3","field":"q129","text":"<b>Head:<\/b> Jesus told Pilate, “You would have no power at all against me, unless it were given to you from above” (v. 11). How does this change how we see earthly power?"},{"type":"h2","text":"The Crucifixion"},{"type":"img","src":"img/john19-v17.jpg","w":1100,"h":825,"alt":"Three crosses against a sunset sky"},{"type":"p","html":"<sup class=\"v\">17<\/sup> He went out, bearing his cross, to the place called “The Place of a Skull”, which is called in Hebrew, “Golgotha”, <sup class=\"v\">18<\/sup> where they crucified him, and with him two others, on either side one, and Jesus in the middle. <sup class=\"v\">19<\/sup> Pilate wrote a title also, and put it on the cross. There was written, “JESUS OF NAZARETH, THE KING OF THE JEWS.” <sup class=\"v\">20<\/sup> Therefore many of the Jews read this title, for the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek. <sup class=\"v\">21<\/sup> The chief priests of the Jews therefore said to Pilate, “Don’t write, ‘The King of the Jews,’ but, ‘he said, “I am King of the Jews.” ’ ”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> Pilate answered, “What I have written, I have written.”"},{"type":"img","src":"img/john19-v23.jpg","w":1100,"h":733,"alt":"Woven cloth"},{"type":"p","html":"<sup class=\"v\">23<\/sup> Then the soldiers, when they had crucified Jesus, took his garments and made four parts, to every soldier a part; and also the coat. Now the coat was without seam, woven from the top throughout. <sup class=\"v\">24<\/sup> Then they said to one another, “Let’s not tear it, but cast lots for it to decide whose it will be,” that the Scripture might be fulfilled, which says,"},{"type":"q","id":"19.4","field":"q130","text":"<b>Heart:<\/b> Consider the image of the woven cloth. The soldiers cast lots for Jesus’ seamless coat (v. 23-24). What does it mean to you that even this detail fulfilled Scripture?"},{"type":"poem","lines":["“They parted my garments among them.","For my cloak they cast lots.”"]},{"type":"p","html":"Therefore the soldiers did these things. <sup class=\"v\">25<\/sup> But standing by Jesus’ cross were his mother, his mother’s sister, Mary the wife of Clopas, and Mary Magdalene. <sup class=\"v\">26<\/sup> Therefore when Jesus saw his mother, and the disciple whom he loved standing there, he said to his mother, “Woman, behold, your son!” <sup class=\"v\">27<\/sup> Then he said to the disciple, “Behold, your mother!” From that hour, the disciple took her to his own home."},{"type":"q","id":"19.5","field":"q131","text":"<b>Action:<\/b> From the cross Jesus said to his mother, “Woman, behold your son!” and to his disciple, “Behold, your mother!” (v. 26-27). Jesus cared for others even in his suffering. Whom will you care for this week, even in a hard season?"},{"type":"h2","text":"The Death of Jesus"},{"type":"p","html":"<sup class=\"v\">28<\/sup> After this, Jesus, seeing that all things were now finished, that the Scripture might be fulfilled, said, “I am thirsty.” <sup class=\"v\">29<\/sup> Now a vessel full of vinegar was set there; so they put a sponge full of the vinegar on hyssop, and held it at his mouth. <sup class=\"v\">30<\/sup> When Jesus therefore had received the vinegar, he said, “It is finished.” He bowed his head, and gave up his spirit."},{"type":"p","html":"<sup class=\"v\">31<\/sup> Therefore the Jews, because it was the Preparation Day, so that the bodies wouldn’t remain on the cross on the Sabbath (for that Sabbath was a special one), asked of Pilate that their legs might be broken, and that they might be taken away. <sup class=\"v\">32<\/sup> Therefore the soldiers came, and broke the legs of the first, and of the other who was crucified with him; <sup class=\"v\">33<\/sup> but when they came to Jesus, and saw that he was already dead, they didn’t break his legs. <sup class=\"v\">34<\/sup> However one of the soldiers pierced his side with a spear, and immediately blood and water came out. <sup class=\"v\">35<\/sup> He who has seen has testified, and his testimony is true. He knows that he tells the truth, that you may believe. <sup class=\"v\">36<\/sup> For these things happened that the Scripture might be fulfilled, “A bone of him will not be broken.” <sup class=\"v\">37<\/sup> Again another Scripture says, “They will look on him whom they pierced.”"},{"type":"q","id":"19.6","field":"q132","text":"<b>Heart:<\/b> Look at the image of the crosses. Jesus said, “It is finished” (v. 30). What was finished? What does it mean for you?"},{"type":"h2","text":"The Burial of Jesus"},{"type":"img","src":"img/john19-v38.jpg","w":1100,"h":736,"alt":"A stone tomb building in a garden"},{"type":"p","html":"<sup class=\"v\">38<\/sup> After these things, Joseph of Arimathaea, being a disciple of Jesus, but secretly for fear of the Jews, asked of Pilate that he might take away Jesus’ body. Pilate gave him permission. He came therefore and took away his body. <sup class=\"v\">39<\/sup> Nicodemus, who at first came to Jesus by night, also came bringing a mixture of myrrh and aloes, about a hundred Roman pounds. <sup class=\"v\">40<\/sup> So they took Jesus’ body, and bound it in linen cloths with the spices, as the custom of the Jews is to bury. <sup class=\"v\">41<\/sup> Now in the place where he was crucified there was a garden. In the garden was a new tomb in which no man had ever yet been laid. <sup class=\"v\">42<\/sup> Then because of the Jews’ Preparation Day (for the tomb was near at hand) they laid Jesus there."},{"type":"q","id":"19.7","field":"q133","text":"<b>Action:<\/b> Consider the image of the tomb. Joseph of Arimathea, a secret disciple, and Nicodemus came forward to bury Jesus (v. 38-39). When have you had to show your faith openly? Where will you show it this week?"}],"prayer":"God, on the cross your Son said, “It is finished” (19:30), and even there he cared for his mother (19:26–27). Give me wisdom as I read, and help me rest in what he has done for me."},{"num":20,"hero":{"src":"img/john20-hero.jpg","w":1100,"h":733,"alt":"The sun breaking through trees at dawn"},"blocks":[{"type":"h2","text":"The Empty Tomb"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now on the first day of the week, Mary Magdalene went early, while it was still dark, to the tomb, and saw the stone taken away from the tomb. <sup class=\"v\">2<\/sup> Therefore she ran and came to Simon Peter and to the other disciple whom Jesus loved, and said to them, “They have taken away the Lord out of the tomb, and we don’t know where they have laid him!”"},{"type":"img","src":"img/john20-v03.jpg","w":1100,"h":734,"alt":"A runner on an open road"},{"type":"p","html":"<sup class=\"v\">3<\/sup> Therefore Peter and the other disciple went out, and they went toward the tomb. <sup class=\"v\">4<\/sup> They both ran together. The other disciple outran Peter, and came to the tomb first. <sup class=\"v\">5<\/sup> Stooping and looking in, he saw the linen cloths lying, yet he didn’t enter in. <sup class=\"v\">6<\/sup> Then Simon Peter came, following him, and entered into the tomb. He saw the linen cloths lying, <sup class=\"v\">7<\/sup> and the cloth that had been on his head, not lying with the linen cloths, but rolled up in a place by itself. <sup class=\"v\">8<\/sup> So then the other disciple who came first to the tomb also entered in, and he saw and believed. <sup class=\"v\">9<\/sup> For as yet they didn’t know the Scripture, that he must rise from the dead. <sup class=\"v\">10<\/sup> So the disciples went away again to their own homes."},{"type":"q","id":"20.1","field":"q134","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Mary came to the tomb “while it was still dark” (v. 1). What is it like to come to Jesus in the dark?"},{"type":"q","id":"20.2","field":"q135","text":"<b>Head:<\/b> Consider the image of the runner. Peter and the other disciple ran to the tomb (v. 3-4), and the other disciple “saw and believed” (v. 8). What do you think he saw that made him believe?"},{"type":"h2","text":"Jesus Appears to Mary Magdalene"},{"type":"img","src":"img/john20-v11.jpg","w":1100,"h":692,"alt":"A flowering tree in early morning sunlight"},{"type":"p","html":"<sup class=\"v\">11<\/sup> But Mary was standing outside at the tomb weeping. So as she wept, she stooped and looked into the tomb, <sup class=\"v\">12<\/sup> and she saw two angels in white sitting, one at the head, and one at the feet, where the body of Jesus had lain. <sup class=\"v\">13<\/sup> They asked her, “Woman, why are you weeping?”"},{"type":"p","html":"She said to them, “Because they have taken away my Lord, and I don’t know where they have laid him.” <sup class=\"v\">14<\/sup> When she had said this, she turned around and saw Jesus standing, and didn’t know that it was Jesus."},{"type":"p","html":"<sup class=\"v\">15<\/sup> Jesus said to her, “Woman, why are you weeping? Who are you looking for?”"},{"type":"p","html":"She, supposing him to be the gardener, said to him, “Sir, if you have carried him away, tell me where you have laid him, and I will take him away.”"},{"type":"p","html":"<sup class=\"v\">16<\/sup> Jesus said to her, “Mary.”"},{"type":"p","html":"She turned and said to him, “Rabboni!” which is to say, “Teacher!”"},{"type":"p","html":"<sup class=\"v\">17<\/sup> Jesus said to her, “Don’t hold me, for I haven’t yet ascended to my Father; but go to my brothers and tell them, ‘I am ascending to my Father and your Father, to my God and your God.’ ”"},{"type":"p","html":"<sup class=\"v\">18<\/sup> Mary Magdalene came and told the disciples that she had seen the Lord, and that he had said these things to her."},{"type":"q","id":"20.3","field":"q136","text":"<b>Heart:<\/b> Look at the image of the garden. Jesus said, “Mary” (v. 16), and she knew him. What does it mean to you that Jesus calls you by name?"},{"type":"h2","text":"Jesus Appears to the Disciples"},{"type":"img","src":"img/john20-v19.jpg","w":1100,"h":1031,"alt":"An old door with heavy iron fittings"},{"type":"p","html":"<sup class=\"v\">19<\/sup> When therefore it was evening on that day, the first day of the week, and when the doors were locked where the disciples were assembled, for fear of the Jews, Jesus came and stood in the middle, and said to them, “Peace be to you.”"},{"type":"p","html":"<sup class=\"v\">20<\/sup> When he had said this, he showed them his hands and his side. The disciples therefore were glad when they saw the Lord. <sup class=\"v\">21<\/sup> Jesus therefore said to them again, “Peace be to you. As the Father has sent me, even so I send you.” <sup class=\"v\">22<\/sup> When he had said this, he breathed on them, and said to them, “Receive the Holy Spirit! <sup class=\"v\">23<\/sup> If you forgive anyone’s sins, they have been forgiven them. If you retain anyone’s sins, they have been retained.”"},{"type":"q","id":"20.4","field":"q137","text":"<b>Heart:<\/b> Consider the image of the locked door. The disciples were behind locked doors, afraid, yet Jesus came and said, “Peace be to you” (v. 19). What fears lock you in? How does Jesus’ peace meet you there?"},{"type":"q","id":"20.5","field":"q138","text":"<b>Action:<\/b> “As the Father has sent me, even so I send you” (v. 21). Where is Jesus sending you? What will you do there this week?"},{"type":"h2","text":"Jesus and Thomas"},{"type":"p","html":"<sup class=\"v\">24<\/sup> But Thomas, one of the twelve, called Didymus, wasn’t with them when Jesus came. <sup class=\"v\">25<\/sup> The other disciples therefore said to him, “We have seen the Lord!”"},{"type":"p","html":"But he said to them, “Unless I see in his hands the print of the nails, put my finger into the print of the nails, and put my hand into his side, I will not believe.”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> After eight days again his disciples were inside and Thomas was with them. Jesus came, the doors being locked, and stood in the middle, and said, “Peace be to you.” <sup class=\"v\">27<\/sup> Then he said to Thomas, “Reach here your finger, and see my hands. Reach here your hand, and put it into my side. Don’t be unbelieving, but believing.”"},{"type":"p","html":"<sup class=\"v\">28<\/sup> Thomas answered him, “My Lord and my God!”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> Jesus said to him, “Because you have seen me, you have believed. Blessed are those who have not seen, and have believed.”"},{"type":"q","id":"20.6","field":"q139","text":"<b>Head:<\/b> Thomas said, “My Lord and my God!” (v. 28). Jesus said, “Blessed are those who have not seen, and have believed” (v. 29). How does this blessing include those of us who have not seen?"},{"type":"h2","text":"Why John Wrote This Book"},{"type":"p","html":"<sup class=\"v\">30<\/sup> Therefore Jesus did many other signs in the presence of his disciples, which are not written in this book; <sup class=\"v\">31<\/sup> but these are written, that you may believe that Jesus is the Christ, the Son of God, and that believing you may have life in his name."},{"type":"q","id":"20.7","field":"q140","text":"<b>Action:<\/b> John wrote these things “that you may believe that Jesus is the Christ, the Son of God, and that believing you may have life in his name” (v. 31). How has reading John helped your faith? With whom will you share what you have learned?"}],"prayer":"Father in heaven, you raised Jesus from the dead, and Thomas cried, “My Lord and my God!” (20:28). Give me wisdom as I read, and help me believe and have life in his name (20:31)."},{"num":21,"hero":{"src":"img/john21-hero.jpg","w":1100,"h":734,"alt":"A man standing on a misty lake shore in the morning"},"blocks":[{"type":"h2","text":"Breakfast by the Sea"},{"type":"p","html":"<sup class=\"v\">1<\/sup> After these things, Jesus revealed himself again to the disciples at the sea of Tiberias. He revealed himself this way. <sup class=\"v\">2<\/sup> Simon Peter, Thomas called Didymus, Nathanael of Cana in Galilee, and the sons of Zebedee, and two others of his disciples were together. <sup class=\"v\">3<\/sup> Simon Peter said to them, “I’m going fishing.”"},{"type":"p","html":"They told him, “We are also coming with you.” They immediately went out, and entered into the boat. That night, they caught nothing. <sup class=\"v\">4<\/sup> But when day had already come, Jesus stood on the beach, yet the disciples didn’t know that it was Jesus. <sup class=\"v\">5<\/sup> Jesus therefore said to them, “Children, have you anything to eat?”"},{"type":"q","id":"21.1","field":"q141","text":"<b>Heart:<\/b> Look at the image that opens this chapter. The disciples fished all night and caught nothing (v. 3). When have you worked hard and come up empty?"},{"type":"p","html":"They answered him, “No.”"},{"type":"img","src":"img/john21-v06.jpg","w":1100,"h":733,"alt":"Fishermen working with their nets"},{"type":"p","html":"<sup class=\"v\">6<\/sup> He said to them, “Cast the net on the right side of the boat, and you will find some.”"},{"type":"p","html":"They cast it therefore, and now they weren’t able to draw it in for the multitude of fish. <sup class=\"v\">7<\/sup> That disciple therefore whom Jesus loved said to Peter, “It’s the Lord!”"},{"type":"p","html":"So when Simon Peter heard that it was the Lord, he wrapped his coat around himself (for he was naked), and threw himself into the sea. <sup class=\"v\">8<\/sup> But the other disciples came in the little boat (for they were not far from the land, but about two hundred cubits away), dragging the net full of fish. <sup class=\"v\">9<\/sup> So when they got out on the land, they saw a fire of coals there, with fish and bread laid on it. <sup class=\"v\">10<\/sup> Jesus said to them, “Bring some of the fish which you have just caught.”"},{"type":"p","html":"<sup class=\"v\">11<\/sup> Simon Peter went up, and drew the net to land, full of one hundred fifty-three great fish. Even though there were so many, the net wasn’t torn."},{"type":"q","id":"21.2","field":"q142","text":"<b>Heart:<\/b> Consider the image of the net. Jesus said, “Cast the net on the right side of the boat, and you will find some” (v. 6). When has following Jesus’ direction made the difference?"},{"type":"img","src":"img/john21-v12.jpg","w":1100,"h":733,"alt":"Fish roasting over an open fire"},{"type":"p","html":"<sup class=\"v\">12<\/sup> Jesus said to them, “Come and eat breakfast!”"},{"type":"p","html":"None of the disciples dared inquire of him, “Who are you?” knowing that it was the Lord."},{"type":"p","html":"<sup class=\"v\">13<\/sup> Then Jesus came and took the bread, gave it to them, and the fish likewise. <sup class=\"v\">14<\/sup> This is now the third time that Jesus was revealed to his disciples after he had risen from the dead."},{"type":"q","id":"21.3","field":"q143","text":"<b>Head:<\/b> Look at the image of the fire. Jesus said, “Come and eat breakfast!” (v. 12). What does this simple meal tell you about Jesus?"},{"type":"h2","text":"Jesus Restores Peter"},{"type":"img","src":"img/john21-v15.jpg","w":1100,"h":733,"alt":"A ewe with two young lambs"},{"type":"p","html":"<sup class=\"v\">15<\/sup> So when they had eaten their breakfast, Jesus said to Simon Peter, “Simon, son of Jonah, do you love me more than these?”"},{"type":"p","html":"He said to him, “Yes, Lord; you know that I have affection for you.”"},{"type":"p","html":"He said to him, “Feed my lambs.” <sup class=\"v\">16<\/sup> He said to him again a second time, “Simon, son of Jonah, do you love me?”"},{"type":"p","html":"He said to him, “Yes, Lord; you know that I have affection for you.”"},{"type":"p","html":"He said to him, “Tend my sheep.” <sup class=\"v\">17<\/sup> He said to him the third time, “Simon, son of Jonah, do you have affection for me?”"},{"type":"q","id":"21.4","field":"q144","text":"<b>Head:<\/b> Jesus asked Peter three times, “Do you love me?” (v. 15-17). Why do you think he asked three times?"},{"type":"q","id":"21.5","field":"q145","text":"<b>Action:<\/b> Consider the image of the lambs. Jesus told Peter, “Feed my lambs” (v. 15). Who has Jesus given you to care for? How will you feed them this week?"},{"type":"p","html":"Peter was grieved because he asked him the third time, “Do you have affection for me?” He said to him, “Lord, you know everything. You know that I have affection for you.”"},{"type":"p","html":"Jesus said to him, “Feed my sheep. <sup class=\"v\">18<\/sup> Most certainly I tell you, when you were young, you dressed yourself and walked where you wanted to. But when you are old, you will stretch out your hands, and another will dress you and carry you where you don’t want to go.”"},{"type":"p","html":"<sup class=\"v\">19<\/sup> Now he said this, signifying by what kind of death he would glorify God. When he had said this, he said to him, “Follow me.”"},{"type":"h2","text":"Jesus and the Beloved Disciple"},{"type":"p","html":"<sup class=\"v\">20<\/sup> Then Peter, turning around, saw a disciple following. This was the disciple whom Jesus loved, the one who had also leaned on Jesus’ breast at the supper and asked, “Lord, who is going to betray you?” <sup class=\"v\">21<\/sup> Peter seeing him, said to Jesus, “Lord, what about this man?”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> Jesus said to him, “If I desire that he stay until I come, what is that to you? You follow me.” <sup class=\"v\">23<\/sup> This saying therefore went out among the brothers, that this disciple wouldn’t die. Yet Jesus didn’t say to him that he wouldn’t die, but, “If I desire that he stay until I come, what is that to you?” <sup class=\"v\">24<\/sup> This is the disciple who testifies about these things, and wrote these things. We know that his witness is true. <sup class=\"v\">25<\/sup> There are also many other things which Jesus did, which if they would all be written, I suppose that even the world itself wouldn’t have room for the books that would be written."},{"type":"q","id":"21.6","field":"q146","text":"<b>Action:<\/b> Jesus said to Peter, “Follow me” (v. 19) and “You follow me” (v. 22). What will following Jesus look like for you this week?"},{"type":"q","id":"21.7","field":"q147","text":"<b>Heart:<\/b> As you look back over the images in all of John, which one will stay with you? Why?"}],"prayer":"God, your risen Son restored Peter and told him, “Follow me” (21:19). Give me wisdom as I read, and help me show my love for him by caring for his people (21:15–17)."}],"discussion":{"intro":"Linking LIFE and SCRIPTURE using IMAGES is best done by asking questions. Visual John provides many such questions within the chapters. Below are ten types of image-based questions. These types and examples can help you craft your own questions as you lead group discussions and reflect personally on a passage.","types":[["Image to Story",null,["What story do you see in this image?","If an image is worth a thousand words, what words would you put with this image?"]],["Response to Image",null,["How do you respond to this image?","What emotions or feelings surface in you as you look at the picture?","How might these emotions link to your life story?"]],["Imaginations","a mental image, without looking at a picture",["As you consider the Bible story, how would you imagine it playing out?","How might you imagine yourself in that story?"]],["Link Image to Person",null,["If you put yourself in this picture, where would you be?","What would you be feeling? Thinking? Doing? Saying?","How might this image connect with your longings as a human being? (Consider longings such as: belong, intimacy, protect, provide, build, order, nurture, change, justice, mercy, explore, know, create, transcend.)","What message does this image convey? How might the image appeal to your decisions in life (choice of friends, career, purchases)?"]],["Link Image to Concept",null,["As you look at this image, how might it connect with the concept of grace, mercy, identity or power?","Consider these deep metaphors: balance, transformation, journey, container, connection, resource, control. (Gerald and Lindsay Zaltman, 2008). Which metaphor best relates to this image? Explain."]],["Link Image to Attractions, Aversions and Decisions",null,["Are you attracted to this image? If so, why? How do you usually manage your attractions?","Do you dislike this image? If so, why? How do you usually manage your aversions?","How might this image influence the way you make decisions?"]],["Link Image to God",null,["Where would you imagine God in this picture?","What is he doing? Thinking? Feeling? Saying? Explain why."]],["Link Image to Bible",null,["How do you see this image connecting with this passage?","What image might better connect with this passage for you?"]],["Link Image to Culture",null,["Our culture surrounds us with images. Which images in the past week relate to this passage? How did you respond to them?","What is the message of that image from the culture?","Does that cultural message align with the message of the Bible? Explain."]],["Link Image to Transformation",null,["As you reflect on this image and the passage, what surfaces in your heart? Where are you open to change, or closed to change?","How do this image and passage shape your view of God and his purposes? Is your heart aligned with God’s purposes?","How might this image encourage you in your daily walk with God?"]]]},"credits":[{"where":"Cover","desc":"Sunlight on the Sea of Galilee seen from a boat","page":"https://pixabay.com/photos/the-sea-galilee-4683829/","user":""},{"where":"Welcome page","desc":"Reading glasses resting on an open book","page":"https://pixabay.com/photos/eyeglasses-7137804/","user":""},{"where":"Welcome page","desc":"An old hurricane lantern glowing","page":"https://pixabay.com/photos/kerosene-lamp-2950812/","user":""},{"where":"Welcome page","desc":"A stream running over stones through a green forest","page":"https://pixabay.com/photos/stream-4451101/","user":""},{"where":"John 1, opening photo","desc":"A glowing nebula among the stars","page":"https://pixabay.com/photos/christmas-background-11107/","user":""},{"where":"John 1, The Word Became Flesh","desc":"A single candle shining in the darkness","page":"https://pixabay.com/photos/candle-2038736/","user":""},{"where":"John 1, The Lamb of God","desc":"A young lamb looking toward the camera","page":"https://pixabay.com/photos/lamb-292512/","user":""},{"where":"John 1, Philip and Nathanael","desc":"Leaves and green figs on a fig tree","page":"https://pixabay.com/photos/fig-tree-7007873/","user":""},{"where":"John 2, opening photo","desc":"Old clay jars beside a stone wall","page":"https://pixabay.com/photos/amphora-3700525/","user":""},{"where":"John 2, The Wedding at Cana","desc":"Red wine being poured into a glass","page":"https://pixabay.com/photos/wine-4813260/","user":""},{"where":"John 2, Jesus Clears the Temple","desc":"Ruined stone columns of an ancient building","page":"https://pixabay.com/photos/chorizin-4657813/","user":""},{"where":"John 2, Jesus Knows All People","desc":"A crowd of people crossing a city street","page":"https://pixabay.com/photos/japan-220696/","user":""},{"where":"John 3, opening photo","desc":"An old town street with lamps glowing at dusk","page":"https://pixabay.com/photos/old-town-6300696/","user":""},{"where":"John 3, Jesus and Nicodemus","desc":"Tall grass bending in the wind","page":"https://pixabay.com/photos/marram-grass-4315443/","user":""},{"where":"John 3, God So Loved the World","desc":"The earth seen from space","page":"https://pixabay.com/photos/earth-5382601/","user":""},{"where":"John 3, John the Baptist Points to Jesus","desc":"A river rushing through a forest","page":"https://pixabay.com/photos/mckenzie-river-5129717/","user":""},{"where":"John 4, opening photo","desc":"An old stone well in a grassy field","page":"https://pixabay.com/photos/fountain-788430/","user":""},{"where":"John 4, Jesus and the Samaritan W
